// YEREL DEPO — IndexedDB.
//
// Neden sunucu değil: denetim sahada, çoğu zaman kapsama alanı zayıf bir
// üretim hattında yapılır. Her kayıt önce CİHAZA yazılır; internet olmasa da
// denetim kesintisiz sürer, Excel yine üretilir. Sunucuya gönderme (varsa)
// sonradan eklenebilecek ayrı bir katmandır — veri kaybı riski buraya taşınmaz.

const VERITABANI = 'aracAudit';
const SURUM = 1;
const DENETIMLER = 'denetimler';
const FOTOGRAFLAR = 'fotograflar';
const AYARLAR = 'ayarlar';
const SAYACLAR = 'sayaclar';

let _db = null;

function db() {
  if (_db) return _db;
  _db = new Promise((coz, redi) => {
    const istek = indexedDB.open(VERITABANI, SURUM);
    istek.onupgradeneeded = () => {
      const d = istek.result;
      if (!d.objectStoreNames.contains(DENETIMLER)) {
        const s = d.createObjectStore(DENETIMLER, { keyPath: 'id' });
        s.createIndex('baslangic', 'baslangic');
        s.createIndex('vin', 'vin');
      }
      if (!d.objectStoreNames.contains(FOTOGRAFLAR)) {
        const s = d.createObjectStore(FOTOGRAFLAR, { keyPath: 'id' });
        s.createIndex('denetimId', 'denetimId');
      }
      if (!d.objectStoreNames.contains(AYARLAR)) d.createObjectStore(AYARLAR, { keyPath: 'anahtar' });
      if (!d.objectStoreNames.contains(SAYACLAR)) d.createObjectStore(SAYACLAR, { keyPath: 'kalip' });
    };
    istek.onsuccess = () => coz(istek.result);
    istek.onerror = () => redi(istek.error);
  });
  return _db;
}

function islem(depoAdlari, mod, isGovdesi) {
  return db().then((d) => new Promise((coz, redi) => {
    const t = d.transaction(depoAdlari, mod);
    let sonuc;
    t.oncomplete = () => coz(sonuc);
    t.onerror = () => redi(t.error);
    t.onabort = () => redi(t.error);
    sonuc = isGovdesi(t);
    if (sonuc instanceof Promise) sonuc.then((v) => { sonuc = v; });
  }));
}

const istekSoz = (istek) => new Promise((coz, redi) => {
  istek.onsuccess = () => coz(istek.result);
  istek.onerror = () => redi(istek.error);
});

function kimlikUret(onEk = 'd') {
  return `${onEk}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

// --- DENETİMLER ------------------------------------------------------------

async function denetimKaydet(denetim) {
  const d = await db();
  const t = d.transaction(DENETIMLER, 'readwrite');
  t.objectStore(DENETIMLER).put(denetim);
  await new Promise((c, r) => { t.oncomplete = c; t.onerror = () => r(t.error); });
  return denetim;
}

async function denetimGetir(id) {
  const d = await db();
  return istekSoz(d.transaction(DENETIMLER).objectStore(DENETIMLER).get(id));
}

/** En yeni denetimler önce. */
async function denetimListele(enFazla = 100) {
  const d = await db();
  const hepsi = await istekSoz(d.transaction(DENETIMLER).objectStore(DENETIMLER).getAll());
  return hepsi.sort((a, b) => String(b.baslangic).localeCompare(String(a.baslangic))).slice(0, enFazla);
}

async function denetimSil(id) {
  const fotolar = await fotograflariGetir(id);
  const d = await db();
  const t = d.transaction([DENETIMLER, FOTOGRAFLAR], 'readwrite');
  t.objectStore(DENETIMLER).delete(id);
  for (const f of fotolar) t.objectStore(FOTOGRAFLAR).delete(f.id);
  return new Promise((c, r) => { t.oncomplete = () => c(true); t.onerror = () => r(t.error); });
}

// --- FOTOĞRAFLAR -----------------------------------------------------------

/**
 * @param {string} denetimId
 * @param {Blob} blob küçültülmüş JPEG
 * @param {{en:number, boy:number, hataId?:string}} bilgi
 */
async function fotografKaydet(denetimId, blob, bilgi = {}) {
  const kayit = {
    id: kimlikUret('f'), denetimId, blob,
    en: bilgi.en ?? 0, boy: bilgi.boy ?? 0,
    hataId: bilgi.hataId ?? null, zaman: new Date().toISOString(),
  };
  const d = await db();
  const t = d.transaction(FOTOGRAFLAR, 'readwrite');
  t.objectStore(FOTOGRAFLAR).put(kayit);
  await new Promise((c, r) => { t.oncomplete = c; t.onerror = () => r(t.error); });
  return kayit;
}

async function fotografGetir(id) {
  const d = await db();
  return istekSoz(d.transaction(FOTOGRAFLAR).objectStore(FOTOGRAFLAR).get(id));
}

async function fotograflariGetir(denetimId) {
  const d = await db();
  return istekSoz(d.transaction(FOTOGRAFLAR).objectStore(FOTOGRAFLAR).index('denetimId').getAll(denetimId));
}

async function fotografSil(id) {
  const d = await db();
  const t = d.transaction(FOTOGRAFLAR, 'readwrite');
  t.objectStore(FOTOGRAFLAR).delete(id);
  return new Promise((c, r) => { t.oncomplete = () => c(true); t.onerror = () => r(t.error); });
}

/** Excel üretimi için: fotoId -> { bayt } haritası. */
async function fotografBaytlari(denetimId) {
  const kayitlar = await fotograflariGetir(denetimId);
  const harita = new Map();
  for (const k of kayitlar) {
    harita.set(k.id, { bayt: new Uint8Array(await k.blob.arrayBuffer()), en: k.en, boy: k.boy });
  }
  return harita;
}

// --- AYARLAR ---------------------------------------------------------------

async function ayarOku(anahtar, varsayilan = null) {
  const d = await db();
  const k = await istekSoz(d.transaction(AYARLAR).objectStore(AYARLAR).get(anahtar));
  return k ? k.deger : varsayilan;
}

async function ayarYaz(anahtar, deger) {
  const d = await db();
  const t = d.transaction(AYARLAR, 'readwrite');
  t.objectStore(AYARLAR).put({ anahtar, deger });
  return new Promise((c, r) => { t.oncomplete = () => c(deger); t.onerror = () => r(t.error); });
}

// --- KULLANIM SAYACI -------------------------------------------------------
// "Hatalar genelde benzer" — uygulama bunu ÖĞRENİR. Her kaydedilen parça+hata
// ikilisi sayılır; hızlı seçim çubuğu bu sayaca göre yeniden sıralanır.

async function kalipSay(parcaId, hataTipiId) {
  const kalip = `${parcaId}.${hataTipiId}`;
  const d = await db();
  const t = d.transaction(SAYACLAR, 'readwrite');
  const s = t.objectStore(SAYACLAR);
  const mevcut = await istekSoz(s.get(kalip));
  s.put({ kalip, sayi: (mevcut?.sayi ?? 0) + 1, son: new Date().toISOString() });
  return new Promise((c, r) => { t.oncomplete = () => c(true); t.onerror = () => r(t.error); });
}

async function sikKullanilanlar(enFazla = 12) {
  const d = await db();
  const hepsi = await istekSoz(d.transaction(SAYACLAR).objectStore(SAYACLAR).getAll());
  return hepsi
    .sort((a, b) => b.sayi - a.sayi || String(b.son).localeCompare(String(a.son)))
    .slice(0, enFazla)
    .map((k) => ({ ...k, parcaId: k.kalip.slice(0, k.kalip.lastIndexOf('.')), hataTipiId: k.kalip.slice(k.kalip.lastIndexOf('.') + 1) }));
}

// --- YEDEK -----------------------------------------------------------------

/** Tüm denetimleri (fotoğraflar base64 olarak) tek JSON'a alır. */
async function yedekAl() {
  const denetimler = await denetimListele(10000);
  const fotograflar = [];
  for (const d of denetimler) {
    for (const f of await fotograflariGetir(d.id)) {
      fotograflar.push({
        id: f.id, denetimId: f.denetimId, hataId: f.hataId, en: f.en, boy: f.boy, zaman: f.zaman,
        veri: await blobBase64(f.blob),
      });
    }
  }
  return { surum: 1, alindi: new Date().toISOString(), denetimler, fotograflar };
}

async function yedekYukle(yedek) {
  if (!yedek?.denetimler) throw new Error('Yedek dosyası tanınmadı.');
  for (const d of yedek.denetimler) await denetimKaydet(d);
  const dbh = await db();
  for (const f of yedek.fotograflar ?? []) {
    const blob = base64Blob(f.veri);
    const t = dbh.transaction(FOTOGRAFLAR, 'readwrite');
    t.objectStore(FOTOGRAFLAR).put({ ...f, blob, veri: undefined });
    await new Promise((c, r) => { t.oncomplete = c; t.onerror = () => r(t.error); });
  }
  return { denetim: yedek.denetimler.length, fotograf: (yedek.fotograflar ?? []).length };
}

function blobBase64(blob) {
  return new Promise((coz, redi) => {
    const o = new FileReader();
    o.onload = () => coz(o.result);
    o.onerror = () => redi(o.error);
    o.readAsDataURL(blob);
  });
}

function base64Blob(veriUrl) {
  const [bas, govde] = String(veriUrl).split(',');
  const tur = /:(.*?);/.exec(bas)?.[1] ?? 'image/jpeg';
  const ham = atob(govde);
  const bayt = new Uint8Array(ham.length);
  for (let i = 0; i < ham.length; i++) bayt[i] = ham.charCodeAt(i);
  return new Blob([bayt], { type: tur });
}

/** Depolama kotası — "yer doldu" hatasını sahada değil, önceden görelim. */
async function depoDurumu() {
  if (!navigator.storage?.estimate) return null;
  const { usage = 0, quota = 0 } = await navigator.storage.estimate();
  return { kullanilan: usage, kota: quota, oran: quota ? usage / quota : 0 };
}

const depo = { db, kimlikUret, denetimKaydet, denetimGetir, denetimListele, denetimSil, fotografKaydet, fotografGetir, fotograflariGetir, fotografSil, fotografBaytlari, ayarOku, ayarYaz, kalipSay, sikKullanilanlar, yedekAl, yedekYukle, depoDurumu };

/* ===== rapor.js ===== */
// RAPOR ÜRETİMİ — Excel (.xlsx), CSV ve yazdırılabilir HTML.
//
// ŞABLONA UYARLAMA: Excel'in sütun düzeni TEK BİR YERDEN, aşağıdaki SUTUNLAR
// dizisinden gelir. Kendi şablonunuzu gönderdiğinizde değiştirilecek yer
// yalnızca burasıdır — sıra, başlık, genişlik ve hücre değeri. `fotograf: true`
// işaretli sütun, fotoğrafların Excel'in İÇİNE gömüleceği sütundur.





/** Fotoğrafın Excel'de kaplayacağı en büyük ölçü (piksel). */
const FOTO_EN = 150;
const FOTO_BOY = 112;

const bicimTarih = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso);
  const iki = (n) => String(n).padStart(2, '0');
  return `${iki(d.getDate())}.${iki(d.getMonth() + 1)}.${d.getFullYear()} ${iki(d.getHours())}:${iki(d.getMinutes())}`;
};
const bicimSaat = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};

// ---------------------------------------------------------------------------
// SÜTUN DÜZENİ — şablonunuza uyarlanacak tek nokta
// ---------------------------------------------------------------------------
const SUTUNLAR = [
  { anahtar: 'sira',    baslik: '#',                  baslikEn: '#',                genislik: 5,  stil: STIL.SAYI,       deger: (h, i) => i + 1 },
  { anahtar: 'kod',     baslik: 'Hata Kodu',          baslikEn: 'Defect Code',      genislik: 24, stil: STIL.GOVDE,      deger: (h) => hataKodu(h) },
  { anahtar: 'bolge',   baslik: 'Bölge',              baslikEn: 'Zone',             genislik: 20, stil: STIL.GOVDE,      deger: (h, i, c) => (c.dil === 'en' ? PARCA_INDEKS[h.parcaId]?.bolgeEn : PARCA_INDEKS[h.parcaId]?.bolgeAd) ?? '' },
  { anahtar: 'parca',   baslik: 'Parça',              baslikEn: 'Part',             genislik: 26, stil: STIL.GOVDE,      deger: (h, i, c) => (c.dil === 'en' ? PARCA_INDEKS[h.parcaId]?.en : PARCA_INDEKS[h.parcaId]?.ad) ?? h.parcaId },
  { anahtar: 'hata',    baslik: 'Hata Tipi',          baslikEn: 'Defect',           genislik: 24, stil: STIL.GOVDE,      deger: (h, i, c) => (c.dil === 'en' ? HATA_TIPI_INDEKS[h.hataTipiId]?.en : HATA_TIPI_INDEKS[h.hataTipiId]?.ad) ?? h.hataTipiId },
  { anahtar: 'grup',    baslik: 'Hata Grubu',         baslikEn: 'Defect Group',     genislik: 18, stil: STIL.GOVDE,      deger: (h, i, c) => { const g = HATA_GRUPLARI[HATA_TIPI_INDEKS[h.hataTipiId]?.grup]; return (c.dil === 'en' ? g?.en : g?.ad) ?? ''; } },
  { anahtar: 'siddet',  baslik: 'Şiddet',             baslikEn: 'Severity',         genislik: 9,  stil: null,            deger: (h) => h.siddet, stilSecici: (h) => ({ A: STIL.SIDDET_A, B: STIL.SIDDET_B, C: STIL.SIDDET_C }[h.siddet] ?? STIL.GOVDE_ORTA) },
  { anahtar: 'adet',    baslik: 'Adet',               baslikEn: 'Qty',              genislik: 7,  stil: STIL.SAYI,       deger: (h) => h.adet ?? 1 },
  { anahtar: 'puan',    baslik: 'Ceza Puanı',         baslikEn: 'Demerit',          genislik: 11, stil: STIL.SAYI,       deger: (h) => (SIDDET_INDEKS[h.siddet]?.puan ?? 0) * (h.adet ?? 1) },
  { anahtar: 'konum',   baslik: 'Konum / Açıklama',   baslikEn: 'Location / Note',  genislik: 34, stil: STIL.GOVDE,      deger: (h) => [h.konum, h.aciklama].filter(Boolean).join(' — ') },
  { anahtar: 'foto',    baslik: 'Fotoğraf',           baslikEn: 'Photo',            genislik: 24, stil: STIL.GOVDE,      fotograf: true, deger: () => '' },
  { anahtar: 'saat',    baslik: 'Tespit Saati',       baslikEn: 'Time',             genislik: 12, stil: STIL.GOVDE_ORTA, deger: (h) => bicimSaat(h.zaman) },
  { anahtar: 'durum',   baslik: 'Durum',              baslikEn: 'Status',           genislik: 12, stil: STIL.GOVDE_ORTA, deger: (h) => (h.durum === 'kapali' ? 'Kapatıldı' : 'Açık') },
];

const baslikMetni = (s, dil) => (dil === 'en' ? s.baslikEn : s.baslik);

/** Üst bilgi bloğundaki etiket/değer çiftleri. */
function ustBilgiCiftleri(denetim, ozet, dil) {
  const arac = ARAC_INDEKS[denetim.aracId];
  const E = (tr, en) => (dil === 'en' ? en : tr);
  return [
    [E('Rapor No', 'Report No'), denetim.raporNo || '', E('Araç', 'Vehicle'), arac?.tam ?? denetim.aracId ?? '', E('Denetim Tarihi', 'Audit Date'), bicimTarih(denetim.baslangic)],
    [E('Şasi No (VIN)', 'VIN'), denetim.vin || '', E('Plaka', 'Plate'), denetim.plaka || '—', E('Denetçi', 'Auditor'), denetim.denetci || ''],
    [E('Üretim Hattı', 'Line'), denetim.hat || '', E('Vardiya', 'Shift'), denetim.vardiya || '', E('Denetim Tipi', 'Audit Type'), denetim.denetimTipi || ''],
    [E('Toplam Hata', 'Total Defects'), ozet.toplamAdet, E('Toplam Ceza Puanı', 'Total Demerit'), ozet.toplamPuan, E('SONUÇ', 'RESULT'), dil === 'en' ? ozet.sonuc.en : ozet.sonuc.ad],
  ];
}

/**
 * Denetimin Excel çalışma kitabını üretir.
 * @param {object} denetim
 * @param {Map<string,{bayt:Uint8Array}>} fotograflar fotoId -> bayt
 * @param {{dil?:'tr'|'en', esikler?:object}} [ayarlar]
 * @returns {Uint8Array}
 */
function excelUret(denetim, fotograflar = new Map(), ayarlar = {}) {
  const dil = ayarlar.dil ?? 'tr';
  const baglam = { dil };
  const ozet = denetimOzeti(denetim, ayarlar.esikler);
  const hatalar = denetim.hatalar ?? [];
  const sutunSayisi = SUTUNLAR.length;
  const fotoSutunu = SUTUNLAR.findIndex((s) => s.fotograf);

  const satirlar = [];
  const birlesikler = [];

  // Başlık
  satirlar.push([{ v: dil === 'en' ? 'VEHICLE AUDIT REPORT' : 'ARAÇ DENETİM RAPORU', stil: STIL.BASLIK_BUYUK }]);
  birlesikler.push(`A1:${sutunAdi(sutunSayisi - 1)}1`);
  satirlar.push([]);

  // Üst bilgi bloğu — her satırda üç etiket/değer çifti
  const bolum = Math.floor(sutunSayisi / 3);
  for (const cift of ustBilgiCiftleri(denetim, ozet, dil)) {
    const satir = new Array(sutunSayisi).fill('');
    for (let g = 0; g < 3; g++) {
      const etiketSutun = g * bolum;
      satir[etiketSutun] = { v: cift[g * 2], stil: STIL.ETIKET };
      satir[etiketSutun + 1] = { v: cift[g * 2 + 1], stil: STIL.GOVDE };
      const son = g === 2 ? sutunSayisi - 1 : (g + 1) * bolum - 1;
      if (son > etiketSutun + 1) {
        birlesikler.push(`${sutunAdi(etiketSutun + 1)}${satirlar.length + 1}:${sutunAdi(son)}${satirlar.length + 1}`);
      }
    }
    satirlar.push(satir);
  }

  satirlar.push([]);
  const tabloBaslikSatiri = satirlar.length;
  satirlar.push(SUTUNLAR.map((s) => ({ v: baslikMetni(s, dil), stil: STIL.BASLIK })));

  // Hata satırları
  const gorseller = [];
  const satirYukseklikleri = {};
  let enFazlaFoto = 1;

  hatalar.forEach((h, i) => {
    const satirNo = satirlar.length;
    satirlar.push(SUTUNLAR.map((s) => ({
      v: s.deger(h, i, baglam),
      stil: s.stilSecici ? s.stilSecici(h) : (s.stil ?? STIL.GOVDE),
    })));

    const fotolar = (h.fotograflar ?? []).map((fid) => fotograflar.get(fid)).filter((f) => f?.bayt?.length);
    if (fotolar.length === 0) return;

    enFazlaFoto = Math.max(enFazlaFoto, fotolar.length);
    let kayma = 0;
    let enYuksek = 0;
    fotolar.forEach((f, fi) => {
      const olcu = gosterimOlcusu(f.bayt, FOTO_EN, FOTO_BOY);
      gorseller.push({
        satir: satirNo, sutun: fotoSutunu, veri: f.bayt,
        gosterEn: olcu.en, gosterBoy: olcu.boy, xKayma: kayma,
        ad: `${hataKodu(h)} foto ${fi + 1}`,
        aciklama: `${PARCA_INDEKS[h.parcaId]?.ad ?? h.parcaId} — ${HATA_TIPI_INDEKS[h.hataTipiId]?.ad ?? h.hataTipiId}`,
      });
      kayma += olcu.en + 6;
      enYuksek = Math.max(enYuksek, olcu.boy);
    });
    satirYukseklikleri[satirNo] = pikselPunto(enYuksek + 12);
  });

  if (hatalar.length === 0) {
    satirlar.push([{ v: dil === 'en' ? 'No defects recorded.' : 'Hata kaydedilmedi.', stil: STIL.GOVDE }]);
  }

  // Fotoğraf sütunu, yan yana gelen fotoğrafları alacak kadar genişletilir
  const sutunGenislikleri = SUTUNLAR.map((s) => s.genislik);
  if (gorseller.length) {
    const gerekliPiksel = enFazlaFoto * (FOTO_EN + 6) + 10;
    sutunGenislikleri[fotoSutunu] = Math.max(s_piksel(sutunGenislikleri[fotoSutunu]), gerekliPiksel) / 7;
  }

  const sonSatir = satirlar.length;
  const raporSayfasi = {
    ad: dil === 'en' ? 'Audit Report' : 'Denetim Raporu',
    satirlar,
    sutunGenislikleri,
    satirYukseklikleri,
    birlesikler,
    dondur: { satir: tabloBaslikSatiri + 1, sutun: 0 },
    filtre: `A${tabloBaslikSatiri + 1}:${sutunAdi(sutunSayisi - 1)}${Math.max(sonSatir, tabloBaslikSatiri + 2)}`,
    gorseller,
  };

  return xlsxOlustur([raporSayfasi, ozetSayfasi(denetim, ozet, dil)], {
    baslik: `${denetim.vin || 'Denetim'} — ${dil === 'en' ? 'Vehicle Audit' : 'Araç Denetimi'}`,
    yazar: denetim.denetci || 'Arac Audit',
  });
}

/** Excel sütun genişliği (karakter) -> piksel. */
function s_piksel(genislik) { return (genislik ?? 8) * 7 + 5; }

/** Özet sayfası: bölge, şiddet ve hata grubu dağılımı. */
function ozetSayfasi(denetim, ozet, dil) {
  const E = (tr, en) => (dil === 'en' ? en : tr);
  const satirlar = [
    [{ v: E('ÖZET', 'SUMMARY'), stil: STIL.BASLIK_BUYUK }],
    [],
    [{ v: E('Toplam hata kaydı', 'Defect records'), stil: STIL.ETIKET }, { v: ozet.toplamHata, stil: STIL.SAYI }],
    [{ v: E('Toplam hata adedi', 'Total quantity'), stil: STIL.ETIKET }, { v: ozet.toplamAdet, stil: STIL.SAYI }],
    [{ v: E('Toplam ceza puanı', 'Total demerit'), stil: STIL.ETIKET }, { v: ozet.toplamPuan, stil: STIL.SAYI }],
    [{ v: E('Fotoğraflı hata', 'With photo'), stil: STIL.ETIKET }, { v: ozet.fotografliHata, stil: STIL.SAYI }],
    [{ v: E('Fotoğrafsız hata', 'Without photo'), stil: STIL.ETIKET }, { v: ozet.fotografsizHata, stil: STIL.SAYI }],
    [{ v: E('Sonuç', 'Result'), stil: STIL.ETIKET }, { v: dil === 'en' ? ozet.sonuc.en : ozet.sonuc.ad, stil: STIL.GOVDE }, { v: ozet.sonuc.gerekce, stil: STIL.GOVDE }],
    [],
    [{ v: E('ŞİDDETE GÖRE', 'BY SEVERITY'), stil: STIL.ETIKET }],

/**
 * Birden çok denetimi tek kitapta toplar (vardiya/hat raporu).
 * Fotoğraflar yalnızca ilk sayfada değil, her aracın kendi sayfasında yer alır.
 */
function topluExcelUret(denetimler, fotograflar = new Map(), ayarlar = {}) {
  const dil = ayarlar.dil ?? 'tr';
  const E = (tr, en) => (dil === 'en' ? en : tr);
  const toplu = topluOzet(denetimler, ayarlar.esikler);

  const satirlar = [
    [{ v: E('TOPLU DENETİM RAPORU', 'BATCH AUDIT REPORT'), stil: STIL.BASLIK_BUYUK }],
    [],
    [{ v: E('Denetlenen araç', 'Vehicles audited'), stil: STIL.ETIKET }, { v: toplu.aracSayisi, stil: STIL.SAYI }],
    [{ v: E('Toplam hata adedi', 'Total defects'), stil: STIL.ETIKET }, { v: toplu.toplamAdet, stil: STIL.SAYI }],
    [{ v: 'DPU (Defects Per Unit)', stil: STIL.ETIKET }, { v: toplu.dpu, stil: STIL.SAYI }],
    [{ v: E('Araç başı ceza puanı', 'Demerit per unit'), stil: STIL.ETIKET }, { v: toplu.aracBasiPuan, stil: STIL.SAYI }],
    [],
    [{ v: E('ARAÇLAR', 'VEHICLES'), stil: STIL.ETIKET }],
    [E('Şasi No', 'VIN'), E('Plaka', 'Plate'), E('Araç', 'Vehicle'), E('Tarih', 'Date'), E('Denetçi', 'Auditor'),
     E('Hata', 'Defects'), E('Puan', 'Demerit'), E('Sonuç', 'Result')].map((v) => ({ v, stil: STIL.BASLIK })),
  ];

  for (const { denetim, ozet } of toplu.ozetler) {
    satirlar.push([
      { v: denetim.vin ?? '', stil: STIL.GOVDE },
      { v: denetim.plaka || '—', stil: STIL.GOVDE },
      { v: ARAC_INDEKS[denetim.aracId]?.ad ?? denetim.aracId ?? '', stil: STIL.GOVDE },
      { v: bicimTarih(denetim.baslangic), stil: STIL.GOVDE_ORTA },
      { v: denetim.denetci ?? '', stil: STIL.GOVDE },
      { v: ozet.toplamAdet, stil: STIL.SAYI },
      { v: ozet.toplamPuan, stil: STIL.SAYI },
      { v: dil === 'en' ? ozet.sonuc.en : ozet.sonuc.ad, stil: { RED: STIL.SIDDET_A, SARTLI: STIL.SIDDET_B, KABUL: STIL.GOVDE_ORTA }[ozet.sonuc.kod] },
    ]);
  }

  satirlar.push([], [{ v: E('EN SIK TEKRARLAYAN PARÇALAR', 'MOST FREQUENT PARTS'), stil: STIL.ETIKET }],
    [E('Parça', 'Part'), E('Bölge', 'Zone'), E('Toplam adet', 'Total qty'), E('Kaç araçta', 'Vehicles affected')]
      .map((v) => ({ v, stil: STIL.BASLIK })));
  for (const p of toplu.enSikParcalar) {
    satirlar.push([{ v: p.ad, stil: STIL.GOVDE }, { v: p.bolgeAd, stil: STIL.GOVDE },
      { v: p.adet, stil: STIL.SAYI }, { v: p.aracSayisi, stil: STIL.SAYI }]);
  }

  const sayfalar = [{
    ad: E('Toplu Özet', 'Batch Summary'), satirlar,
    sutunGenislikleri: [22, 14, 16, 18, 18, 10, 10, 16],
    dondur: { satir: 9, sutun: 0 },
  }];

  // Her araç kendi sayfasına — fotoğraflar dahil
  for (const d of denetimler) {
    const tekKitap = tekSayfaVerisi(d, fotograflar, dil, ayarlar.esikler);
    sayfalar.push(tekKitap);
  }

  return xlsxOlustur(sayfalar, { baslik: E('Toplu Denetim Raporu', 'Batch Audit Report'), yazar: ayarlar.yazar });
}

/** topluExcelUret için: tek aracın sayfa tanımını (fotoğraflarıyla) üretir. */
function tekSayfaVerisi(denetim, fotograflar, dil, esikler) {
  const baglam = { dil };
  const hatalar = denetim.hatalar ?? [];
  const fotoSutunu = SUTUNLAR.findIndex((s) => s.fotograf);
  const satirlar = [SUTUNLAR.map((s) => ({ v: baslikMetni(s, dil), stil: STIL.BASLIK }))];
  const gorseller = [];
  const satirYukseklikleri = {};

  hatalar.forEach((h, i) => {
    const satirNo = satirlar.length;
    satirlar.push(SUTUNLAR.map((s) => ({
      v: s.deger(h, i, baglam),
      stil: s.stilSecici ? s.stilSecici(h) : (s.stil ?? STIL.GOVDE),
    })));
    const fotolar = (h.fotograflar ?? []).map((fid) => fotograflar.get(fid)).filter((f) => f?.bayt?.length);
    let kayma = 0, enYuksek = 0;
    for (const [fi, f] of fotolar.entries()) {
      const olcu = gosterimOlcusu(f.bayt, FOTO_EN, FOTO_BOY);
      gorseller.push({ satir: satirNo, sutun: fotoSutunu, veri: f.bayt, gosterEn: olcu.en, gosterBoy: olcu.boy, xKayma: kayma, ad: `${hataKodu(h)} foto ${fi + 1}` });
      kayma += olcu.en + 6; enYuksek = Math.max(enYuksek, olcu.boy);
    }
    if (enYuksek) satirYukseklikleri[satirNo] = pikselPunto(enYuksek + 12);
  });

  const ad = (denetim.vin || denetim.plaka || denetim.id || 'Arac').slice(-12);
  return {
    ad, satirlar,
    sutunGenislikleri: SUTUNLAR.map((s) => s.genislik),
    satirYukseklikleri, gorseller, dondur: { satir: 1, sutun: 0 },
  };
}

/** Excel'in Türkçe yerelinde bozulmaması için ayraç ";" ve BOM eklenir. */
function csvUret(denetim, ayarlar = {}) {
  const dil = ayarlar.dil ?? 'tr';
  const baglam = { dil };
  const kacis = (v) => {
    const s = String(v ?? '');
    return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const basliklar = [...SUTUNLAR.filter((s) => !s.fotograf).map((s) => baslikMetni(s, dil)),
    dil === 'en' ? 'Photo count' : 'Fotoğraf adedi'];
  const satirlar = (denetim.hatalar ?? []).map((h, i) => [
    ...SUTUNLAR.filter((s) => !s.fotograf).map((s) => s.deger(h, i, baglam)),
    (h.fotograflar ?? []).length,
  ]);
  return '﻿' + [basliklar, ...satirlar].map((r) => r.map(kacis).join(';')).join('\r\n');
}

/**
 * Ekranda gösterilen / yazdırılan rapor.
 * @param {object} denetim
 * @param {Map<string,{url:string}>} fotoUrlleri fotoId -> nesne URL'si
 */
function htmlRapor(denetim, fotoUrlleri = new Map(), ayarlar = {}) {
  const dil = ayarlar.dil ?? 'tr';
  const baglam = { dil };
  const ozet = denetimOzeti(denetim, ayarlar.esikler);
  const arac = ARAC_INDEKS[denetim.aracId];
  const g = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const E = (tr, en) => (dil === 'en' ? en : tr);

  const ustBilgi = ustBilgiCiftleri(denetim, ozet, dil)
    .flatMap((satir) => [[satir[0], satir[1]], [satir[2], satir[3]], [satir[4], satir[5]]])
    .map(([e, d]) => `<div class="r-alan"><span>${g(e)}</span><strong>${g(d)}</strong></div>`).join('');

  const gorunurSutunlar = SUTUNLAR.filter((s) => s.anahtar !== 'grup' && s.anahtar !== 'kod');
  const basliklar = gorunurSutunlar.map((s) => `<th>${g(baslikMetni(s, dil))}</th>`).join('');

  const govde = (denetim.hatalar ?? []).map((h, i) => {
    const hucreler = gorunurSutunlar.map((s) => {
      if (s.fotograf) {
        const foto = (h.fotograflar ?? []).map((fid) => fotoUrlleri.get(fid)).filter(Boolean);
        return `<td class="r-foto">${foto.map((f) => `<img src="${g(f.url)}" alt="">`).join('')}</td>`;
      }
      const sinif = s.anahtar === 'siddet' ? ` class="r-s r-s${g(h.siddet)}"` : '';
      return `<td${sinif}>${g(s.deger(h, i, baglam))}</td>`;
    }).join('');
    return `<tr>${hucreler}</tr>`;
  }).join('');

  return `<section class="rapor">
<header><h1>${E('Araç Denetim Raporu', 'Vehicle Audit Report')}</h1>
<p class="r-arac">${g(arac?.tam ?? denetim.aracId ?? '')} · ${g(denetim.vin ?? '')}</p></header>
<div class="r-izgara">${ustBilgi}</div>
<div class="r-sonuc r-sonuc-${g(ozet.sonuc.kod)}"><strong>${g(dil === 'en' ? ozet.sonuc.en : ozet.sonuc.ad)}</strong><span>${g(ozet.sonuc.gerekce)}</span></div>
<div class="r-kaydir"><table class="r-tablo"><thead><tr>${basliklar}</tr></thead><tbody>${govde || `<tr><td colspan="${gorunurSutunlar.length}">${E('Hata kaydedilmedi.', 'No defects recorded.')}</td></tr>`}</tbody></table></div>
<p class="r-not">${E('Ceza puanı ağırlıkları ve karar eşikleri ayarlanabilir başlangıç değerleridir; resmî bir audit standardından alınmamıştır.',
  'Demerit weights and decision thresholds are configurable starting values, not from an official audit standard.')}</p>
</section>`;
}

const $ = (s, k = document) => k.querySelector(s);
const el = (etiket, ozellikler = {}, ...cocuklar) => {
  const d = document.createElement(etiket);
  for (const [a, v] of Object.entries(ozellikler)) {
    if (v === null || v === undefined || v === false) continue;
    if (a === 'sinif') d.className = v;
    else if (a === 'metin') d.textContent = v;
    else if (a === 'html') d.innerHTML = v;
    else if (a.startsWith('on')) d.addEventListener(a.slice(2), v);
    else d.setAttribute(a, v === true ? '' : v);
  }
  for (const c of cocuklar.flat()) if (c) d.append(c.nodeType ? c : document.createTextNode(c));
  return d;
};

  const vardiya = el('select', {}, ...['', 'A', 'B', 'C'].map((v) => el('option', { value: v, metin: v || 'Seçiniz' })));
  vardiya.value = durum.ayarlar.vardiya ?? '';
  const tip = el('select', {}, ...['Seri denetim', 'Ara denetim', 'Final audit', 'Yol testi', 'Müşteri şikâyeti', 'Yeniden kontrol']
    .map((v) => el('option', { value: v, metin: v })));

  sayfa.append(el('div', { sinif: 'kart' },
    el('h2', { metin: 'Denetim bilgileri' }),
    el('div', { sinif: 'izgara2' },
      el('label', { sinif: 'alan' }, 'Rapor No', raporNo),
      el('label', { sinif: 'alan' }, 'Denetçi', denetci),
      el('label', { sinif: 'alan' }, 'Üretim hattı', hat),
      el('label', { sinif: 'alan' }, 'Vardiya', vardiya),
      el('label', { sinif: 'alan' }, 'Denetim tipi', tip))));

  const basla = async () => {
    const r = vinKontrol();
    if (!r.gecerli) { bildir('Şasi numarası eksik ya da hatalı.', 'hata'); vinGirdi.focus(); return; }
    const p = plakaDogrula(plakaGirdi.value);
    if (p.uyarilar.length) bildir(p.uyarilar[0], 'uyari');

    durum.ayarlar.denetci = denetci.value.trim();
    durum.ayarlar.hat = hat.value.trim();
    durum.ayarlar.vardiya = vardiya.value;
    await depo.ayarYaz('varsayilanlar', durum.ayarlar);

    durum.denetim = {
      id: depo.kimlikUret('d'),
      aracId: seciliArac,
      vin: r.vin,
      plaka: p.bicimli,
      raporNo: raporNo.value.trim(),
      denetci: durum.ayarlar.denetci,
      hat: durum.ayarlar.hat,
      vardiya: durum.ayarlar.vardiya,
      denetimTipi: tip.value,
      baslangic: new Date().toISOString(),
      bitis: null,
      durum: 'devam',
      hatalar: [],
    };
    await depo.denetimKaydet(durum.denetim);
    durum.fotoUrlleri.clear();
    durum.mod = 'dis';
    git('denetim');
  };

  parca.append(el('div', { sinif: 'alt-cubuk' },
    el('button', { sinif: 'birincil', onclick: basla }, 'Denetime Başla →')));
  return parca;
}

/** Kamera + BarcodeDetector ile VIN okuma; desteklenmiyorsa elle girişe düşer. */
async function vinTara(girdi, kontrol) {
  if (!('BarcodeDetector' in window)) {
    bildir('Bu tarayıcı barkod okumayı desteklemiyor — elle girin ya da Chrome (Android) kullanın.', 'uyari');
    girdi.focus();
    return;
  }
  let akis;
  try {
    akis = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch {
    bildir('Kameraya erişilemedi. Tarayıcı izinlerini kontrol edin.', 'hata');
    return;
  }

  const video = el('video', { autoplay: true, playsinline: true, muted: true,
    style: 'width:100%;border-radius:12px;background:#000;max-height:60vh;object-fit:cover' });
  video.srcObject = akis;

  const kapat = () => { akis.getTracks().forEach((t) => t.stop()); perde.remove(); };
  const perde = el('div', { sinif: 'perde', onclick: (e) => { if (e.target === perde) kapat(); } },
    el('div', { sinif: 'sayfa-alt' },
      el('div', { sinif: 'tutamak' }),
      el('h3', { metin: 'Şasi barkodunu kameraya gösterin' }),
      video,
      el('div', { sinif: 'bilgi', metin: 'Code 128 / Code 39 / QR / DataMatrix okunur. Okunan metin 17 haneye göre süzülür.' }),
      el('button', { onclick: kapat }, 'Vazgeç')));
  document.body.append(perde);

  const okuyucu = new window.BarcodeDetector({ formats: ['code_128', 'code_39', 'qr_code', 'data_matrix', 'pdf417', 'itf'] });
  const dongu = async () => {
    if (!document.body.contains(perde)) return;
    try {
      const bulunan = await okuyucu.detect(video);
      for (const b of bulunan) {
        const aday = vinDogrula(b.rawValue);
        if (aday.gecerli) {
          girdi.value = aday.vin;
          kontrol();
          navigator.vibrate?.(60);
          kapat();
          return;
        }
      }
    } catch { /* kare atlandı, döngü sürer */ }
    requestAnimationFrame(dongu);
  };
  video.addEventListener('loadeddata', () => requestAnimationFrame(dongu), { once: true });
}

function tuvalOlcusuGuncelle(tuval) {
  const olcek = Math.min(window.devicePixelRatio || 1, 2);
  const en = Math.max(1, Math.round(tuval.clientWidth * olcek));
  const boy = Math.max(1, Math.round(tuval.clientHeight * olcek));
  if (tuval.width === en && tuval.height === boy) return false;
  tuval.width = en; tuval.height = boy;
  return true;
}

function modelKur(tuval) {
  tuvalOlcusuGuncelle(tuval);

  // Tuval, kurulduktan SONRA da yeniden boyutlanabilir (hızlı seçim şeridi
  // sonradan dolar, cihaz döner, klavye açılır). İzlemezsek arka plan tamponu
  // eski ölçüde kalır ve dokunma isabeti kayar — 15.09.2026'da tam bu oldu.
  if (durum.tuvalIzleyici) durum.tuvalIzleyici.disconnect();
  if (typeof ResizeObserver !== 'undefined') {
    durum.tuvalIzleyici = new ResizeObserver(() => {
      if (tuvalOlcusuGuncelle(tuval)) durum.goruntuleyici?.ciz();
    });
    durum.tuvalIzleyici.observe(tuval);
  }

  durum.goruntuleyici = new ModelGoruntuleyici(tuval, {
    dokunuldu: (mesh) => {
      const parcaId = meshParcaBul(mesh);
      if (parcaId) hataEkleAc(parcaId);
    },
  });
  durum.goruntuleyici.yukle(geometriUret(durum.denetim.aracId, durum.mod));
  durum.goruntuleyici.vurgula(hataVurgulari());
  durum.goruntuleyici.bakis(durum.mod === 'ic' ? 'kabin' : 'serbest');
}

/** mesh kimliği -> parça kimliği (katalogda mesh alanıyla eşleşir). */
function meshParcaBul(mesh) {
  for (const b of BOLGELER) for (const p of b.parcalar) if (p.mesh === mesh) return p.id;
  return null;
}

/** Hatası olan parçaları en yüksek şiddetin rengiyle boyar. */
function hataVurgulari() {
  const harita = new Map();
  const oncelik = { A: 3, B: 2, C: 1 };
  const enIyi = new Map();
  for (const h of durum.denetim.hatalar) {
    const p = PARCA_INDEKS[h.parcaId];
    if (!p?.mesh) continue;
    const mevcut = enIyi.get(p.mesh);
    if (!mevcut || oncelik[h.siddet] > oncelik[mevcut]) enIyi.set(p.mesh, h.siddet);
  }
  for (const [mesh, siddet] of enIyi) harita.set(mesh, SIDDET_INDEKS[siddet]?.renk ?? '#D92D20');
  return harita;
}

function hizliDoldur(kutu) {
  depo.sikKullanilanlar(10).then((sik) => {
    const kaynak = sik.length >= 4
      ? sik.map((s) => [s.parcaId, s.hataTipiId])
      : HIZLI_KALIPLAR;
    kutu.textContent = '';
    const gecerli = kaynak.filter(([p, h]) => PARCA_INDEKS[p] && HATA_TIPI_INDEKS[h]).slice(0, 14);
    if (!gecerli.length) { kutu.append(el('div', { sinif: 'bos', metin: 'Kalıp yok.' })); return; }
    for (const [parcaId, hataId] of gecerli) {
      const p = PARCA_INDEKS[parcaId], h = HATA_TIPI_INDEKS[hataId];
      kutu.append(el('button', { onclick: () => hataEkleAc(parcaId, hataId) },
        el('b', { metin: `${p.ad} — ${h.ad}` }),
        el('span', { metin: p.bolgeAd })));
    }
  });
}

function altSayfa(baslik, ...icerik) {
  const kapat = () => perde.remove();
  const perde = el('div', { sinif: 'perde', onclick: (e) => { if (e.target === perde) kapat(); } },
    el('div', { sinif: 'sayfa-alt' },
      el('div', { sinif: 'tutamak' }),
      el('h3', { metin: baslik }),
      ...icerik.flat()));
  document.body.append(perde);
  return { perde, kapat };
}

function bolgeListesiAc() {
  const arac = ARAC_INDEKS[durum.denetim.aracId];
  const bolgeler = bolgelerAracIcin(arac);
  const arama = el('input', { placeholder: 'Parça ara (örn. arka kapı, garniş, far)…', type: 'search' });
  const sonuc = el('div', { style: 'display:grid;gap:8px' });

  const { kapat } = altSayfa('Bölge ve parça seç', arama, sonuc);

  const cizListe = () => {
    const q = arama.value.trim().toLocaleLowerCase('tr');
    sonuc.textContent = '';
    for (const b of bolgeler) {
      const parcalar = q
        ? b.parcalar.filter((p) => `${p.ad} ${p.en} ${b.ad}`.toLocaleLowerCase('tr').includes(q))
        : b.parcalar;
      if (!parcalar.length) continue;
      sonuc.append(el('div', { sinif: 'grup-basligi', metin: `${b.simge ?? ''} ${b.ad}` }));
      const izgara = el('div', { sinif: 'secenek-izgara' });
      for (const p of parcalar) {
        izgara.append(el('button', { sinif: 'secenek', onclick: () => { kapat(); hataEkleAc(p.id); } },
          p.ad, el('small', { metin: p.en })));
      }
      sonuc.append(izgara);
    }
    if (!sonuc.children.length) sonuc.append(el('div', { sinif: 'bos', metin: 'Eşleşen parça yok.' }));
  };
  arama.addEventListener('input', cizListe);
  cizListe();
}

function hataEkleAc(parcaId, onSecilenHata = null) {
  hataSayfasi({
    parcaId,
    hataTipiId: onSecilenHata,
    siddet: onSecilenHata ? HATA_TIPI_INDEKS[onSecilenHata]?.siddet ?? 'C' : null,
    adet: 1, konum: '', aciklama: '', fotograflar: [], durum: 'acik',
  }, null);
}

function hataDuzenleAc(sira) {
  hataSayfasi({ ...durum.denetim.hatalar[sira] }, sira);
}

function hataSayfasi(taslak, duzenlenenSira) {
  const p = PARCA_INDEKS[taslak.parcaId];
  const tipler = parcaHataTipleri(taslak.parcaId);
  const gruplar = [...new Set(tipler.map((t) => t.grup))];

  const tipKutu = el('div', { style: 'display:grid;gap:8px' });
  const siddetKutu = el('div', { sinif: 'siddet-secim' });
  const adetGirdi = el('input', { type: 'number', min: '1', max: '99', value: String(taslak.adet ?? 1), inputmode: 'numeric' });
  const konumGirdi = el('input', { placeholder: 'örn. üst köşe, kol dayama hizası', value: taslak.konum ?? '' });
  const aciklamaGirdi = el('textarea', { rows: '2', placeholder: 'Ek açıklama (isteğe bağlı)' });
  aciklamaGirdi.value = taslak.aciklama ?? '';
  const fotoSerit = el('div', { sinif: 'foto-serit' });

  const siddetCiz = () => {
    siddetKutu.textContent = '';
    for (const s of SIDDETLER) {
      siddetKutu.append(el('button', { sinif: `secenek s-${s.id}`, 'aria-pressed': taslak.siddet === s.id,
        onclick: () => { taslak.siddet = s.id; siddetCiz(); } },
        `${s.id} · ${s.ad}`, el('small', { metin: `${s.puan} puan` })));
    }
  };

  const tipCiz = () => {
    tipKutu.textContent = '';
    for (const g of gruplar) {
      tipKutu.append(el('div', { sinif: 'grup-basligi', metin: HATA_GRUPLARI[g]?.ad ?? g }));
      const izgara = el('div', { sinif: 'secenek-izgara' });
      for (const t of tipler.filter((x) => x.grup === g)) {
        izgara.append(el('button', { sinif: 'secenek', 'aria-pressed': taslak.hataTipiId === t.id,
          onclick: (ev) => {
            taslak.hataTipiId = t.id;
            if (duzenlenenSira === null) taslak.siddet = t.siddet;
            tipCiz(); siddetCiz();
            // Hata tipi seçildi; sırada Kaydet var. Uzun listede o düğme
            // ekranın çok altında kalıyor ve "üç dokunuş" sözü bozuluyordu.
            ev.currentTarget.closest('.sayfa-alt')?.querySelector('.eylemler')
              ?.scrollIntoView({ behavior: 'smooth', block: 'end' });
          } },
          t.ad, el('small', { metin: t.en })));
      }
      tipKutu.append(izgara);
    }
  };

  const fotoCiz = () => {
    fotoSerit.textContent = '';
    for (const fid of taslak.fotograflar) {
      const url = durum.fotoUrlleri.get(fid);
      fotoSerit.append(el('div', { sinif: 'foto-kutu' },
        url ? el('img', { src: url, alt: '' }) : null,
        el('button', { 'aria-label': 'Fotoğrafı sil', onclick: async () => {
          taslak.fotograflar = taslak.fotograflar.filter((x) => x !== fid);
          await depo.fotografSil(fid);
          durum.fotoUrlleri.delete(fid);
          fotoCiz();
        } }, '×')));
    }
    fotoSerit.append(el('label', { sinif: 'foto-ekle' }, '📷', 'Fotoğraf',
      el('input', { type: 'file', accept: 'image/*', capture: 'environment', multiple: true, style: 'display:none',
        onchange: async (e) => {
          const dosyalar = [...e.target.files];
          e.target.value = '';
          for (const dosya of dosyalar) {
            try {
              const { blob, en, boy } = await fotografKucult(dosya);
              const kayit = await depo.fotografKaydet(durum.denetim.id, blob, { en, boy });
              taslak.fotograflar.push(kayit.id);
              durum.fotoUrlleri.set(kayit.id, URL.createObjectURL(blob));
            } catch (h) {
              bildir(`Fotoğraf işlenemedi: ${h.message}`, 'hata');
            }
          }
          fotoCiz();
        } })));
  };

  tipCiz(); siddetCiz(); fotoCiz();

  const kaydet = async () => {
    if (!taslak.hataTipiId) { bildir('Hata tipi seçin.', 'uyari'); return; }
    if (!taslak.siddet) taslak.siddet = HATA_TIPI_INDEKS[taslak.hataTipiId]?.siddet ?? 'C';
    taslak.adet = Math.max(1, Math.min(99, Number(adetGirdi.value) || 1));
    taslak.konum = konumGirdi.value.trim();
    taslak.aciklama = aciklamaGirdi.value.trim();
    if (duzenlenenSira === null) {
      taslak.id = depo.kimlikUret('h');
      taslak.zaman = new Date().toISOString();
      durum.denetim.hatalar.push(taslak);
    } else {
      durum.denetim.hatalar[duzenlenenSira] = taslak;
    }
    await depo.denetimKaydet(durum.denetim);
    await depo.kalipSay(taslak.parcaId, taslak.hataTipiId);
    kapat();
    ciz();
  };

  const sil = async () => {
    if (duzenlenenSira === null) { kapat(); return; }
    for (const fid of durum.denetim.hatalar[duzenlenenSira].fotograflar ?? []) {
      await depo.fotografSil(fid);
      durum.fotoUrlleri.delete(fid);
    }
    durum.denetim.hatalar.splice(duzenlenenSira, 1);
    await depo.denetimKaydet(durum.denetim);
    kapat();
    ciz();
  };

  const { kapat } = altSayfa(`${p?.ad ?? taslak.parcaId}`,
    el('div', { sinif: 'bilgi', metin: `${p?.bolgeAd ?? ''} · ${p?.en ?? ''}` }),
    el('div', { sinif: 'grup-basligi', metin: 'Hata tipi' }), tipKutu,
    el('div', { sinif: 'grup-basligi', metin: 'Şiddet' }), siddetKutu,
    el('div', { sinif: 'izgara2' },
      el('label', { sinif: 'alan' }, 'Adet',
        el('div', { sinif: 'adet-kutu' },
          el('button', { onclick: () => { adetGirdi.value = Math.max(1, Number(adetGirdi.value) - 1); } }, '−'),
          adetGirdi,
          el('button', { onclick: () => { adetGirdi.value = Math.min(99, Number(adetGirdi.value) + 1); } }, '+'))),
      el('label', { sinif: 'alan' }, 'Konum', konumGirdi)),
    el('label', { sinif: 'alan' }, 'Açıklama', aciklamaGirdi),
    el('div', { sinif: 'grup-basligi', metin: 'Fotoğraf (Excel’e otomatik gömülür)' }), fotoSerit,
    el('div', { sinif: 'dugme-satir eylemler', style: 'margin-top:8px' },

async function fotoUrlleriTazele() {
  for (const url of durum.fotoUrlleri.values()) URL.revokeObjectURL(url);
  durum.fotoUrlleri.clear();
  const kayitlar = await depo.fotograflariGetir(durum.denetim.id);
  for (const k of kayitlar) durum.fotoUrlleri.set(k.id, URL.createObjectURL(k.blob));
}

// ---------------------------------------------------------------------------
// DIŞA AKTARIM
// ---------------------------------------------------------------------------

// claude.ai Artifact kabuğu, sayfanın KENDİ başlattığı indirmeleri (blob
// bağlantısı, <a download>) engeller. Orada dosyayı 'downloads' yeteneğiyle
// veririz; kullanıcı bir onay kutusu görür. Başka her yerde (kendi sunucunuz,
// tek dosya sürümü, yerel http) o yetenek yoktur ve normal bağlantı çalışır.
// Tek kod yolu iki ortamı da karşılasın diye yetenek bir kez sorulup saklanır.
let _indirmeYetenegi;
function indirmeYetenegi() {
  if (_indirmeYetenegi === undefined) {
    _indirmeYetenegi = (typeof window !== 'undefined' && typeof window.claude?.use === 'function')
      ? Promise.resolve(window.claude.use('downloads')).catch(() => null)
      : Promise.resolve(null);
  }
  return _indirmeYetenegi;
}

/**
 * Dosyayı kullanıcıya verir.
 * @returns {Promise<boolean>} kullanıcı reddettiyse false
 */
async function indir(veri, adi, tur) {
  const blob = veri instanceof Blob ? veri : new Blob([veri], { type: tur });

  const yetenek = await indirmeYetenegi();
  if (yetenek) {
    try {
      await yetenek.save({ filename: adi, data: blob });
      return true;
    } catch (h) {
      // Kullanıcı reddettiyse sessizce bırak; başka bir aksaklıkta normal
      // bağlantı yolunu dene — dosyayı hiç vermemektense denemek yeğdir.
      if (h?.code === 'declined' || h?.code === 'rate_limited') {
        if (h.code === 'rate_limited') bildir('Bir indirme onayı zaten açık. Onu bitirip tekrar deneyin.', 'uyari');
        return false;
      }
      if (h?.code === 'too_large') {
        bildir('Dosya bu ortamda indirilemeyecek kadar büyük. Denetimi bölün ya da kendi sunucunuzdan açın.', 'hata');
        return false;
      }
    }
  }

  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: adi });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}

function dosyaAdi(d, uzanti) {
  const t = new Date(d.baslangic ?? Date.now());
  const iki = (n) => String(n).padStart(2, '0');
  return `denetim_${d.vin || 'sasisiz'}_${t.getFullYear()}${iki(t.getMonth() + 1)}${iki(t.getDate())}_${iki(t.getHours())}${iki(t.getMinutes())}.${uzanti}`;
}

async function excelIndir() {
  try {
    const fotolar = await depo.fotografBaytlari(durum.denetim.id);
    const kitap = excelUret(durum.denetim, fotolar, durum.ayarlar);
    const verildi = await indir(kitap, dosyaAdi(durum.denetim, 'xlsx'), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    if (verildi) bildir(`Excel indirildi — ${fotolar.size} fotoğraf dosyanın içine gömüldü.`);
  } catch (h) {
    bildir(`Excel üretilemedi: ${h.message}`, 'hata');
  }
}

async function topluDisaAktar(denetimler) {
  try {
    const hepsi = new Map();
    for (const d of denetimler) {
      for (const [k, v] of await depo.fotografBaytlari(d.id)) hepsi.set(k, v);
    }
    const kitap = topluExcelUret(denetimler, hepsi, durum.ayarlar);
    const t = new Date();
    const verildi = await indir(kitap, `toplu_denetim_${t.getFullYear()}${String(t.getMonth() + 1).padStart(2, '0')}${String(t.getDate()).padStart(2, '0')}.xlsx`,
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    if (verildi) bildir(`${denetimler.length} denetim tek dosyaya aktarıldı.`);
  } catch (h) {
    bildir(`Toplu aktarım başarısız: ${h.message}`, 'hata');
  }
}

async function yedekIndir() {
  const y = await depo.yedekAl();
  const verildi = await indir(JSON.stringify(y), `arac_audit_yedek_${new Date().toISOString().slice(0, 10)}.json`, 'application/json');
  if (verildi) bildir(`${y.denetimler.length} denetim, ${y.fotograflar.length} fotoğraf yedeklendi.`);
}

    el('div', { style: 'margin-top:12px' },
      el('div', { sinif: 'grup-basligi', metin: 'Ceza puanı ağırlıkları' }),
      el('div', { sinif: 'hata-liste' }, ...SIDDETLER.map((s) =>

      durum.ayarlar.esikler = {

async function baslat() {
  // Belgenin dili Türkçe olmazsa CSS'in text-transform: uppercase kuralı
  // "denetimler" -> "DENETIMLER" yazar; Türkçe'de doğrusu "DENETİMLER"dir.
  // Kendi index.html'imizde lang="tr" var, ama uygulama bir kabuğun (ör.
  // claude.ai Artifact) içine gömülüyse o kabuğun <html>'ini biz yazmayız.
  if (typeof document !== 'undefined') document.documentElement.lang = 'tr';

  try {
    const kayitli = await depo.ayarOku('varsayilanlar', null);
    if (kayitli) durum.ayarlar = { ...durum.ayarlar, ...kayitli, esikler: { ...VARSAYILAN_ESIKLER, ...(kayitli.esikler ?? {}) } };
  } catch { /* ilk açılış: ayar yok */ }
  ciz();
  window.addEventListener('resize', () => {
    const t = document.getElementById('model');
    if (durum.ekran === 'denetim' && t && tuvalOlcusuGuncelle(t)) durum.goruntuleyici?.ciz();
  });
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', baslat);
  else baslat();
}

})();
