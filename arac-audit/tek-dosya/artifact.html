<title>Araç Audit</title>
<style>
/* ARAÇ AUDIT — arayüz stilleri
   Saha koşulu varsayımları: tablet/telefon, eldivenli parmak, parlak fabrika
   aydınlatması. Bu yüzden: en az 44px dokunma hedefi, yüksek kontrast,
   ince gri yazı yok, kritik eylem her zaman ekranın altında (başparmak bölgesi). */

:root {
  --arka: #F4F6F8;
  --kart: #FFFFFF;
  --kenar: #D7DDE5;
  --metin: #111827;
  --metin-soluk: #5B6675;
  --vurgu: #1D4ED8;
  --vurgu-acik: #EFF4FF;
  --a: #D92D20;
  --b: #F79009;
  --c: #EAAA08;
  --yesil: #067647;
  --golge: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
  --yuvarlak: 12px;

  /* Koyu temada değişen yüzeyler. Sabit hex yazarsanız beş ayrı yerde
     bozulur — tek kaynak burasıdır. */
  --model-arka: linear-gradient(180deg, #E8EDF3 0%, #D3DBE4 100%);
  --kaplama: rgba(255, 255, 255, .92);
  --kaplama-kenar: rgba(0, 0, 0, .08);
  --ipucu-arka: rgba(255, 255, 255, .8);
  --uyari-arka: #FFFAEB;
  --uyari-metin: #7A2E0E;
  --uyari-rozet: #B54708;
  --hata-arka: #FEF3F2;
  --hata-metin: #7A271A;
}

/* KOYU TEMA — üç kere tanımlanır, üçü de gerekli:
   (1) izleyicinin sistem tercihi, (2) izleyici açık temayı ZORLADIYSA devre
   dışı kalması, (3) izleyici koyu temayı zorladıysa sistemden bağımsız
   uygulanması. Sadece medya sorgusu yazılırsa tema düğmesi tek yönde çalışır. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --arka: #0E1319; --kart: #171E26; --kenar: #2A3341;
    --metin: #E8EDF3; --metin-soluk: #97A3B4; --vurgu-acik: #17243D;
    --model-arka: linear-gradient(180deg, #1B2430 0%, #121820 100%);
    --kaplama: rgba(23, 30, 38, .9);
    --kaplama-kenar: rgba(255, 255, 255, .1);
    --ipucu-arka: rgba(23, 30, 38, .8);
    --uyari-arka: #2A1F0B; --uyari-metin: #FEDF89; --uyari-rozet: #FEDF89;
    --hata-arka: #2C1512; --hata-metin: #FDA29B;
  }
}

:root[data-theme="dark"] {
  --arka: #0E1319; --kart: #171E26; --kenar: #2A3341;
  --metin: #E8EDF3; --metin-soluk: #97A3B4; --vurgu-acik: #17243D;
  --model-arka: linear-gradient(180deg, #1B2430 0%, #121820 100%);
  --kaplama: rgba(23, 30, 38, .9);
  --kaplama-kenar: rgba(255, 255, 255, .1);
  --ipucu-arka: rgba(23, 30, 38, .8);
  --uyari-arka: #2A1F0B; --uyari-metin: #FEDF89; --uyari-rozet: #FEDF89;
  --hata-arka: #2C1512; --hata-metin: #FDA29B;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--arka); color: var(--metin);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overscroll-behavior-y: contain;
}

body { display: flex; flex-direction: column; }

/* --- Üst çubuk --- */
.ust {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
  background: var(--kart); border-bottom: 1px solid var(--kenar);
}
.ust h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.ust .alt { font-size: 12px; color: var(--metin-soluk); }
.ust-sol { flex: 1; min-width: 0; }
.ust-sol h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.geri {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--kenar);
  background: var(--kart); color: var(--metin); font-size: 20px; line-height: 1;
  display: grid; place-items: center; cursor: pointer; flex: none;
}

/* --- Sayfa gövdesi --- */
main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px; padding-bottom: 96px; -webkit-overflow-scrolling: touch; }
.sayfa { max-width: 900px; margin: 0 auto; display: grid; gap: 14px; }

/* Grid/flex çocuklarının varsayılan min-width:auto'su, içindeki yatay kaydırıcının
   (ör. hızlı seçim şeridi) DARALMASINI engeller: kutu içeriğe göre büyür ve tüm
   sayfa yatay kayar. 15.09.2026 tarayıcı sınavında sayfa 420px yerine 2316px
   ölçüldü; tuval de o yüzden yanlış boyuta gerildi. min-width:0 bunu kapatır. */
.sayfa > *, .kart, .model-sarma { min-width: 0; }

.kart {
  background: var(--kart); border: 1px solid var(--kenar);
  border-radius: var(--yuvarlak); padding: 14px; box-shadow: var(--golge);
}
.kart h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--metin-soluk); }

/* --- Düğmeler --- */
button, .dugme {
  font: inherit; font-weight: 600; cursor: pointer;
  border-radius: 10px; border: 1px solid var(--kenar);
  background: var(--kart); color: var(--metin);
  min-height: 44px; padding: 10px 14px;
}
button:active { transform: translateY(1px); }
.birincil { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
.tehlike { background: var(--a); border-color: var(--a); color: #fff; }
.yesilb { background: var(--yesil); border-color: var(--yesil); color: #fff; }
.kucuk { min-height: 36px; padding: 6px 10px; font-size: 13px; }
.genis { width: 100%; }
button[disabled] { opacity: .45; cursor: not-allowed; }

.dugme-satir { display: flex; gap: 8px; flex-wrap: wrap; }
.dugme-satir > * { flex: 1 1 auto; }

/* --- Form --- */
label.alan { display: grid; gap: 5px; font-size: 13px; color: var(--metin-soluk); font-weight: 600; }
input, select, textarea {
  font: inherit; color: var(--metin); background: var(--kart);
  border: 1px solid var(--kenar); border-radius: 10px;
  padding: 11px 12px; min-height: 44px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--vurgu); outline-offset: -1px; }
.vin-girdi { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; letter-spacing: .13em; text-transform: uppercase; }
.izgara2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .izgara2 { grid-template-columns: 1fr; } }

.uyari { border-left: 3px solid var(--b); background: var(--uyari-arka); color: var(--uyari-metin); padding: 9px 11px; border-radius: 8px; font-size: 13px; }
.hata-kutu { border-left: 3px solid var(--a); background: var(--hata-arka); color: var(--hata-metin); padding: 9px 11px; border-radius: 8px; font-size: 13px; }
.bilgi { border-left: 3px solid var(--vurgu); background: var(--vurgu-acik); padding: 9px 11px; border-radius: 8px; font-size: 13px; }

/* --- Araç seçimi --- */
.arac-izgara { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.arac-kart {
  display: grid; gap: 6px; padding: 14px; text-align: left;
  border: 2px solid var(--kenar); border-radius: var(--yuvarlak); background: var(--kart);
}
.arac-kart[aria-pressed="true"] { border-color: var(--vurgu); background: var(--vurgu-acik); }
.arac-kart b { font-size: 17px; }
.arac-kart span { font-size: 12px; color: var(--metin-soluk); }
.rozet { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--vurgu-acik); color: var(--vurgu); }
.rozet.uyar { background: var(--uyari-arka); color: var(--uyari-rozet); }

/* --- 3B alan --- */
.model-sarma { position: relative; background: var(--model-arka); border-radius: var(--yuvarlak); overflow: hidden; border: 1px solid var(--kenar); }
canvas#model { display: block; width: 100%; height: 300px; touch-action: none; }
@media (min-width: 700px) { canvas#model { height: 380px; } }

.model-arac { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
.model-bakis { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; }
.model-alt { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.model-sarma button { background: var(--kaplama); border-color: var(--kaplama-kenar); color: var(--metin); backdrop-filter: blur(6px); min-height: 34px; padding: 5px 10px; font-size: 12px; }
.model-sarma button[aria-pressed="true"] { background: var(--vurgu); color: #fff; border-color: var(--vurgu); }
.ipucu { font-size: 12px; color: var(--metin-soluk); padding: 6px 10px; background: var(--ipucu-arka); border-radius: 8px; }

/* --- Hızlı seçim --- */
.hizli { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; min-width: 0; }
.hizli button {
  flex: none; text-align: left; display: grid; gap: 2px; min-width: 156px;
  padding: 9px 11px; background: var(--kart);
}
.hizli b { font-size: 13px; }
.hizli span { font-size: 11px; color: var(--metin-soluk); }

/* --- Hata listesi --- */
.hata-liste { display: grid; gap: 8px; }
.hata-satir {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center;
  padding: 10px; border: 1px solid var(--kenar); border-radius: 10px; background: var(--kart);
  text-align: left; width: 100%;
}
.siddet-pul { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 13px; }
.siddet-A { background: var(--a); } .siddet-B { background: var(--b); } .siddet-C { background: var(--c); color: #4A3200; }
.hata-satir .yol { font-size: 11px; color: var(--metin-soluk); }
.hata-satir .ad { font-weight: 600; font-size: 14px; }
.hata-satir .sag { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--metin-soluk); }
.foto-pul { width: 34px; height: 34px; border-radius: 6px; object-fit: cover; border: 1px solid var(--kenar); }
.foto-sayi { background: var(--vurgu-acik); color: var(--vurgu); font-weight: 700; padding: 2px 7px; border-radius: 99px; }

/* --- Alt eylem çubuğu --- */
.alt-cubuk {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: flex; gap: 8px; padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 10px);
  background: var(--kart); border-top: 1px solid var(--kenar);
}
.alt-cubuk > * { flex: 1; }

/* --- Modal / alt sayfa --- */
.perde { position: fixed; inset: 0; background: rgba(9, 14, 22, .55); z-index: 40; display: grid; align-items: end; }
.sayfa-alt {
  background: var(--kart); border-radius: 18px 18px 0 0; max-height: 92vh; overflow-y: auto;
  padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; gap: 12px;
}
@media (min-width: 700px) { .perde { align-items: center; justify-items: center; } .sayfa-alt { border-radius: 16px; width: min(680px, 94vw); max-height: 86vh; } }
.sayfa-alt h3 { margin: 0; font-size: 17px; }
.tutamak { width: 40px; height: 4px; background: var(--kenar); border-radius: 99px; margin: -6px auto 2px; }

.grup-basligi { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--metin-soluk); margin-top: 6px; }
.secenek-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 7px; }
.secenek {
  text-align: left; padding: 10px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--kenar); border-radius: 9px; background: var(--kart); min-height: 42px;
}
.secenek[aria-pressed="true"] { border-color: var(--vurgu); background: var(--vurgu-acik); color: var(--vurgu); }
.secenek small { display: block; font-weight: 500; color: var(--metin-soluk); font-size: 11px; }

.siddet-secim { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.siddet-secim button[aria-pressed="true"].s-A { background: var(--a); color: #fff; border-color: var(--a); }
.siddet-secim button[aria-pressed="true"].s-B { background: var(--b); color: #fff; border-color: var(--b); }
.siddet-secim button[aria-pressed="true"].s-C { background: var(--c); color: #3A2800; border-color: var(--c); }

.adet-kutu { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.adet-kutu input { text-align: center; font-weight: 700; font-size: 17px; }

.foto-serit { display: flex; gap: 8px; flex-wrap: wrap; }
.foto-kutu { position: relative; width: 84px; height: 84px; border-radius: 9px; overflow: hidden; border: 1px solid var(--kenar); }
.foto-kutu img { width: 100%; height: 100%; object-fit: cover; display: block; }
.foto-kutu button { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; min-height: 24px; padding: 0; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; border: 0; font-size: 14px; line-height: 1; }
.foto-ekle { width: 84px; height: 84px; display: grid; place-items: center; border: 2px dashed var(--kenar); border-radius: 9px; background: transparent; font-size: 11px; color: var(--metin-soluk); gap: 2px; }

/* --- Özet kutuları --- */
.olcu-izgara { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; }
.olcu { background: var(--kart); border: 1px solid var(--kenar); border-radius: 10px; padding: 10px; }
.olcu b { display: block; font-size: 22px; line-height: 1.15; }
.olcu span { font-size: 11px; color: var(--metin-soluk); }
.sonuc-pul { font-weight: 800; padding: 4px 10px; border-radius: 99px; font-size: 13px; }
.sonuc-KABUL { background: #ECFDF3; color: var(--yesil); }
.sonuc-SARTLI { background: #FFFAEB; color: #B54708; }
.sonuc-RED { background: #FEF3F2; color: #912018; }

/* --- Denetim listesi --- */
.liste-satir { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--kenar); border-radius: 10px; background: var(--kart); text-align: left; width: 100%; }
.liste-satir .vin { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 700; }
.liste-satir .meta { font-size: 12px; color: var(--metin-soluk); }

.bos { text-align: center; color: var(--metin-soluk); padding: 26px 12px; font-size: 14px; }

/* İlk açılış: boş liste yerine akışın kendisi. */
.nasil { font-size: 14px; color: var(--metin-soluk); }
.nasil p { margin: 0 0 10px; }
.nasil ol { margin: 0; padding-left: 20px; display: grid; gap: 9px; }
.nasil li { line-height: 1.5; }
.nasil b { color: var(--metin); }
.nasil-not { margin: 12px 0 0; font-size: 12.5px; padding-top: 10px; border-top: 1px solid var(--kenar); }

/* --- Rapor --- */
.rapor { background: #fff; color: #111827; padding: 18px; border-radius: var(--yuvarlak); }
.rapor h1 { font-size: 19px; margin: 0 0 2px; }
.rapor .r-arac { margin: 0 0 14px; color: #5B6675; font-size: 13px; }
.r-izgara { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-bottom: 12px; }
.r-alan { border: 1px solid #E4E8EE; border-radius: 8px; padding: 7px 9px; }
.r-alan span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: #6B7684; }
.r-alan strong { font-size: 13px; }
.r-sonuc { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 8px; margin-bottom: 12px; background: #F4F6F8; }
.r-sonuc-RED { background: #FEF3F2; } .r-sonuc-SARTLI { background: #FFFAEB; } .r-sonuc-KABUL { background: #ECFDF3; }
.r-sonuc span { font-size: 12px; color: #5B6675; }
/* Rapor tablosu telefonda sığmaz. Sayfanın tamamını yatay kaydırmak yerine
   tabloyu KENDİ kaydırıcısına alıyoruz; başlık ve özet yerinde kalır. */
.r-kaydir { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.r-tablo { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 12px; }
.r-tablo th { background: #1D4ED8; color: #fff; padding: 7px 6px; text-align: left; font-size: 11px; }
.r-tablo td { border: 1px solid #E4E8EE; padding: 6px; vertical-align: top; }
.r-s { text-align: center; font-weight: 800; }
.r-sA { background: #FEE4E2; color: #912018; } .r-sB { background: #FEF0C7; color: #B54708; } .r-sC { background: #FEFBE8; color: #854A0E; }
.r-foto img { width: 92px; height: 70px; object-fit: cover; border-radius: 4px; margin: 1px; }
.r-not { font-size: 11px; color: #6B7684; margin-top: 12px; }

@media print {
  .ust, .alt-cubuk, .yazdirma-gizle { display: none !important; }
  main { padding: 0; overflow: visible; }
  .rapor { border: 0; padding: 0; }
  .r-kaydir { overflow: visible; }
  .r-tablo { min-width: 0; }
  body { background: #fff; }
}

.gizli { display: none !important; }
.yukleniyor { text-align: center; padding: 30px; color: var(--metin-soluk); }


/* Artifact kabuğu :root'a güvenli alan payını ZATEN ekliyor. */
.ust { padding-top: 10px; }
.alt-cubuk { padding-bottom: 10px; }
html, body { height: 100%; }
</style>

<script>
"use strict";
(function () {

/* ===== katalog.js ===== */
// ARAÇ AUDIT — HATA KATALOĞU
// ---------------------------------------------------------------------------
// Bu dosya ürünün kalbidir: denetçinin elle yazmak yerine SEÇTİĞİ her şey
// burada tanımlıdır. Üç katmanlı yapı kullanılır:
//
//     BÖLGE  ->  PARÇA  ->  HATA TİPİ
//     "Sol yan"  "Arka kapı"  "Gıcırtı"        = Rear door squeak noise
//     "İç tavan" "A direği garnişi" "Göçük"    = A pillar garnish dent
//
// Her parça, KENDİSİNE UYGUN hata gruplarını bildirir; böylece "multimedya
// ekranı" için "boya akıntısı" gibi anlamsız bir seçenek hiç listelenmez.
//
// DÜRÜSTLÜK NOTU (AGENTS.md kuralı): aşağıdaki ceza puanı (demerit) ağırlıkları
// ve kritiklik sınıfları ÖRNEK BAŞLANGIÇ DEĞERLERİDİR. Hiçbir üreticinin
// resmî audit standardından ölçülmemiştir. Kendi standardınızın ağırlıklarını
// girene kadar "puan" sütununu yalnızca kendi içinde kıyas için kullanın.
// ---------------------------------------------------------------------------

/** Kritiklik sınıfları. puan = ceza puanı (demerit) ağırlığı. */
const SIDDETLER = [
  { id: 'A', ad: 'Kritik',  en: 'Critical', puan: 10, renk: '#d92d20', aciklama: 'Güvenlik, yasal uygunluk veya fonksiyon kaybı. Araç sevk edilemez.' },
  { id: 'B', ad: 'Majör',   en: 'Major',    puan: 5,  renk: '#f79009', aciklama: 'Müşterinin teslimde kesinlikle fark edeceği hata.' },
  { id: 'C', ad: 'Minör',   en: 'Minor',    puan: 1,  renk: '#eaaa08', aciklama: 'Dikkatli incelemede fark edilen, kozmetik hata.' },
];

/** Hata grupları — parçalar bu grupları referans alır. */
const HATA_GRUPLARI = {
  yuzey:        { ad: 'Yüzey / Boya',      en: 'Surface / Paint' },
  montaj:       { ad: 'Montaj / Uyum',     en: 'Fit & Finish' },
  ses:          { ad: 'Ses (NVH)',         en: 'Noise (NVH)' },
  fonksiyon:    { ad: 'Fonksiyon',         en: 'Function' },
  doseme:       { ad: 'Döşeme / Kumaş',    en: 'Trim / Fabric' },
  cam:          { ad: 'Cam',               en: 'Glass' },
  sizdirmazlik: { ad: 'Sızdırmazlık',      en: 'Sealing / Leak' },
  temizlik:     { ad: 'Temizlik',          en: 'Cleanliness' },

/**
 * Hata tipleri. `siddet` alanı ÖNERİLEN başlangıç sınıfıdır; denetçi
 * kayıt sırasında değiştirebilir (gerçek sınıf hatanın yerine/boyutuna bağlıdır).
 */
const HATA_TIPLERI = [
  // --- Yüzey / Boya ---
  { id: 'cizik',        grup: 'yuzey', ad: 'Çizik',                 en: 'Scratch',           siddet: 'C' },
  { id: 'gocuk',        grup: 'yuzey', ad: 'Göçük',                 en: 'Dent',              siddet: 'B' },

/**
 * "Ön çamurluk" -> "ön çamurluk". Ama "A direği garnişi" ve "USB / kablosuz şarj"
 * gibi tek harfli ya da tümü büyük kısaltmayla başlayan adlar OLDUĞU GİBİ kalır;
 * yoksa "Sol a direği garnişi" gibi yanlış bir ad üretilir.
 */
function bastanKucult(ad) {
  const ilkKelime = ad.split(/[\s/]/, 1)[0];
  if (ilkKelime.length <= 1 || ilkKelime === ilkKelime.toLocaleUpperCase('tr')) return ad;
  return ad.charAt(0).toLocaleLowerCase('tr') + ad.slice(1);
}

/** Sol/sağ çift parçaları açan yardımcı. */
function ciftle(parcalar) {
  const cikti = [];
  for (const p of parcalar) {
    if (!p.cift) { cikti.push(p); continue; }
    for (const [tk, tad, ten] of [['sol', 'Sol', 'LH'], ['sag', 'Sağ', 'RH']]) {
      cikti.push({
        ...p,
        cift: false,
        taraf: tk,
        id: `${tk}_${p.id}`,
        ad: `${tad} ${bastanKucult(p.ad)}`,
        en: `${ten} ${bastanKucult(p.en)}`,
        mesh: p.mesh ? `${tk}_${p.mesh}` : undefined,
      });
    }
  }
  return cikti;
}

/* ===== vin.js ===== */
// VIN (şasi numarası) ve plaka doğrulama.
// VIN her zaman 17 karakterdir (ISO 3779). I, O, Q harfleri hiç kullanılmaz —
// 1, 0 ile karışmasın diye. Barkod okuyucu ya da elle giriş, ikisi de buradan
// geçer; böylece "yanlış okundu" hatası kaydın en başında yakalanır.

const VIN_UZUNLUK = 17;

/** VIN'de yasak harfler: I, O, Q. */
const YASAK = /[IOQ]/g;

/** Harf -> sayı çevrimi (ISO 3779 kontrol hanesi hesabı). */
const HARF_DEGER = {
  A: 1, B: 2, C: 3, D: 4, E: 5, F: 6, G: 7, H: 8,
  J: 1, K: 2, L: 3, M: 4, N: 5, P: 7, R: 9,
  S: 2, T: 3, U: 4, V: 5, W: 6, X: 7, Y: 8, Z: 9,
};

/** Hane ağırlıkları; 9. hane (kontrol hanesi) 0 ağırlıklıdır. */
const AGIRLIK = [8, 7, 6, 5, 4, 3, 2, 10, 0, 9, 8, 7, 6, 5, 4, 3, 2];

/** Model yılı kodları — I, O, Q, U, Z ve 0 kullanılmaz. 30 yılda bir tekrarlar. */
const YIL_KODLARI = 'ABCDEFGHJKLMNPRSTVWXY123456789'.split('');

/**
 * Okunan metni VIN'e çevirir: boşluk/tire atılır, büyütülür ve barkodun
 * sıkça karıştırdığı karakterler düzeltilir (VIN'de I/O/Q olamayacağı için
 * bu düzeltme güvenlidir, tahmin değildir).
 */
function vinNormalize(ham) {
  return String(ham ?? '')
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, '')
    .replace(/I/g, '1')
    .replace(/O/g, '0')
    .replace(/Q/g, '0');
}

/** ISO 3779 kontrol hanesini hesaplar; 10 sonucu 'X' ile gösterilir. */
function kontrolHanesi(vin) {
  let toplam = 0;
  for (let i = 0; i < VIN_UZUNLUK; i++) {
    const k = vin[i];
    const deger = k >= '0' && k <= '9' ? Number(k) : HARF_DEGER[k];
    if (deger === undefined) return null;
    toplam += deger * AGIRLIK[i];
  }
  const kalan = toplam % 11;
  return kalan === 10 ? 'X' : String(kalan);
}

/**
 * VIN'in 10. hanesinden model yılı. 30 yıllık döngü olduğu için hangi
 * döngüde olduğumuzu içinde bulunulan yıla göre seçeriz.
 * @param {string} kod tek karakter
 * @param {number} buYil
 */
function modelYili(kod, buYil = new Date().getFullYear()) {
  const i = YIL_KODLARI.indexOf(String(kod).toUpperCase());
  if (i === -1) return null;
  let yil = 1980 + i;
  while (yil + 30 <= buYil + 1) yil += 30;
  return yil;
}

/**
 * Üretici ön eki (WMI) için okunabilir ad.
 * DİKKAT: bu tablo bilgi amaçlıdır, resmî SAE/ISO kaydından doğrulanmamıştır.
 * Ayarlar ekranından düzenlenebilir; hiçbir kararı tek başına bağlamaz.
 */
const WMI_IPUCU = {
  NLH: 'Hyundai Assan — Türkiye (doğrulayın)',
  TMA: 'Hyundai — Çekya (doğrulayın)',
  KMH: 'Hyundai — Kore (doğrulayın)',
  NMT: 'Toyota — Türkiye (doğrulayın)',
  VF1: 'Renault — Fransa (doğrulayın)',
};

/**
 * VIN'i doğrular.
 * @returns {{gecerli:boolean, vin:string, hatalar:string[], uyarilar:string[], bilgi:object}}
 */
function vinDogrula(ham) {
  const vin = vinNormalize(ham);
  const hatalar = [];
  const uyarilar = [];

  if (vin.length === 0) {
    hatalar.push('Şasi numarası boş.');
  } else if (vin.length !== VIN_UZUNLUK) {
    hatalar.push(`Şasi numarası ${VIN_UZUNLUK} karakter olmalı — ${vin.length} karakter okundu.`);
  }
  if (YASAK.test(vin)) {
    YASAK.lastIndex = 0;
    hatalar.push('VIN içinde I, O veya Q harfi bulunamaz.');
  }

  const bilgi = {};
  if (hatalar.length === 0) {
    bilgi.wmi = vin.slice(0, 3);
    bilgi.uretici = WMI_IPUCU[bilgi.wmi] ?? null;
    bilgi.govde = vin.slice(3, 9);
    bilgi.yilKodu = vin[9];
    bilgi.modelYili = modelYili(vin[9]);
    bilgi.fabrikaKodu = vin[10];
    bilgi.seriNo = vin.slice(11);

    const beklenen = kontrolHanesi(vin);
    bilgi.kontrolHanesi = vin[8];
    bilgi.beklenenKontrolHanesi = beklenen;
    bilgi.kontrolHanesiUyuyor = beklenen !== null && beklenen === vin[8];
    // Avrupa'da üretilen bazı araçlarda 9. hane kontrol hanesi DEĞİLDİR.
    // Bu yüzden uyuşmazlık kaydı engellemez, yalnız uyarır.
    if (!bilgi.kontrolHanesiUyuyor) {
      uyarilar.push(`Kontrol hanesi uyuşmuyor (okunan "${vin[8]}", hesaplanan "${beklenen}"). Avrupa üretimi araçlarda bu hane kontrol hanesi olmayabilir; yine de barkodu bir kez daha okutun.`);
    }
    if (bilgi.modelYili === null) {
      uyarilar.push('10. hane geçerli bir model yılı kodu değil.');
    }
  }

  return { gecerli: hatalar.length === 0, vin, hatalar, uyarilar, bilgi };
}

// --- PLAKA ---------------------------------------------------------------
// Fabrika denetiminde araçların çoğunda plaka olmaz; bu alan zorunlu değildir.
// Türk plakası girilirse biçim kontrol edilir, uymayan giriş ENGELLENMEZ,
// yalnızca uyarı verilir (ihracat/geçici plaka olabilir).

const PLAKA_DESEN = /^(0[1-9]|[1-7]\d|8[01])([A-Z]{1,3})(\d{2,5})$/;

function plakaNormalize(ham) {
  return String(ham ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '')
    .replace(/İ/g, 'I').replace(/Ş/g, 'S').replace(/Ğ/g, 'G')
    .replace(/Ü/g, 'U').replace(/Ö/g, 'O').replace(/Ç/g, 'C');
}

/**
 * Türk plakasını biçimlendirir ve doğrular.
 * Kural: 1 harf -> 4-5 rakam, 2 harf -> 3-4 rakam, 3 harf -> 2 rakam.
 */
function plakaDogrula(ham) {
  const p = plakaNormalize(ham);
  if (!p) return { gecerli: true, plaka: '', bicimli: '', uyarilar: [] };

  const m = PLAKA_DESEN.exec(p);
  if (!m) {
    return { gecerli: false, plaka: p, bicimli: p, uyarilar: ['Türk plaka biçimine uymuyor (örn. 41 ABC 12). Geçici veya ihracat plakasıysa olduğu gibi bırakabilirsiniz.'] };
  }
  const [, il, harf, rakam] = m;
  const izinli = { 1: [4, 5], 2: [3, 4], 3: [2, 2] }[harf.length];
  const uyarilar = [];
  if (rakam.length < izinli[0] || rakam.length > izinli[1]) {
    uyarilar.push(`${harf.length} harfli plakada ${izinli[0]}${izinli[0] === izinli[1] ? '' : '-' + izinli[1]} rakam beklenir.`);
  }
  return { gecerli: uyarilar.length === 0, plaka: p, bicimli: `${il} ${harf} ${rakam}`, il, uyarilar };
}


/* ===== zip.js ===== */
// Küçük ZIP yazıcı — dış bağımlılık YOK.
// XLSX aslında içinde XML dosyaları olan bir ZIP arşividir. Excel, sıkıştırılmamış
// ("store", yöntem 0) girdileri sorunsuz açar; bu yüzden deflate uygulamıyoruz.
// Fotoğraflar zaten JPEG olarak sıkıştırılmış geldiği için kayıp da yok.

/** CRC-32 tablosu (IEEE 802.3 polinomu, tersine çevrilmiş 0xEDB88320). */
const CRC_TABLO = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bayt) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bayt.length; i++) c = CRC_TABLO[(c ^ bayt[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

const KODLAYICI = new TextEncoder();

/** Tarihi DOS zaman/tarih ikilisine çevirir (ZIP başlığı böyle ister). */
function dosTarih(d) {
  const yil = Math.max(1980, d.getFullYear());
  return {
    zaman: (d.getHours() << 11) | (d.getMinutes() << 5) | (Math.floor(d.getSeconds() / 2)),
    tarih: ((yil - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(),
  };
}

class Yazici {
  constructor() { this.parcalar = []; this.uzunluk = 0; }
  ekle(u8) { this.parcalar.push(u8); this.uzunluk += u8.length; }
  u16(v) { const b = new Uint8Array(2); b[0] = v & 0xFF; b[1] = (v >>> 8) & 0xFF; this.ekle(b); }
  u32(v) { const b = new Uint8Array(4); b[0] = v & 0xFF; b[1] = (v >>> 8) & 0xFF; b[2] = (v >>> 16) & 0xFF; b[3] = (v >>> 24) & 0xFF; this.ekle(b); }
  topla() {
    const cikti = new Uint8Array(this.uzunluk);
    let o = 0;
    for (const p of this.parcalar) { cikti.set(p, o); o += p.length; }
    return cikti;
  }
}

/**
 * Dosya listesinden ZIP arşivi üretir.
 * @param {{ad:string, veri:Uint8Array|string}[]} dosyalar
 * @param {Date} [tarih]
 * @returns {Uint8Array}
 */
function zipOlustur(dosyalar, tarih = new Date()) {
  const { zaman, tarih: dtarih } = dosTarih(tarih);
  const z = new Yazici();
  const merkez = [];

  for (const d of dosyalar) {
    const ad = KODLAYICI.encode(d.ad);
    const veri = typeof d.veri === 'string' ? KODLAYICI.encode(d.veri) : d.veri;
    const kontrol = crc32(veri);
    const konum = z.uzunluk;

    // Yerel dosya başlığı
    z.u32(0x04034b50);
    z.u16(20);      // çıkarmak için gereken sürüm
    z.u16(0x0800);  // bayrak: dosya adı UTF-8
    z.u16(0);       // yöntem: store
    z.u16(zaman); z.u16(dtarih);
    z.u32(kontrol); z.u32(veri.length); z.u32(veri.length);
    z.u16(ad.length); z.u16(0);
    z.ekle(ad);
    z.ekle(veri);

    merkez.push({ ad, kontrol, boyut: veri.length, konum });
  }

  const merkezBasi = z.uzunluk;
  for (const m of merkez) {
    z.u32(0x02014b50);
    z.u16(20); z.u16(20);
    z.u16(0x0800); z.u16(0);
    z.u16(zaman); z.u16(dtarih);
    z.u32(m.kontrol); z.u32(m.boyut); z.u32(m.boyut);
    z.u16(m.ad.length); z.u16(0); z.u16(0);
    z.u16(0); z.u16(0); z.u32(0);
    z.u32(m.konum);
    z.ekle(m.ad);
  }
  const merkezBoyu = z.uzunluk - merkezBasi;

  // Merkezî dizin sonu kaydı
  z.u32(0x06054b50);
  z.u16(0); z.u16(0);
  z.u16(merkez.length); z.u16(merkez.length);
  z.u32(merkezBoyu); z.u32(merkezBasi);
  z.u16(0);

  return z.topla();
}


/* ===== goruntu.js ===== */
// Görüntü yardımcıları: boyut okuma (Excel'e gömerken en/boy oranı için şart)
// ve tarayıcı tarafında küçültme (30 fotoğraflı bir denetim 150 MB olmasın diye).

/**
 * PNG / JPEG baytlarından piksel ölçüsünü okur. Tarayıcı API'sine ihtiyaç
 * duymaz, bu yüzden testte de çalışır.
 * @returns {{en:number, boy:number, tur:'png'|'jpeg'}|null}
 */
function goruntuBoyutu(bayt) {
  if (!bayt || bayt.length < 24) return null;

  // PNG: 8 baytlık imza + IHDR (en/boy 16. bayttan itibaren, big-endian)
  if (bayt[0] === 0x89 && bayt[1] === 0x50 && bayt[2] === 0x4E && bayt[3] === 0x47) {
    const g = (i) => (bayt[i] << 24 | bayt[i + 1] << 16 | bayt[i + 2] << 8 | bayt[i + 3]) >>> 0;
    return { en: g(16), boy: g(20), tur: 'png' };
  }

  // JPEG: SOI'den sonra bölümleri atlayarak SOFn işaretini bul
  if (bayt[0] === 0xFF && bayt[1] === 0xD8) {
    let i = 2;
    while (i + 9 < bayt.length) {
      if (bayt[i] !== 0xFF) { i++; continue; }
      const im = bayt[i + 1];
      if (im === 0xD8 || im === 0x01 || (im >= 0xD0 && im <= 0xD7)) { i += 2; continue; }
      const uzunluk = (bayt[i + 2] << 8) | bayt[i + 3];
      // SOF0..SOF15 (DHT=C4, JPG=C8, DAC=CC hariç) çerçeve boyutunu taşır
      const sof = im >= 0xC0 && im <= 0xCF && im !== 0xC4 && im !== 0xC8 && im !== 0xCC;
      if (sof) {
        return { boy: (bayt[i + 5] << 8) | bayt[i + 6], en: (bayt[i + 7] << 8) | bayt[i + 8], tur: 'jpeg' };
      }
      if (uzunluk < 2) return null;
      i += 2 + uzunluk;
    }
  }
  return null;
}

/** MIME türünü baytlardan çıkarır (Excel ilişkisinde uzantı doğru olmalı). */
function goruntuTuru(bayt) {
  const b = goruntuBoyutu(bayt);
  return b ? (b.tur === 'png' ? 'image/png' : 'image/jpeg') : 'application/octet-stream';
}

/**
 * Tarayıcıda fotoğrafı küçültür ve JPEG'e çevirir.
 * Telefon kamerası 4000x3000 üretir; 30 hatalı bir denetimde bu 150 MB'lık
 * bir Excel demektir. 1600 px uzun kenar, denetim fotoğrafı için fazlasıyla
 * yeterli ve dosyayı ~40 kat küçültür.
 * @param {Blob} blob
 * @param {number} [enFazla] uzun kenar (piksel)
 * @param {number} [kalite] 0-1
 * @returns {Promise<{blob:Blob, en:number, boy:number}>}
 */
async function fotografKucult(blob, enFazla = 1600, kalite = 0.82) {
  const bitmap = await createImageBitmap(blob);
  const oran = Math.min(1, enFazla / Math.max(bitmap.width, bitmap.height));
  const en = Math.max(1, Math.round(bitmap.width * oran));
  const boy = Math.max(1, Math.round(bitmap.height * oran));

  const tuval = typeof OffscreenCanvas !== 'undefined'
    ? new OffscreenCanvas(en, boy)
    : Object.assign(document.createElement('canvas'), { width: en, height: boy });
  const ctx = tuval.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, en, boy);
  bitmap.close?.();

  const kucuk = tuval.convertToBlob
    ? await tuval.convertToBlob({ type: 'image/jpeg', quality: kalite })
    : await new Promise((c) => tuval.toBlob(c, 'image/jpeg', kalite));
  return { blob: kucuk, en, boy };
}


/* ===== xlsx.js ===== */
// XLSX (Excel) yazıcı — dış bağımlılık YOK.
// Excel'in .xlsx dosyası, içinde XML bulunan bir ZIP'tir. Burada yalnız
// ihtiyacımız olan parçaları üretiyoruz: biçimler, sayfalar ve GÖMÜLÜ GÖRSEL.
// Fotoğrafın hatanın yanındaki hücreye oturması bu dosyanın çizim (drawing)
// bölümüyle olur; Excel açıldığında fotoğraf gerçekten dosyanın içindedir,
// bağlantı değildir — dosyayı e-postayla göndermek yeter.



const EMU_PIKSEL = 9525;      // 1 piksel = 9525 EMU
const PUAN_PIKSEL = 96 / 72;  // 1 punto = 1.333 piksel

// XML 1.0'da yasak olan denetim karakterleri. Bunlar dosyaya sızarsa Excel
// dosyayı "bozuk" sayıp açmayı reddeder — barkod okuyucular ara sıra üretir.
const YASAK_DENETIM = new RegExp('[\\u0000-\\u0008\\u000B\\u000C\\u000E-\\u001F]', 'g');

function xmlKacis(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;')
    .replace(YASAK_DENETIM, '');
}

/** 0 tabanlı sütun numarasını Excel harfine çevirir: 0 -> A, 26 -> AA */
function sutunAdi(i) {
  let s = '';
  for (let n = i + 1; n > 0; n = Math.floor((n - 1) / 26)) {
    s = String.fromCharCode(65 + ((n - 1) % 26)) + s;
  }
  return s;
}

function hucreAdi(satir, sutun) { return `${sutunAdi(sutun)}${satir + 1}`; }

// --- BİÇİMLER -------------------------------------------------------------

// --- SAYFA ÜRETİMİ --------------------------------------------------------

function hucreXml(satirNo, sutunNo, hucre) {
  if (hucre === null || hucre === undefined || hucre === '') return '';
  const nesne = typeof hucre === 'object';
  const v = nesne ? hucre.v : hucre;
  const stil = nesne ? (hucre.stil ?? 0) : 0;
  const ref = hucreAdi(satirNo, sutunNo);
  const s = stil ? ` s="${stil}"` : '';

  if (v === null || v === undefined || v === '') return `<c r="${ref}"${s}/>`;
  if (typeof v === 'number' && Number.isFinite(v)) return `<c r="${ref}"${s}><v>${v}</v></c>`;
  if (typeof v === 'boolean') return `<c r="${ref}"${s} t="b"><v>${v ? 1 : 0}</v></c>`;
  // Baştaki/sondaki boşluğun korunması için xml:space="preserve" şart
  return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlKacis(v)}</t></is></c>`;
}

/**
 * Tek sayfanın XML'ini üretir.
 * @param {object} sayfa
 * @param {boolean} cizimVar sayfada gömülü görsel var mı
 */
function sayfaXml(sayfa, cizimVar) {
  const satirlar = sayfa.satirlar ?? [];
  const yukseklikler = sayfa.satirYukseklikleri ?? {};

  let govde = '';
  for (let r = 0; r < satirlar.length; r++) {
    const hucreler = satirlar[r] ?? [];
    let ic = '';
    for (let c = 0; c < hucreler.length; c++) ic += hucreXml(r, c, hucreler[c]);
    const h = yukseklikler[r];
    const hAttr = h ? ` ht="${h}" customHeight="1"` : '';
    if (!ic && !hAttr) continue;
    govde += `<row r="${r + 1}"${hAttr}>${ic}</row>`;
  }

  const sutunlar = (sayfa.sutunGenislikleri ?? []).map((g, i) =>
    g ? `<col min="${i + 1}" max="${i + 1}" width="${g}" customWidth="1"/>` : '').join('');

  const dondur = sayfa.dondur
    ? `<pane xSplit="${sayfa.dondur.sutun ?? 0}" ySplit="${sayfa.dondur.satir ?? 0}" topLeftCell="${hucreAdi(sayfa.dondur.satir ?? 0, sayfa.dondur.sutun ?? 0)}" activePane="bottomRight" state="frozen"/>`
    : '';

  const birlesik = (sayfa.birlesikler ?? []).length
    ? `<mergeCells count="${sayfa.birlesikler.length}">${sayfa.birlesikler.map((m) => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>`
    : '';

  const filtre = sayfa.filtre ? `<autoFilter ref="${sayfa.filtre}"/>` : '';
  const sonSutun = Math.max(0, (sayfa.sutunGenislikleri?.length ?? 1) - 1);
  const boyutlar = satirlar.length
    ? `<dimension ref="A1:${hucreAdi(satirlar.length - 1, sonSutun)}"/>`
    : '<dimension ref="A1"/>';

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
${boyutlar}
<sheetViews><sheetView workbookViewId="0"${sayfa.ilkSayfa ? ' tabSelected="1"' : ''}>${dondur}</sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
${sutunlar ? `<cols>${sutunlar}</cols>` : ''}
<sheetData>${govde}</sheetData>
${filtre}${birlesik}
<pageMargins left="0.4" right="0.4" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>
<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/>
${cizimVar ? '<drawing r:id="rIdDrawing"/>' : ''}
</worksheet>`;
}

/** Gömülü görsellerin yerleşim XML'i (her görsel kendi hücresine oturur). */
function cizimXml(gorseller) {
  const parcalar = gorseller.map((g, i) => {
    const cx = Math.round(g.gosterEn * EMU_PIKSEL);
    const cy = Math.round(g.gosterBoy * EMU_PIKSEL);
    const kayma = Math.round((g.xKayma ?? 0) * EMU_PIKSEL);
    return `<xdr:oneCellAnchor>
<xdr:from><xdr:col>${g.sutun}</xdr:col><xdr:colOff>${kayma + 19050}</xdr:colOff><xdr:row>${g.satir}</xdr:row><xdr:rowOff>19050</xdr:rowOff></xdr:from>
<xdr:ext cx="${cx}" cy="${cy}"/>
<xdr:pic>
<xdr:nvPicPr><xdr:cNvPr id="${i + 2}" name="${xmlKacis(g.ad ?? `Fotograf ${i + 1}`)}" descr="${xmlKacis(g.aciklama ?? '')}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>
<xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="rId${i + 1}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>
<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr>
</xdr:pic>
<xdr:clientData/>
</xdr:oneCellAnchor>`;
  }).join('');

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${parcalar}</xdr:wsDr>`;
}

/** Sayfa adındaki Excel'in kabul etmediği karakterleri temizler. */
function sayfaAdiTemizle(ad) {
  return String(ad).replace(/[\\/?*[\]:]/g, '-').slice(0, 31) || 'Sayfa';
}

/**
 * Görselin hücre içinde kaplayacağı ölçüyü hesaplar (en/boy oranı korunur).
 * @returns {{en:number, boy:number}} piksel
 */
function gosterimOlcusu(bayt, enFazlaEn = 150, enFazlaBoy = 110) {
  const b = goruntuBoyutu(bayt);
  if (!b || !b.en || !b.boy) return { en: enFazlaEn, boy: enFazlaBoy };
  const oran = Math.min(enFazlaEn / b.en, enFazlaBoy / b.boy);
  return { en: Math.max(1, Math.round(b.en * oran)), boy: Math.max(1, Math.round(b.boy * oran)) };
}

/**
 * Çalışma kitabını üretir.
 * @param {object[]} sayfalar
 * @param {{baslik?:string, yazar?:string, tarih?:Date}} [ustVeri]
 * @returns {Uint8Array}
 */
function xlsxOlustur(sayfalar, ustVeri = {}) {
  const tarih = ustVeri.tarih ?? new Date();
  const dosyalar = [];
  const icerikTurleri = [];
  const kitapSayfalari = [];
  const kitapIliski = [];

  let gorselSayaci = 0;

  sayfalar.forEach((sayfa, i) => {
    const no = i + 1;
    const gorseller = sayfa.gorseller ?? [];
    const cizimVar = gorseller.length > 0;

    dosyalar.push({ ad: `xl/worksheets/sheet${no}.xml`, veri: sayfaXml({ ...sayfa, ilkSayfa: i === 0 }, cizimVar) });
    icerikTurleri.push(`<Override PartName="/xl/worksheets/sheet${no}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
    kitapSayfalari.push(`<sheet name="${xmlKacis(sayfaAdiTemizle(sayfa.ad))}" sheetId="${no}" r:id="rId${no}"/>`);
    kitapIliski.push(`<Relationship Id="rId${no}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${no}.xml"/>`);

    if (!cizimVar) return;

    const medyaIliskileri = [];
    gorseller.forEach((g, gi) => {
      gorselSayaci += 1;
      const png = goruntuBoyutu(g.veri)?.tur === 'png';
      const medyaAd = `image${gorselSayaci}.${png ? 'png' : 'jpg'}`;
      dosyalar.push({ ad: `xl/media/${medyaAd}`, veri: g.veri });
      medyaIliskileri.push(`<Relationship Id="rId${gi + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/${medyaAd}"/>`);
    });

    dosyalar.push({ ad: `xl/drawings/drawing${no}.xml`, veri: cizimXml(gorseller) });
    dosyalar.push({
      ad: `xl/drawings/_rels/drawing${no}.xml.rels`,
      veri: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${medyaIliskileri.join('')}</Relationships>`,
    });
    dosyalar.push({
      ad: `xl/worksheets/_rels/sheet${no}.xml.rels`,
      veri: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdDrawing" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/drawing${no}.xml"/></Relationships>`,
    });
    icerikTurleri.push(`<Override PartName="/xl/drawings/drawing${no}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);
  });

  dosyalar.unshift(
    {
      ad: '[Content_Types].xml',
      veri: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Default Extension="jpg" ContentType="image/jpeg"/>
<Default Extension="jpeg" ContentType="image/jpeg"/>
<Default Extension="png" ContentType="image/png"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>
${icerikTurleri.join('\n')}
</Types>`,
    },
    {
      ad: '_rels/.rels',
      veri: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>
</Relationships>`,
    },
    {
      ad: 'docProps/core.xml',
      veri: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
<dc:title>${xmlKacis(ustVeri.baslik ?? 'Arac Denetim Raporu')}</dc:title>
<dc:creator>${xmlKacis(ustVeri.yazar ?? 'Arac Audit')}</dc:creator>
<cp:lastModifiedBy>${xmlKacis(ustVeri.yazar ?? 'Arac Audit')}</cp:lastModifiedBy>
<dcterms:created xsi:type="dcterms:W3CDTF">${tarih.toISOString()}</dcterms:created>
<dcterms:modified xsi:type="dcterms:W3CDTF">${tarih.toISOString()}</dcterms:modified>
</cp:coreProperties>`,
    },
    {
      ad: 'docProps/app.xml',
      veri: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Arac Audit</Application></Properties>`,
    },

// --- GEOMETRİ YARDIMCILARI -------------------------------------------------

const CAM_RENK = '#334155B3';  // yarı saydam: kabin sezilsin ama araç "içi görünür" olmasın
const LASTIK = '#23262B';
const JANT = '#9AA3AE';
const LAMBA_ON = '#E8EEF5';
const LAMBA_ARKA = '#C0392B';
const KARA_PLASTIK = '#3A4049';

function yuz(mesh, noktalar, renk, ustunluk = 0) {
  return { mesh, p: noktalar, renk, ustunluk };
}

/** ustHat üzerinde verilen x için y ve yarı-genişlik oranını lineer bulur. */
function hatUzerinde(ustHat, x) {
  for (let i = 0; i < ustHat.length - 1; i++) {
    const a = ustHat[i]; const b = ustHat[i + 1];
    const [ileri, geri] = a.x >= b.x ? [a, b] : [b, a];
    if (x <= ileri.x && x >= geri.x) {
      const t = ileri.x === geri.x ? 0 : (x - geri.x) / (ileri.x - geri.x);
      return { y: geri.y + (ileri.y - geri.y) * t, z: geri.z + (ileri.z - geri.z) * t };
    }
  }
  const son = x > ustHat[0].x ? ustHat[0] : ustHat[ustHat.length - 1];
  return { y: son.y, z: son.z };
}

/**
 * Verilen x'te yan gövdenin üst kenarı: kapı bölgesinde cam düzlemi (camlar
 * gövdeden bir tık içeride), dışında ise sac panelin bel hattı.
 */
function yanNokta(arac, x) {
  const W = arac.genislik / 2;
  const kapiIcinde = x <= arac.kapiX.onBas && x >= arac.kapiX.arkaSon;
  const hat = hatUzerinde(arac.ustHat, x);
  return kapiIcinde
    ? { y: Math.max(arac.belY, hat.y - 45), z: W * 0.97 }
    : { y: Math.min(hat.y, arac.belY), z: W };
}

/** Silindir (tekerlek) yüzeyleri. */
function tekerlek(meshId, x, r, z, kalinlik, dilim = 16) {
  const yuzler = [];
  // İç yüz HER ZAMAN gövde merkezine doğru gitmeli. İşareti z'den alırsak
  // sağ taraf (z<0) için kalınlık dışa taşar ve tekerlek gövdenin dışında
  // havada durur — 15.09.2026 ekran incelemesinde bu görüldü.
  const dis = z;
  const ic = z - Math.sign(z) * Math.abs(kalinlik);
  const halka = [];
  for (let i = 0; i < dilim; i++) {
    const a = (i / dilim) * Math.PI * 2;
    halka.push([x + Math.cos(a) * r, r + Math.sin(a) * r]);
  }
  // Dış yüz (jant görünümü) — ustunluk VERME: sıralamayı bozup gövdenin
  // üstüne biner. Derinlik doğal sırasına bırakılır.
  yuzler.push(yuz(meshId, halka.map(([px, py]) => [px, py, dis]), JANT));
  // Sırt (lastik bandı)
  for (let i = 0; i < dilim; i++) {
    const [x1, y1] = halka[i]; const [x2, y2] = halka[(i + 1) % dilim];
    yuzler.push(yuz(meshId, [[x1, y1, dis], [x2, y2, dis], [x2, y2, ic], [x1, y1, ic]], LASTIK));
  }
  // Küçük göbek
  const gobek = halka.filter((_, i) => i % 2 === 0).map(([px, py]) => [x + (px - x) * 0.38, r + (py - r) * 0.38, dis + Math.sign(z) * 10]);
  yuzler.push(yuz(meshId, gobek, '#6B7280'));
  return yuzler;
}

function kutu(meshId, [x0, y0, z0], [dx, dy, dz], renk) {
  const x1 = x0 + dx, y1 = y0 + dy, z1 = z0 + dz;
  const k = (a, b, c, d) => yuz(meshId, [a, b, c, d], renk);
  return [
    k([x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]), // üst
    k([x0, y0, z0], [x0, y0, z1], [x1, y0, z1], [x1, y0, z0]), // alt
    k([x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]), // ön
    k([x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]), // arka
    k([x0, y0, z1], [x0, y1, z1], [x1, y1, z1], [x1, y0, z1]), // sol
    k([x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]), // sağ
  ];
}

// --- DIŞ GÖVDE -------------------------------------------------------------

/** Aracın dış yüzeylerini üretir. */
function disGeometri(arac) {
  const { ustHat, belY, esikY, kapiX, renk, genislik, tekerR, dingil } = arac;
  const W = genislik / 2;
  const yuzler = [];

  // 1) ÜST KABUK — silüetin her parçası kendi mesh'i olarak genişliğe yayılır
  // Bir noktanın `parca` alanı, O NOKTADA BİTEN dilimi adlandırır. Yani dilimin
  // adı b.parca'dır, a.parca değil — aksi hâlde ön cam "kaput" diye, arka
  // tampon ise hiç etiketlenmez.
  for (let i = 0; i < ustHat.length - 1; i++) {
    const a = ustHat[i], b = ustHat[i + 1];
    const za = a.z * genislik, zb = b.z * genislik;
    const camMi = b.parca === 'on_cam' || b.parca === 'arka_cam';
    yuzler.push(yuz(b.parca,
      [[a.x, a.y, za], [b.x, b.y, zb], [b.x, b.y, -zb], [a.x, a.y, -za]],
      camMi ? CAM_RENK : renk));

    // OMUZ: üst kabuk gövdeden dardır (tavan 0.42, gövde 0.50 genişlik). Aradaki
    // şeridi doldurmazsak paneller havada yüzer gibi görünür — çamurluk üstü,
    // tavan yağmur oluğu ve bagaj omzu tam olarak bu şerittir.
    if (!camMi) {
      for (const yon of [1, -1]) {
        const ka = yanNokta(arac, a.x), kb = yanNokta(arac, b.x);
        yuzler.push(yuz(b.parca, [
          [a.x, a.y, yon * za], [b.x, b.y, yon * zb],
          [b.x, kb.y, yon * kb.z], [a.x, ka.y, yon * ka.z],
        ], renk));
      }
    }
  }

  // 2) YAN PANELLER — sol (+Z) ve sağ (-Z)
  const yanlar = [['sol', 1], ['sag', -1]];
  const onUc = ustHat[0].x, arkaUc = ustHat[ustHat.length - 1].x;
  const camTabanX = ustHat.find((p) => p.parca === 'on_cam').x;      // ön cam tabanı
  const tavanOnX = ustHat.find((p) => p.parca === 'tavan').x;
  const tavanArka = [...ustHat].reverse().find((p) => p.parca === 'tavan');
  const arkaCamAltX = ustHat.find((p) => p.parca === 'bagaj_kapagi').x;

  for (const [taraf, yon] of yanlar) {
    const zd = yon * W;
    const p = (x, y) => [x, y, zd];

    // Bel hattı altındaki gövde: çamurluk / kapılar / arka çamurluk.
    // DİKKAT: çamurlukları aracın en uç noktasına kadar uzatMA. Uçta silüetin
    // tepesi eşik hizasına iner, panel sivri bir dilime dönüşür ve araç "kar
    // küreği" gibi görünür (15.09.2026 görsel incelemesi). Gövde, tampon
    // başlangıcında biter; tamponun yana sarması ayrı bir yüzeydir.
    const onGovdeX = ustHat[2].x;
    const arkaGovdeX = ustHat[ustHat.length - 2].x;
    // `tarafli: false` olanlar sol/sağ ayrımı OLMAYAN parçalardır: tampon tek
    // parçadır, katalogda "sol_on_tampon" diye bir parça yoktur. Ön ek koyarsak
    // dokunma "bilinmeyen parça" verir.
    const dilimler = [
      ['on_tampon', onUc, onGovdeX, false],
      ['on_camurluk', onGovdeX, kapiX.onBas, true],
      ['on_kapi', kapiX.onBas, kapiX.orta, true],
      ['arka_kapi', kapiX.orta, kapiX.arkaSon, true],
      ['arka_camurluk', kapiX.arkaSon, arkaGovdeX, true],
      ['arka_tampon', arkaGovdeX, arkaUc, false],
    ];
    for (const [ad, xIleri, xGeri, tarafli] of dilimler) {
      const ustIleri = Math.min(hatUzerinde(ustHat, xIleri).y, belY);
      const ustGeri = Math.min(hatUzerinde(ustHat, xGeri).y, belY);
      yuzler.push(yuz(tarafli ? `${taraf}_${ad}` : ad,
        [p(xIleri, esikY), p(xIleri, ustIleri), p(xGeri, ustGeri), p(xGeri, esikY)], renk));
    }

    // Marşpiyel (eşik altı)
    yuzler.push(yuz(`${taraf}_marspiyel`,
      [p(kapiX.onBas + 120, esikY - 150), p(kapiX.onBas + 120, esikY),
       p(kapiX.arkaSon - 120, esikY), p(kapiX.arkaSon - 120, esikY - 150)], KARA_PLASTIK));

    // Bel hattı üstü: A direği / ön cam / B direği / arka cam / C direği
    const zc = zd * 0.97; // camlar gövdeden bir tık içeride
    const pc = (x, y) => [x, y, zc];
    const direkKalin = 150;

    const tavanOnY = hatUzerinde(ustHat, tavanOnX).y;
    const tavanArkaY = tavanArka.y;

    yuzler.push(yuz(`${taraf}_a_diregi`, [
      pc(camTabanX, belY), pc(tavanOnX, tavanOnY),
      pc(tavanOnX - direkKalin, tavanOnY), pc(camTabanX - direkKalin * 1.6, belY)], KARA_PLASTIK));

    yuzler.push(yuz(`${taraf}_on_kapi_cam`, [
      pc(camTabanX - direkKalin * 1.6, belY), pc(tavanOnX - direkKalin, tavanOnY),
      pc(kapiX.orta + direkKalin / 2, hatUzerinde(ustHat, kapiX.orta).y), pc(kapiX.orta + direkKalin / 2, belY)], CAM_RENK));

    yuzler.push(yuz(`${taraf}_b_diregi`, [
      pc(kapiX.orta + direkKalin / 2, belY), pc(kapiX.orta + direkKalin / 2, hatUzerinde(ustHat, kapiX.orta).y),
      pc(kapiX.orta - direkKalin / 2, hatUzerinde(ustHat, kapiX.orta).y), pc(kapiX.orta - direkKalin / 2, belY)], KARA_PLASTIK));

    yuzler.push(yuz(`${taraf}_arka_kapi_cam`, [
      pc(kapiX.orta - direkKalin / 2, belY), pc(kapiX.orta - direkKalin / 2, hatUzerinde(ustHat, kapiX.orta).y),
      pc(tavanArka.x + direkKalin, tavanArkaY), pc(kapiX.arkaSon + direkKalin, belY)], CAM_RENK));

    yuzler.push(yuz(`${taraf}_c_diregi`, [
      pc(kapiX.arkaSon + direkKalin, belY), pc(tavanArka.x + direkKalin, tavanArkaY),
      pc(tavanArka.x - direkKalin, tavanArkaY - 30), pc(arkaCamAltX + 120, belY)], KARA_PLASTIK));

    // Ayna
    const aynaX = camTabanX - 120;
    yuzler.push(...kutu(`${taraf}_ayna`,
      [aynaX, belY + 30, yon > 0 ? zd : zd - 90], [220, 120, 90], KARA_PLASTIK));

    // Tekerlekler
    const onX = dingil / 2, arkaX = -dingil / 2;
    yuzler.push(...tekerlek(`${taraf}_jant_on`, onX, tekerR, yon > 0 ? W - 10 : -W + 10, yon > 0 ? 190 : -190));
    yuzler.push(...tekerlek(`${taraf}_jant_arka`, arkaX, tekerR, yon > 0 ? W - 10 : -W + 10, yon > 0 ? 190 : -190));

    // Farlar ve stoplar
    const farX = ustHat[2].x - 30;
    yuzler.push(yuz(`${taraf}_far`, [
      [farX + 40, 820, yon * W * 0.86], [farX + 40, 960, yon * W * 0.86],
      [farX - 150, 985, yon * W * 0.55], [farX - 150, 845, yon * W * 0.55]], LAMBA_ON, 1));
    const stopX = arkaCamAltX - 60;
    yuzler.push(yuz(`${taraf}_stop`, [
      [stopX + 60, belY - 90, yon * W * 0.9], [stopX + 60, belY + 60, yon * W * 0.9],
      [stopX - 140, belY + 40, yon * W * 0.62], [stopX - 140, belY - 110, yon * W * 0.62]], LAMBA_ARKA, 1));
  }

  // 3) IZGARA — ön yüze bindirilmiş panel
  const izgara = ustHat[1];
  yuzler.push(yuz('on_izgara', [
    [izgara.x + 25, 760, W * 0.38], [izgara.x + 25, 960, W * 0.38],
    [izgara.x + 25, 960, -W * 0.38], [izgara.x + 25, 760, -W * 0.38]], '#2B3038', 1));

  return yuzler;
}

// --- İÇ MEKÂN --------------------------------------------------------------

/** Kabin içi şematik: IP, konsol, direksiyon, koltuklar, kapı döşemeleri, garnişler. */
function icGeometri(arac) {
  const { genislik, belY, esikY, kapiX, ustHat } = arac;
  const W = genislik / 2 - 60;
  const yuzler = [];
  const camTabanX = ustHat.find((p) => p.parca === 'on_cam').x;
  const tabanY = esikY + 40;

  // İç mekân paleti: hepsi koyu griyse ekranda tek bir kütle görünür ve
  // denetçi parçayı ayırt edemez. Garnişler bilerek AÇIK tondadır — en sık
  // hata alan bölgelerden biri onlar.
  // Taban
  yuzler.push(yuz('ayak_bolge', [
    [camTabanX, tabanY, W], [kapiX.arkaSon - 300, tabanY, W],
    [kapiX.arkaSon - 300, tabanY, -W], [camTabanX, tabanY, -W]], '#3B424C'));

  // Gösterge paneli (IP)
  yuzler.push(...kutu('ic_ip', [camTabanX - 40, belY - 180, -W], [420, 200, W * 2], '#6E7783'));
  yuzler.push(yuz('ic_gosterge', [
    [camTabanX - 50, belY - 20, W * 0.62], [camTabanX - 50, belY + 90, W * 0.62],
    [camTabanX - 50, belY + 90, W * 0.18], [camTabanX - 50, belY - 20, W * 0.18]], '#12161C', 1));
  yuzler.push(yuz('ic_ekran', [
    [camTabanX - 60, belY - 20, W * 0.12], [camTabanX - 60, belY + 95, W * 0.12],
    [camTabanX - 60, belY + 95, -W * 0.42], [camTabanX - 60, belY - 20, -W * 0.42]], '#0B1220', 1));

  // Direksiyon (basit halka)
  const dHalka = [];
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    dHalka.push([camTabanX - 330 + Math.sin(a) * 40, belY + 20 + Math.cos(a) * 170, W * 0.42 + Math.sin(a) * 170]);
  }
  yuzler.push(yuz('ic_direksiyon', dHalka, '#20252C', 2));

  // Orta konsol
  yuzler.push(...kutu('ic_konsol', [camTabanX - 900, tabanY, -W * 0.22], [900, 320, W * 0.44], '#5A626D'));

  // Koltuklar
  const koltuk = (mesh, x, z) => {
    yuzler.push(...kutu(mesh, [x - 260, tabanY, z - 260], [520, 140, 520], '#8892A0'));      // oturma
    yuzler.push(...kutu(mesh, [x - 300, tabanY + 140, z - 250], [180, 620, 500], '#8892A0')); // sırtlık
    yuzler.push(...kutu(mesh, [x - 280, tabanY + 790, z - 160], [130, 230, 320], '#6B7482')); // başlık
  };
  koltuk('koltuk_sol_on', camTabanX - 800, W * 0.5);
  koltuk('koltuk_sag_on', camTabanX - 800, -W * 0.5);
  yuzler.push(...kutu('koltuk_arka', [kapiX.arkaSon + 120, tabanY, -W * 0.92], [520, 140, W * 1.84], '#8892A0'));
  yuzler.push(...kutu('koltuk_arka', [kapiX.arkaSon + 80, tabanY + 140, -W * 0.92], [180, 620, W * 1.84], '#8892A0'));

  // Bagaj
  yuzler.push(...kutu('ic_bagaj', [kapiX.arkaSon - 900, tabanY, -W * 0.9], [900, 60, W * 1.8], '#4C535D'));

  // Kapı döşemeleri + garnişler (sol/sağ)
  for (const [taraf, yon] of [['sol', 1], ['sag', -1]]) {
    const zd = yon * W;
    const p = (x, y) => [x, y, zd];
    yuzler.push(yuz(`${taraf}_on_kapi_doseme`, [
      p(kapiX.onBas, tabanY), p(kapiX.onBas, belY + 60), p(kapiX.orta, belY + 60), p(kapiX.orta, tabanY)], '#646D79'));
    yuzler.push(yuz(`${taraf}_arka_kapi_doseme`, [
      p(kapiX.orta, tabanY), p(kapiX.orta, belY + 60), p(kapiX.arkaSon, belY + 60), p(kapiX.arkaSon, tabanY)], '#646D79'));

    const tavanOnX = ustHat.find((q) => q.parca === 'tavan').x;
    const tavanArka = [...ustHat].reverse().find((q) => q.parca === 'tavan');
    yuzler.push(yuz(`${taraf}_a_garnis`, [
      p(camTabanX, belY + 60), p(tavanOnX, hatUzerinde(ustHat, tavanOnX).y - 40),
      p(tavanOnX - 140, hatUzerinde(ustHat, tavanOnX).y - 40), p(camTabanX - 200, belY + 60)], '#B9C2CE', 1));
    yuzler.push(yuz(`${taraf}_b_garnis`, [
      p(kapiX.orta + 80, belY + 60), p(kapiX.orta + 80, hatUzerinde(ustHat, kapiX.orta).y - 40),
      p(kapiX.orta - 80, hatUzerinde(ustHat, kapiX.orta).y - 40), p(kapiX.orta - 80, belY + 60)], '#B9C2CE', 1));
    yuzler.push(yuz(`${taraf}_c_garnis`, [
      p(kapiX.arkaSon + 140, belY + 60), p(tavanArka.x + 140, tavanArka.y - 40),
      p(tavanArka.x - 60, tavanArka.y - 60), p(kapiX.arkaSon - 60, belY + 60)], '#B9C2CE', 1));
  }

  // Tavan döşemesi (yukarıdan bakınca kabin kapanmasın diye yarı saydam)
  const tavanOnX = ustHat.find((q) => q.parca === 'tavan').x;
  const tavanArka = [...ustHat].reverse().find((q) => q.parca === 'tavan');
  yuzler.push(yuz('ic_tavan_doseme', [
    [tavanOnX, tavanArka.y - 60, W * 0.92], [tavanArka.x, tavanArka.y - 60, W * 0.92],
    [tavanArka.x, tavanArka.y - 60, -W * 0.92], [tavanOnX, tavanArka.y - 60, -W * 0.92]], '#9AA3AE33'));

  return yuzler;
}

// --- OYUNCU (RENDERER) -----------------------------------------------------

function cikar(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function capraz(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function normalize(v) {
  const u = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / u, v[1] / u, v[2] / u];
}
function nokta(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

/** Rengi belirli oranda karartıp/açarak gölgeleme uygular. */
function golgele(hex, carpan) {
  const t = hex.length >= 9 ? hex.slice(7) : '';
  const s = hex.slice(1, 7);
  const n = parseInt(s, 16);
  const k = (v) => Math.max(0, Math.min(255, Math.round(v * carpan)));
  const r = k((n >> 16) & 255), g = k((n >> 8) & 255), b = k(n & 255);
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}${t}`;
}

class ModelGoruntuleyici {
  /**
   * @param {HTMLCanvasElement} tuval
   * @param {{ dokunuldu?:(mesh:string)=>void }} [secenekler]
   */
  constructor(tuval, secenekler = {}) {
    this.tuval = tuval;
    this.ctx = tuval.getContext('2d');
    this.secenekler = secenekler;
    this.yuzler = [];
    this.vurgular = new Map();  // meshId -> renk
    this.secili = null;
    this.yaw = -0.7; this.pitch = 0.42; this.uzaklik = 9200;
    this.merkez = [0, 750, 0];
    this.sonCizim = [];
    this._olaylariBagla();
  }

  yukle(yuzler) { this.yuzler = yuzler; this.ciz(); }
  vurgula(harita) { this.vurgular = harita; this.ciz(); }
  sec(mesh) { this.secili = mesh; this.ciz(); }

  aciAyarla(yaw, pitch) {
    this.yaw = yaw;
    this.pitch = Math.max(-0.25, Math.min(1.35, pitch));
    this.ciz();
  }

  /** Hazır bakış açıları — denetçi "sol yan"a tek dokunuşla geçsin. */
  bakis(ad) {
    const acilar = {
      // +x aracın ÖNÜ. Kamera yaw=0'da +x tarafında durur, yani ÖNDEN bakar.
      // (15.09.2026: ikisi terstiydi, "Ön" düğmesi stop lambalarını gösteriyordu.)
      on: [0, 0.25], arka: [Math.PI, 0.25],
      // +z aracın SOL tarafı. Sol yanı görmek için kamera +z'de, yani yaw=+π/2.
      // (15.09.2026: ölçümde "Sol" düğmesi sağ arka kapıyı öne getiriyordu.)
      sol: [Math.PI / 2, 0.18], sag: [-Math.PI / 2, 0.18],
      ust: [-0.7, 1.3], serbest: [-0.7, 0.42],
      // Kabine yukarıdan-önden bakış: koltuklar, konsol ve garnişler bir arada görünür
      kabin: [-1.15, 0.72],
    };
    const a = acilar[ad] ?? acilar.serbest;
    this.aciAyarla(a[0], a[1]);
  }

  _kameraKonumu() {
    const cy = Math.cos(this.pitch), sy = Math.sin(this.pitch);
    return [
      this.merkez[0] + this.uzaklik * cy * Math.cos(this.yaw),
      this.merkez[1] + this.uzaklik * sy,
      this.merkez[2] + this.uzaklik * cy * Math.sin(this.yaw),
    ];
  }

  _izdusum() {
    const g = this.tuval.width, b = this.tuval.height;
    const goz = this._kameraKonumu();
    const ileri = normalize(cikar(this.merkez, goz));
    const sag = normalize(capraz(ileri, [0, 1, 0]));
    const yukari = capraz(sag, ileri);
    const odak = Math.min(g, b) * 1.15;
    return (p) => {
      const d = cikar(p, goz);
      const z = nokta(d, ileri);
      if (z <= 1) return null;
      const k = odak / z * (this.uzaklik / 4200);
      return [g / 2 + nokta(d, sag) * k, b / 2 - nokta(d, yukari) * k, z];
    };
  }

  ciz() {
    const { ctx, tuval } = this;
    const g = tuval.width, b = tuval.height;
    ctx.clearRect(0, 0, g, b);

    const izd = this._izdusum();
    const isik = normalize([0.35, 0.86, 0.36]);
    const hazir = [];

    for (const f of this.yuzler) {
      const ekran = [];
      let derinlik = 0; let gecerli = true;
      for (const p of f.p) {
        const e = izd(p);
        if (!e) { gecerli = false; break; }
        ekran.push(e); derinlik += e[2];
      }
      if (!gecerli || ekran.length < 3) continue;
      derinlik /= ekran.length;

      const n = normalize(capraz(cikar(f.p[1], f.p[0]), cikar(f.p[2], f.p[0])));
      const isikMiktar = 0.52 + 0.48 * Math.abs(nokta(n, isik));

      let renk = this.vurgular.get(f.mesh) ?? f.renk;
      const seciliMi = this.secili === f.mesh;
      if (seciliMi) renk = '#2563EB';
      // ustunluk, eş düzlemli bindirmeleri (far, ızgara, jant göbeği) bir tık
      // öne almak içindir. Ölçek büyük olursa parça aracın ÖBÜR ucundaki
      // yüzeyleri de yener; ön bakışta çatının üstünde stop lambası görünür
      // (15.09.2026'da tam bu oldu). 45 birim eş düzlemi ayırmaya yeter.
      hazir.push({ f, ekran, derinlik: derinlik - (f.ustunluk ?? 0) * 45, renk: golgele(renk, isikMiktar), seciliMi });
    }

    hazir.sort((a, c) => c.derinlik - a.derinlik);
    this.sonCizim = hazir;

    for (const h of hazir) {
      ctx.beginPath();
      ctx.moveTo(h.ekran[0][0], h.ekran[0][1]);
      for (let i = 1; i < h.ekran.length; i++) ctx.lineTo(h.ekran[i][0], h.ekran[i][1]);
      ctx.closePath();
      ctx.fillStyle = h.renk;
      ctx.fill();
      ctx.strokeStyle = h.seciliMi ? '#FFFFFF' : 'rgba(15,23,42,0.30)';
      ctx.lineWidth = h.seciliMi ? 2.5 : 0.7;
      ctx.stroke();
    }
  }

  /** Ekran noktasının hangi parçaya denk geldiğini bulur (en öndeki kazanır). */
  isabet(ekranX, ekranY) {
    for (let i = this.sonCizim.length - 1; i >= 0; i--) {
      const h = this.sonCizim[i];
      if (noktaCokgende(ekranX, ekranY, h.ekran)) return h.f.mesh;
    }
    return null;
  }

  _olaylariBagla() {
    const t = this.tuval;
    let suruklu = false, sonX = 0, sonY = 0, hareket = 0, sonMesafe = 0;

    const basla = (e) => {
      const d = e.touches ? e.touches[0] : e;
      suruklu = true; hareket = 0; sonX = d.clientX; sonY = d.clientY;
    };
    const oynat = (e) => {
      if (e.touches?.length === 2) {
        const [a, b] = e.touches;
        const m = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (sonMesafe) this.uzaklik = Math.max(4200, Math.min(18000, this.uzaklik * (sonMesafe / m)));
        sonMesafe = m; this.ciz(); e.preventDefault(); return;
      }
      if (!suruklu) return;
      const d = e.touches ? e.touches[0] : e;
      const dx = d.clientX - sonX, dy = d.clientY - sonY;
      hareket += Math.abs(dx) + Math.abs(dy);
      sonX = d.clientX; sonY = d.clientY;
      this.aciAyarla(this.yaw + dx * 0.008, this.pitch + dy * 0.006);
      e.preventDefault();
    };
    const bitir = (e) => {
      sonMesafe = 0;
      if (suruklu && hareket < 8) {
        const d = e.changedTouches ? e.changedTouches[0] : e;
        const k = t.getBoundingClientRect();
        const olcek = t.width / k.width;
        const mesh = this.isabet((d.clientX - k.left) * olcek, (d.clientY - k.top) * olcek);
        if (mesh) this.secenekler.dokunuldu?.(mesh);
      }
      suruklu = false;
    };

    t.addEventListener('pointerdown', basla);
    t.addEventListener('pointermove', oynat);
    t.addEventListener('pointerup', bitir);
    t.addEventListener('pointercancel', () => { suruklu = false; });
    t.addEventListener('touchmove', oynat, { passive: false });
    t.addEventListener('wheel', (e) => {
      this.uzaklik = Math.max(4200, Math.min(18000, this.uzaklik * (e.deltaY > 0 ? 1.1 : 0.9)));
      this.ciz(); e.preventDefault();
    }, { passive: false });
  }
}

/** Işın atma yerine ekran düzleminde nokta-çokgen testi (ray casting). */
function noktaCokgende(x, y, kose) {
  let icinde = false;
  for (let i = 0, j = kose.length - 1; i < kose.length; j = i++) {
    const [xi, yi] = kose[i], [xj, yj] = kose[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi + 1e-9) + xi) icinde = !icinde;
  }
  return icinde;
}

/** Geometriyi moda göre üretir. */
function geometriUret(aracId, mod = 'dis') {
  const arac = ARAC_INDEKS[aracId];
  if (!arac) return [];
  return mod === 'ic' ? icGeometri(arac) : disGeometri(arac);
}


/* ===== puan.js ===== */
// PUANLAMA VE ÖZET
//
// DÜRÜSTLÜK NOTU: buradaki ceza puanı (demerit) ağırlıkları ve karar eşikleri
// ÖRNEK BAŞLANGIÇ DEĞERLERİDİR — hiçbir üreticinin resmî audit standardından
// ölçülmemiştir. `ayarlar.esikler` ile değiştirilebilir. Kendi standardınızın
// sayılarını girene kadar bu puanı yalnızca kendi denetimlerinizi birbiriyle
// kıyaslamak için kullanın; mutlak bir kalite ölçütü gibi raporlamayın.


const SIDDET_INDEKS = Object.fromEntries(SIDDETLER.map((s) => [s.id, s]));

/** Varsayılan karar eşikleri — ayarlardan değiştirilebilir. */
const VARSAYILAN_ESIKLER = {
  kritikVarsaRed: true,   // tek bir A sınıfı hata bile aracı durdurur
  sartliPuan: 15,         // bu puanın üstü "şartlı kabul"
  redPuan: 40,            // bu puanın üstü "red"
};

/** Tek bir hatanın ceza puanı. */
function hataPuani(hata) {
  const s = SIDDET_INDEKS[hata.siddet];
  return (s?.puan ?? 0) * (hata.adet ?? 1);
}

/** Hatanın makine okunur kodu — Excel'de pivot/filtre için sabit anahtar. */
function hataKodu(hata) {
  return `${hata.parcaId}.${hata.hataTipiId}`;
}

/** Hatanın insan okunur tam adı: "Dış · Sol yan / Arka kapı / Gıcırtı" */
function hataAdi(hata, dil = 'tr') {
  const p = PARCA_INDEKS[hata.parcaId];
  const h = HATA_TIPI_INDEKS[hata.hataTipiId];
  if (dil === 'en') {
    return `${p?.bolgeEn ?? '?'} / ${p?.en ?? hata.parcaId} / ${h?.en ?? hata.hataTipiId}`;
  }
  return `${p?.bolgeAd ?? '?'} / ${p?.ad ?? hata.parcaId} / ${h?.ad ?? hata.hataTipiId}`;
}

/**
 * Denetimin tam özeti.
 * @param {{hatalar:any[]}} denetim
 * @param {object} [esikler]
 */
function denetimOzeti(denetim, esikler = VARSAYILAN_ESIKLER) {
  const hatalar = denetim?.hatalar ?? [];

  const siddetDagilimi = Object.fromEntries(SIDDETLER.map((s) => [s.id, { adet: 0, puan: 0 }]));
  const bolgeler = new Map();
  const parcalar = new Map();
  const gruplar = new Map();

  let toplamAdet = 0, toplamPuan = 0, fotografli = 0;

  for (const h of hatalar) {
    const adet = h.adet ?? 1;
    const puan = hataPuani(h);
    toplamAdet += adet;
    toplamPuan += puan;
    if ((h.fotograflar?.length ?? 0) > 0) fotografli += 1;

    if (siddetDagilimi[h.siddet]) {
      siddetDagilimi[h.siddet].adet += adet;
      siddetDagilimi[h.siddet].puan += puan;
    }

    const p = PARCA_INDEKS[h.parcaId];
    const bKey = p?.bolgeId ?? 'bilinmeyen';
    const b = bolgeler.get(bKey) ?? { id: bKey, ad: p?.bolgeAd ?? 'Bilinmeyen', adet: 0, puan: 0 };
    b.adet += adet; b.puan += puan; bolgeler.set(bKey, b);

    const pKey = h.parcaId;
    const pk = parcalar.get(pKey) ?? { id: pKey, ad: p?.ad ?? pKey, bolgeAd: p?.bolgeAd ?? '', adet: 0, puan: 0 };
    pk.adet += adet; pk.puan += puan; parcalar.set(pKey, pk);

    const grupId = HATA_TIPI_INDEKS[h.hataTipiId]?.grup ?? 'bilinmeyen';
    const gk = gruplar.get(grupId) ?? { id: grupId, adet: 0, puan: 0 };
    gk.adet += adet; gk.puan += puan; gruplar.set(grupId, gk);
  }

  const sirala = (m) => [...m.values()].sort((a, b) => b.puan - a.puan || b.adet - a.adet);

  return {
    toplamHata: hatalar.length,
    toplamAdet,
    toplamPuan,
    fotografliHata: fotografli,
    fotografsizHata: hatalar.length - fotografli,
    siddetDagilimi,
    bolgeDagilimi: sirala(bolgeler),
    parcaDagilimi: sirala(parcalar),
    grupDagilimi: sirala(gruplar),
    sonuc: sonucBelirle({ toplamPuan, siddetDagilimi }, esikler),
  };
}

/**
 * Karar: KABUL / ŞARTLI / RED.
 * Eşikler ayarlanabilir; varsayılanlar örnektir, standart değildir.
 */
function sonucBelirle({ toplamPuan, siddetDagilimi }, esikler = VARSAYILAN_ESIKLER) {
  const kritik = siddetDagilimi?.A?.adet ?? 0;
  if (esikler.kritikVarsaRed && kritik > 0) {
    return { kod: 'RED', ad: 'RED', en: 'REJECT', gerekce: `${kritik} adet kritik (A) hata bulundu.` };
  }
  if (toplamPuan >= esikler.redPuan) {
    return { kod: 'RED', ad: 'RED', en: 'REJECT', gerekce: `Toplam ceza puanı ${toplamPuan}, red eşiği ${esikler.redPuan}.` };
  }
  if (toplamPuan >= esikler.sartliPuan) {
    return { kod: 'SARTLI', ad: 'ŞARTLI KABUL', en: 'CONDITIONAL', gerekce: `Toplam ceza puanı ${toplamPuan}, şartlı eşiği ${esikler.sartliPuan}.` };
  }
  return { kod: 'KABUL', ad: 'KABUL', en: 'ACCEPT', gerekce: `Toplam ceza puanı ${toplamPuan}, şartlı eşiğin (${esikler.sartliPuan}) altında.` };
}

/** Birden çok denetimin toplu özeti — vardiya/hat raporu için. */
function topluOzet(denetimler, esikler = VARSAYILAN_ESIKLER) {
  const ozetler = denetimler.map((d) => ({ denetim: d, ozet: denetimOzeti(d, esikler) }));
  const aracSayisi = ozetler.length || 1;
  const toplamAdet = ozetler.reduce((t, o) => t + o.ozet.toplamAdet, 0);
  const toplamPuan = ozetler.reduce((t, o) => t + o.ozet.toplamPuan, 0);

  const parcaTop = new Map();
  for (const { ozet } of ozetler) {
    for (const p of ozet.parcaDagilimi) {
      const k = parcaTop.get(p.id) ?? { ...p, adet: 0, puan: 0, aracSayisi: 0 };
      k.adet += p.adet; k.puan += p.puan; k.aracSayisi += 1;
      parcaTop.set(p.id, k);
    }
  }

  return {
    aracSayisi: ozetler.length,
    toplamAdet,
    toplamPuan,
    // DPU = Defects Per Unit — araç başına düşen hata adedi
    dpu: Math.round((toplamAdet / aracSayisi) * 100) / 100,
    aracBasiPuan: Math.round((toplamPuan / aracSayisi) * 100) / 100,
    sonucDagilimi: ozetler.reduce((a, o) => {
      a[o.ozet.sonuc.kod] = (a[o.ozet.sonuc.kod] ?? 0) + 1; return a;
    }, {}),
    enSikParcalar: [...parcaTop.values()].sort((a, b) => b.adet - a.adet).slice(0, 20),
    ozetler,
  };
}
