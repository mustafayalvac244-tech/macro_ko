<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0B1830" />
    <meta name="description" content="Vekil Pro — avukatlar için dava, duruşma, süre ve tahsilat takibi." />
    <title>Vekil Pro</title>

    <!--
      NEDEN BU DOSYA VAR
      ------------------------------------------------------------------
      Expo'nun varsayılan şablonunda gövde BOMBOŞ: tarayıcı JS paketini
      indirip ayrıştırana kadar kullanıcı BEYAZ EKRAN görür. Ölçüm
      (2026-09-10, GitHub Pages): paket gzip 1.169.865 bayt. Bu perde o
      bekleyişi GÖRÜNÜR yapar — paketi KÜÇÜLTMEZ, indirmeyi HIZLANDIRMAZ;
      yalnız "donmuş/bozuk" izlenimini kaldırır.

      NEDEN app/+html.tsx DEĞİL: +html.tsx yalnız STATİK RENDER'da
      (web.output: "static") kullanılıyor. Bu proje varsayılan "single"
      (SPA) kipinde; o kipte Expo, public/index.html varsa ONU şablon
      alıyor (kaynak: @expo/cli .../start/server/webTemplate.js →
      getTemplateIndexHtmlAsync). Ölçülerek doğrulandı: +html.tsx ile
      dışa aktarımda üretilen index.html değişmedi.

      %LANG_ISO_CODE% ve %WEB_TITLE% yer tutucularını Expo doldurur;
      <script> etiketi ile favicon bağlantısını da dışa aktarım ekler —
      bu yüzden burada elle YAZILMAZ.
    -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <style id="vekil-perde-stil">
      #vekil-onyukleme {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b1830;
        color: #e8edf6;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        transition: opacity 260ms ease;
      }
      #vekil-onyukleme.gizle {
        opacity: 0;
        pointer-events: none;
      }
      #vekil-onyukleme .marka {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 6px;
        color: #c9a24b;
      }
      #vekil-onyukleme .alt {
        font-size: 13px;
        opacity: 0.72;
      }
      #vekil-onyukleme .cubuk {
        width: 190px;
        height: 3px;
        border-radius: 2px;
        background: rgba(232, 237, 246, 0.14);
        overflow: hidden;
      }
      #vekil-onyukleme .cubuk i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #c9a24b;
        animation: vekil-kay 1.15s ease-in-out infinite;
      }
      @keyframes vekil-kay {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(255%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #vekil-onyukleme .cubuk i {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
      #vekil-onyukleme .hata {
        max-width: 460px;
        padding: 0 24px;
        font-size: 12px;
        line-height: 1.5;
        color: #f2b8b5;
        text-align: center;
        white-space: pre-wrap;
      }
    </style>
  <link rel="icon" href="/app/favicon.ico"/></head>

  <body>
    <noscript> Bu uygulamayı çalıştırmak için JavaScript'i etkinleştirmelisiniz. </noscript>

    <!-- Açılış perdesi: React kök elemana ilk çocuğunu basınca kaldırılır. -->
    <div id="vekil-onyukleme">
      <div class="marka">VEKİL PRO</div>
      <div class="cubuk"><i></i></div>
      <div class="alt">Uygulama yükleniyor…</div>
      <div class="hata"></div>
    </div>

    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <script>
      (function () {
        var perde = document.getElementById('vekil-onyukleme');
        var kok = document.getElementById('root');
        if (!perde || !kok) return;
        var kalkti = false;

        function kaldir() {
          if (kalkti) return;
          kalkti = true;
          perde.className = 'gizle';
          setTimeout(function () {
            if (perde.parentNode) perde.parentNode.removeChild(perde);
          }, 300);
        }

        if (kok.firstChild) {
          kaldir();
        } else {
          var gozcu = new MutationObserver(function () {
            if (kok.firstChild) {
              gozcu.disconnect();
              kaldir();
            }
          });
          gozcu.observe(kok, { childList: true });
        }

        // Yavaş bağlantıda "takıldı mı?" hissini önle.
        setTimeout(function () {
          if (kalkti) return;
          var alt = perde.querySelector('.alt');
          if (alt) alt.textContent = 'Bağlantınız yavaş olabilir — yükleme sürüyor…';
        }, 12000);

        // Paket hiç çalışmazsa kullanıcı sonsuza kadar dönen çubuğa bakmasın.
        window.addEventListener('error', function (e) {
          if (kalkti) return;
          var kutu = perde.querySelector('.hata');
          if (kutu) kutu.textContent = 'Uygulama yüklenemedi: ' + ((e && e.message) || 'bilinmeyen hata');
        });
      })();
    </script>
  <script src="/app/_expo/static/js/web/entry-18f9f38e2eaa6c20c463e72c5bdc6421.js" defer></script>
</body>
</html>
