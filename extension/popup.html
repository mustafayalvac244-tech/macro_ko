<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<main id="kok">
  <header><span class="marka">Vekil Pro</span></header>

  <section id="giris" hidden>
    <p class="aciklama">Vekil Pro hesabınızla giriş yapın.</p>
    <input id="email" type="email" placeholder="E-posta" autocomplete="username" />
    <input id="sifre" type="password" placeholder="Şifre" autocomplete="current-password" />
    <button id="girisBtn" class="birincil">Giriş Yap</button>
    <p class="ipucu">Şifreniz cihazınızda saklanmaz; yalnız oturum jetonu tutulur.</p>
  </section>

  <section id="calisma" hidden>
    <p class="aciklama">Açık sayfadaki dava bilgilerini okuyup dosya açar.</p>
    <button id="okuBtn" class="birincil">Bu sayfadan dosya aç</button>
    <div id="onizleme" hidden>
      <p class="baslik">Bulunanlar — kaydetmeden önce kontrol edin</p>
      <div id="alanlar"></div>
      <button id="kaydetBtn" class="birincil">Dosyayı oluştur</button>
      <button id="vazgecBtn" class="ikincil">Vazgeç</button>
    </div>
    <button id="cikisBtn" class="baglanti">Çıkış</button>
  </section>

  <p id="durum" role="status"></p>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
