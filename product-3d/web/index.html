<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>mioren — 3D Ürün Görüntüleyici</title>
<style>
  :root{
    --gold:#c9a24b; --panel:rgba(22,28,25,.60); --stroke:rgba(201,162,75,.32);
    --txt:#e7e2d4; --muted:#9fb0a5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent}
  /* studio backdrop (seamless sweep) — swapped for dark mode */
  #app{position:fixed;inset:0;
    background:radial-gradient(120% 100% at 50% 32%, #eef0ee 0%, #d3d7d2 46%, #b4bab4 100%)}
  body.dark #app{
    background:radial-gradient(120% 100% at 50% 30%, #223129 0%, #16201b 52%, #0c1210 100%)}
  canvas{display:block;touch-action:none}
  /* photographic vignette */
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 115% at 50% 42%, rgba(0,0,0,0) 58%, rgba(0,0,0,.16) 100%)}
  body.dark #vig{background:radial-gradient(130% 115% at 50% 42%, rgba(0,0,0,0) 52%, rgba(0,0,0,.42) 100%)}

  .brand{position:absolute;top:20px;left:0;right:0;text-align:center;pointer-events:none;
    color:#20302a;letter-spacing:.4em;font-size:14px;font-weight:600;text-transform:uppercase}
  .brand small{display:block;letter-spacing:.16em;font-size:10px;font-weight:400;
    color:#5a6b60;margin-top:5px;text-transform:none}
  body.dark .brand{color:#e7e2d4} body.dark .brand small{color:#9fb0a5}

  .toolbar{position:absolute;top:14px;right:14px;display:flex;gap:8px}
  .seg{position:absolute;left:50%;transform:translateX(-50%);bottom:74px;
    display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:94vw}
  .controls{position:absolute;left:0;right:0;bottom:18px;display:flex;gap:9px;
    justify-content:center;align-items:center;flex-wrap:wrap;padding:0 12px}

  .btn{appearance:none;border:1px solid var(--stroke);background:var(--panel);
    color:var(--txt);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    padding:9px 14px;border-radius:999px;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.16s;white-space:nowrap}
  .btn:hover{border-color:var(--gold);color:#fff;background:rgba(30,42,34,.8)}
  .btn:active{transform:translateY(1px)}
  .btn.on{border-color:var(--gold);color:#1a130a;background:var(--gold)}
  .btn.icon{padding:9px 11px}
  .chip{font-size:12px;padding:7px 12px}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.75}

  .loader{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;
    align-items:center;justify-content:center;z-index:9;transition:opacity .5s;
    background:radial-gradient(120% 100% at 50% 32%, #eef0ee 0%, #c9cdc9 100%)}
  body.dark .loader{background:radial-gradient(120% 100% at 50% 30%, #223129 0%, #10181300 100%),#151d18}
  .loader.hide{opacity:0;pointer-events:none}
  .ring{width:46px;height:46px;border-radius:50%;border:3px solid rgba(0,0,0,.15);
    border-top-color:var(--gold);animation:spin 1s linear infinite}
  body.dark .ring{border-color:rgba(255,255,255,.12);border-top-color:var(--gold)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bar{width:190px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);overflow:hidden}
  body.dark .bar{background:rgba(255,255,255,.14)}
  .bar>i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
  .lbl{color:#5a6b60;font-size:12px;letter-spacing:.12em}
  body.dark .lbl{color:#9fb0a5}
  .err{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;align-items:center;
    justify-content:center;z-index:10;background:#c9cdc9;color:#7a2a2a;text-align:center;padding:24px}
  body.dark .err{background:#151d18;color:#e6b6b6}
</style>
</head>
<body>
<div id="app">
  <div id="vig"></div>
  <div class="brand">mioren<small>Yeşim Taşı Kontur Fırçası · 360° Görünüm</small></div>

  <div class="toolbar">
    <button class="btn icon" id="bgBtn" title="Arka plan">◑</button>
    <button class="btn icon" id="fsBtn" title="Tam ekran">⛶</button>
  </div>

  <div class="seg">
    <button class="btn chip" data-view="front">Ön</button>
    <button class="btn chip" data-view="back">Arka</button>
    <button class="btn chip" data-view="left">Sol</button>
    <button class="btn chip" data-view="right">Sağ</button>
    <button class="btn chip" data-view="top">Üst</button>
    <button class="btn chip" data-view="three_quarter">3/4</button>
  </div>

  <div class="controls">
    <button class="btn on" id="spinBtn"><span class="dot"></span>Otomatik Döndür</button>
    <button class="btn" id="resetBtn">Görünümü Sıfırla</button>
  </div>

  <div class="loader" id="loader">
    <div class="ring"></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="lbl" id="loadLbl">MODEL YÜKLENİYOR…</div>
  </div>
  <div class="err" id="err">
    <div style="font-size:15px">Model yüklenemedi.</div>
    <div class="lbl" id="errMsg"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODEL_URL = './mioren_brusher.glb';
const HDRI_URL = './studio.hdr';
const $ = (id) => document.getElementById(id);
const app = $('app'), loader = $('loader'), barFill = $('barFill');
const loadLbl = $('loadLbl'), errEl = $('err'), errMsg = $('errMsg');
let bgDark = false;

// ---------- renderer (transparent so the CSS studio sweep shows) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);

// ---------- environment: real studio HDRI (fallback: RoomEnvironment) ----
new RGBELoader().load(HDRI_URL, (hdr) => {
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = pmrem.fromEquirectangular(hdr).texture;
  hdr.dispose();
}, undefined, () => {
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
});

// ---------- camera ~85mm ----------
const camera = new THREE.PerspectiveCamera(20, innerWidth / innerHeight, 0.001, 100);

// ---------- 3-point lights + fibre backlight ----------
const key = new THREE.DirectionalLight(0xfff2df, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.00018; key.shadow.normalBias = 0.4;
key.shadow.radius = 7;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xcdd9de, 0.75); scene.add(fill, fill.target);
const rim  = new THREE.DirectionalLight(0xffffff, 2.0); scene.add(rim, rim.target);
const backlight = new THREE.DirectionalLight(0xffd9a8, 1.3); scene.add(backlight, backlight.target); // glows fibre tips
scene.add(new THREE.AmbientLight(0xffffff, 0.10));

// ---------- ground: real soft shadow + faint AO contact blob ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.30 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

function makeBlob() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  rg.addColorStop(0, 'rgba(0,0,0,0.42)'); rg.addColorStop(0.5, 'rgba(0,0,0,0.18)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.beginPath(); g.ellipse(128, 128, 128, 96, 0, 0, 7); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const blob = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: makeBlob(), transparent: true, depthWrite: false }));
blob.rotation.x = -Math.PI / 2; scene.add(blob);

// ---------- controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.9; controls.autoRotate = true; controls.autoRotateSpeed = 1.0;

// ---------- load model ----------
const draco = new DRACOLoader(); draco.setDecoderPath('./vendor/jsm/libs/draco/');
const gltfLoader = new GLTFLoader(); gltfLoader.setDRACOLoader(draco);
let model, radius = 1, center = new THREE.Vector3();

gltfLoader.load(MODEL_URL, (gltf) => {
  model = gltf.scene;
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const m = o.material; if (!m) return;
    if (m.name && /fiber/i.test(m.name)) {
      // hair: matte, double-sided, translucent-ish tips
      m.side = THREE.DoubleSide; m.shadowSide = THREE.DoubleSide;
      m.roughness = 0.9; m.metalness = 0.0; m.envMapIntensity = 0.12;
      if ('sheen' in m) { m.sheen = 0.5; m.sheenRoughness = 0.8;
        m.sheenColor = new THREE.Color(0xffcf9a); }
    } else if (m.name && /serpentine/i.test(m.name)) {
      // polished stone -> upgrade to physical with clearcoat
      o.material = toPhysicalStone(m);
    } else {
      m.envMapIntensity = 0.8;
    }
  });
  scene.add(model);
  frameModel();
  loader.classList.add('hide');
}, (ev) => {
  if (ev.total) { const p = Math.min(100, Math.round(ev.loaded / ev.total * 100));
    barFill.style.width = p + '%'; loadLbl.textContent = 'MODEL YÜKLENİYOR… ' + p + '%'; }
}, (err) => { errEl.style.display = 'flex';
  errMsg.textContent = (err && err.message) || 'Bilinmeyen hata'; console.error(err); });

function toPhysicalStone(m) {
  const p = new THREE.MeshPhysicalMaterial({
    map: m.map, normalMap: m.normalMap, roughnessMap: m.roughnessMap,
    color: m.color, metalness: 0.0,
  });
  if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
  p.roughness = 1.0;                 // roughnessMap drives it
  p.envMapIntensity = 0.55;
  p.clearcoat = 0.7;                 // wet-polished serpentine sheen
  p.clearcoatRoughness = 0.28;
  p.normalScale = new THREE.Vector2(0.6, 0.6);
  p.name = m.name;
  return p;
}

function frameModel() {
  const box = new THREE.Box3().setFromObject(model);
  box.getCenter(center);
  radius = box.getSize(new THREE.Vector3()).length() / 2;
  const d = radius;

  ground.position.y = box.min.y + 0.0005;
  blob.position.set(center.x, box.min.y + 0.001, center.z);
  blob.scale.set(radius * 2.6, radius * 2.2, 1);

  key.position.set(center.x + d*1.5, center.y + d*2.2, center.z + d*1.7);
  key.target.position.copy(center);
  key.shadow.camera.near = d*0.2; key.shadow.camera.far = d*14;
  const s = d*2.4; Object.assign(key.shadow.camera,{left:-s,right:s,top:s,bottom:-s});
  key.shadow.camera.updateProjectionMatrix();
  fill.position.set(center.x - d*2.2, center.y + d*0.7, center.z + d*1.3);
  fill.target.position.copy(center);
  rim.position.set(center.x + d*0.5, center.y + d*1.3, center.z - d*2.4);
  rim.target.position.copy(center);
  // backlight sits below/behind so fibre tips glow
  backlight.position.set(center.x - d*0.6, box.min.y - d*1.2, center.z - d*1.4);
  backlight.target.position.copy(center);

  controls.minDistance = radius*1.25; controls.maxDistance = radius*6;
  controls.target.copy(center);
  setView('three_quarter');
}

// ---------- camera presets ----------
function fitDistance(){ const fov = camera.fov*Math.PI/180; return (radius/Math.sin(fov/2))*1.05; }
function setView(name){
  if (!model) return;
  const dist = fitDistance(), dir = new THREE.Vector3();
  switch(name){
    case 'front': dir.set(0,0,1); break;
    case 'back': dir.set(0,0,-1); break;
    case 'left': dir.set(-1,0,0); break;
    case 'right': dir.set(1,0,0); break;
    case 'top': dir.set(0,1,0.001); break;
    default: dir.set(0.72,0.40,0.9).normalize();
  }
  camera.position.copy(center).addScaledVector(dir, dist);
  controls.target.copy(center); controls.update();
}

// ---------- UI ----------
document.querySelectorAll('[data-view]').forEach((b)=>b.addEventListener('click',()=>setView(b.dataset.view)));
const spinBtn = $('spinBtn');
spinBtn.addEventListener('click', ()=>{ controls.autoRotate=!controls.autoRotate; spinBtn.classList.toggle('on',controls.autoRotate); });
$('resetBtn').addEventListener('click', ()=>setView('three_quarter'));
$('bgBtn').addEventListener('click', ()=>{ bgDark=!bgDark; document.body.classList.toggle('dark',bgDark); });
$('fsBtn').addEventListener('click', ()=>{ document.fullscreenElement?document.exitFullscreen?.():app.requestFullscreen?.(); });

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();

function orbit(azDeg, elDeg = 16){
  if (!model) return;
  const az = azDeg*Math.PI/180, el = elDeg*Math.PI/180, dist = fitDistance();
  controls.autoRotate = false;
  camera.position.set(
    center.x + dist*Math.cos(el)*Math.sin(az),
    center.y + dist*Math.sin(el),
    center.z + dist*Math.cos(el)*Math.cos(az));
  camera.lookAt(center); controls.target.copy(center); controls.update();
}
window.__viewer = { get ready(){return !!model;}, setView, orbit, scene, camera, renderer };
</script>
</body>
</html>
