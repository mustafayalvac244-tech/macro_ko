<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>mioren — 3D Ürün Görüntüleyici</title>
<style>
  :root{
    --gold:#c9a24b; --panel:rgba(22,28,25,.62); --stroke:rgba(201,162,75,.32);
    --txt:#e7e2d4; --muted:#9fb0a5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#c9cdc9;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent}
  #app{position:fixed;inset:0}
  canvas{display:block;touch-action:none}

  .brand{position:absolute;top:20px;left:0;right:0;text-align:center;pointer-events:none;
    color:#20302a;letter-spacing:.4em;font-size:14px;font-weight:600;text-transform:uppercase}
  .brand small{display:block;letter-spacing:.16em;font-size:10px;font-weight:400;
    color:#5a6b60;margin-top:5px;text-transform:none}
  body.dark .brand{color:#e7e2d4} body.dark .brand small{color:#9fb0a5}

  .toolbar{position:absolute;top:14px;right:14px;display:flex;gap:8px}
  .seg{position:absolute;left:50%;transform:translateX(-50%);bottom:74px;
    display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:94vw}
  .controls{position:absolute;left:0;right:0;bottom:18px;display:flex;gap:9px;
    justify-content:center;align-items:center;flex-wrap:wrap;padding:0 12px}

  .btn{appearance:none;border:1px solid var(--stroke);background:var(--panel);
    color:var(--txt);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    padding:9px 14px;border-radius:999px;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.16s;white-space:nowrap}
  .btn:hover{border-color:var(--gold);color:#fff;background:rgba(30,42,34,.8)}
  .btn:active{transform:translateY(1px)}
  .btn.on{border-color:var(--gold);color:#1a130a;background:var(--gold)}
  .btn.icon{padding:9px 11px}
  .chip{font-size:12px;padding:7px 12px}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.75}

  .loader{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;
    align-items:center;justify-content:center;background:#c9cdc9;z-index:9;transition:opacity .5s}
  body.dark .loader{background:#151d18}
  .loader.hide{opacity:0;pointer-events:none}
  .ring{width:46px;height:46px;border-radius:50%;border:3px solid rgba(0,0,0,.15);
    border-top-color:var(--gold);animation:spin 1s linear infinite}
  body.dark .ring{border-color:rgba(255,255,255,.12);border-top-color:var(--gold)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bar{width:190px;height:4px;border-radius:2px;background:rgba(0,0,0,.14);overflow:hidden}
  body.dark .bar{background:rgba(255,255,255,.14)}
  .bar>i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
  .lbl{color:#5a6b60;font-size:12px;letter-spacing:.12em}
  body.dark .lbl{color:#9fb0a5}
  .err{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;align-items:center;
    justify-content:center;z-index:10;background:#c9cdc9;color:#7a2a2a;text-align:center;padding:24px}
  body.dark .err{background:#151d18;color:#e6b6b6}
</style>
</head>
<body>
<div id="app">
  <div class="brand">mioren<small>Yeşim Taşı Kontur Fırçası · 360° Görünüm</small></div>

  <div class="toolbar">
    <button class="btn icon" id="bgBtn" title="Arka plan">◑</button>
    <button class="btn icon" id="fsBtn" title="Tam ekran">⛶</button>
  </div>

  <div class="seg">
    <button class="btn chip" data-view="front">Ön</button>
    <button class="btn chip" data-view="back">Arka</button>
    <button class="btn chip" data-view="left">Sol</button>
    <button class="btn chip" data-view="right">Sağ</button>
    <button class="btn chip" data-view="top">Üst</button>
    <button class="btn chip" data-view="three_quarter">3/4</button>
  </div>

  <div class="controls">
    <button class="btn on" id="spinBtn"><span class="dot"></span>Otomatik Döndür</button>
    <button class="btn" id="resetBtn">Görünümü Sıfırla</button>
  </div>

  <div class="loader" id="loader">
    <div class="ring"></div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="lbl" id="loadLbl">MODEL YÜKLENİYOR…</div>
  </div>
  <div class="err" id="err">
    <div style="font-size:15px">Model yüklenemedi.</div>
    <div class="lbl" id="errMsg"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODEL_URL = './mioren_brusher.glb';
const app = document.getElementById('app');
const loader = document.getElementById('loader');
const barFill = document.getElementById('barFill');
const loadLbl = document.getElementById('loadLbl');
const errEl = document.getElementById('err');
const errMsg = document.getElementById('errMsg');

const BG = { light: 0xc9cdc9, dark: 0x151d18 };
let bgDark = false;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG.light);

// studio environment (image-based lighting for realistic reflections)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- camera (product-photography ~85mm equivalent) ----------
const camera = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, 0.001, 100);

// ---------- lights: key / fill / rim ----------
const key = new THREE.DirectionalLight(0xfff4e2, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.5;
scene.add(key);
const fill = new THREE.DirectionalLight(0xbfd0d6, 0.8);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.4);
scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

// ---------- ground + contact shadow ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.9;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 0.02;
controls.maxDistance = 5;

// ---------- load model ----------
const draco = new DRACOLoader();
draco.setDecoderPath('./vendor/jsm/libs/draco/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(draco);

let model, radius = 1, center = new THREE.Vector3();

gltfLoader.load(MODEL_URL, (gltf) => {
  model = gltf.scene;
  model.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material) {
        o.material.envMapIntensity = 0.7;
        // fibre bundle: matte, double-sided so strands read from every angle
        if (o.material.name && /fiber/i.test(o.material.name)) {
          o.material.side = THREE.DoubleSide;
          o.material.shadowSide = THREE.DoubleSide;
          o.material.envMapIntensity = 0.12;
          o.material.roughness = 0.85;
          o.material.metalness = 0.0;
        }
      }
    }
  });
  scene.add(model);
  frameModel();
  loader.classList.add('hide');
}, (ev) => {
  if (ev.total) {
    const p = Math.min(100, Math.round(ev.loaded / ev.total * 100));
    barFill.style.width = p + '%';
    loadLbl.textContent = 'MODEL YÜKLENİYOR… ' + p + '%';
  }
}, (err) => {
  errEl.style.display = 'flex';
  errMsg.textContent = (err && err.message) ? err.message : 'Bilinmeyen hata';
  console.error(err);
});

function frameModel() {
  const box = new THREE.Box3().setFromObject(model);
  box.getCenter(center);
  radius = box.getSize(new THREE.Vector3()).length() / 2;

  // drop ground to the model's underside (brush tips)
  ground.position.y = box.min.y;

  // scale-independent light placement
  const d = radius;
  key.position.set(center.x + d * 1.4, center.y + d * 2.0, center.z + d * 1.6);
  key.target.position.copy(center); scene.add(key.target);
  key.shadow.camera.near = d * 0.2;
  key.shadow.camera.far = d * 12;
  const s = d * 2.2;
  Object.assign(key.shadow.camera, { left: -s, right: s, top: s, bottom: -s });
  key.shadow.camera.updateProjectionMatrix();
  fill.position.set(center.x - d * 2.0, center.y + d * 0.6, center.z + d * 1.2);
  fill.target.position.copy(center); scene.add(fill.target);
  rim.position.set(center.x + d * 0.4, center.y + d * 1.2, center.z - d * 2.2);
  rim.target.position.copy(center); scene.add(rim.target);

  controls.minDistance = radius * 1.3;
  controls.maxDistance = radius * 6;
  controls.target.copy(center);
  setView('three_quarter');
}

// ---------- camera presets ----------
function fitDistance() {
  const fov = camera.fov * Math.PI / 180;
  return (radius / Math.sin(fov / 2)) * 1.08;
}
function setView(name) {
  if (!model) return;
  const dist = fitDistance();
  const c = center, dir = new THREE.Vector3();
  switch (name) {
    case 'front': dir.set(0, 0, 1); break;
    case 'back':  dir.set(0, 0, -1); break;
    case 'left':  dir.set(-1, 0, 0); break;
    case 'right': dir.set(1, 0, 0); break;
    case 'top':   dir.set(0, 1, 0.001); break;
    default:      dir.set(0.72, 0.42, 0.9).normalize(); // three-quarter
  }
  camera.position.copy(c).addScaledVector(dir, dist);
  controls.target.copy(c);
  controls.update();
}

// ---------- UI ----------
document.querySelectorAll('[data-view]').forEach((b) =>
  b.addEventListener('click', () => setView(b.dataset.view)));

const spinBtn = document.getElementById('spinBtn');
spinBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.classList.toggle('on', controls.autoRotate);
});
document.getElementById('resetBtn').addEventListener('click', () => setView('three_quarter'));

document.getElementById('bgBtn').addEventListener('click', () => {
  bgDark = !bgDark;
  document.body.classList.toggle('dark', bgDark);
  scene.background = new THREE.Color(bgDark ? BG.dark : BG.light);
});

document.getElementById('fsBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) app.requestFullscreen?.();
  else document.exitFullscreen?.();
});

// ---------- resize + loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

// expose for headless validation
window.__viewer = { get ready() { return !!model; }, setView, scene, camera, renderer };
</script>
</body>
</html>
