name: Edge İşlevi Dağıt

# NEDEN BU DOSYA VAR.
# "supabase functions deploy harvest-tick" bir SQL komutu DEĞİLDİR ve SQL
# Editor'den çalıştırılamaz. Edge işlevleri Postgres'in içinde yaşamıyor:
# Deno ile yazılmış ayrı bir çalışma zamanında koşuyorlar ve dağıtmak, kodu
# Supabase'e YÜKLEMEK demek. Veritabanına SQL yazmakla ilgisi yok.
#
# Normal yolu Supabase CLI'yi bilgisayara kurmak. Bu iş akışı o adımı gereksiz
# kılıyor: CLI GitHub'ın makinesinde kuruluyor, kod depodan alınıp yükleniyor.
# Tarayıcıdan Actions → Run workflow demek yetiyor.
#
# GEREKEN TEK SECRET (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN
#     supabase.com/dashboard/account/tokens adresinden üretilir.
#     DİKKAT: bu, veritabanı service_role anahtarı DEĞİLDİR; hesap düzeyinde
#     bir erişim belirtecidir ve projelerini yönetme yetkisi verir. Bu yüzden
#     yalnız secret olarak durmalı, hiçbir sohbete/isteme yazılmamalı.
#
# Proje kimliği secret DEĞİL: zaten mobil uygulamanın ve web derlemesinin
# içinde, herkese açık. Gizli olmayanı secret yapmak, kurulumda ikinci bir
# yazım hatası ihtimali doğuruyor (hasat iş akışında aynı gerekçe yazılı).

# ─────────────────── İKİ TUZAK — 15.09.2026'DA İKİSİNE DE DÜŞÜLDÜ ───────────
#
# 1) VARSAYILAN İŞLEV SESSİZCE YANLIŞ OLANI DAĞITIR.
#    `_shared/katman.ts`'teki deneme hakkı 3 → 10 yapıldı ve iş akışı GİRDİ
#    VERİLMEDEN tetiklendi. `islev` varsayılanı `harvest-tick` olduğu için
#    koşu "success" dedi — çünkü harvest-tick'i GERÇEKTEN dağıttı — ama
#    ai-chat ve ictihat 2 gün öncesinin kodunda kaldı. Ekran 10 yazarken
#    sunucu 3 uyguluyordu ve bunu yalnız `updated_at` damgalarına bakınca
#    fark ettik.
#    DERS: "success" DAĞITILDI demek değil, KOMUT HATASIZ KOŞTU demek.
#    Dağıtımdan sonra doğrulama: list_edge_functions → `updated_at`
#    gerçekten az önce mi? Sürüm numarası arttı mı?
#    Varsayılan bu yüzden artık HEPSİ değil, harvest-tick de değil:
#    bilerek seçilmeden hiçbir şey dağıtılmasın diye `SECIM-YAPILMADI`.
#
# 2) `_shared/` DEĞİŞİKLİĞİ BİR İŞLEVİ DEĞİŞTİRMİŞ GİBİ GÖRÜNMEZ.
#    `_shared/katman.ts` ai-chat VE ictihat tarafından import ediliyor. O
#    dosyaya dokunan bir değişiklikte İKİSİ BİRDEN dağıtılmalı; yalnız
#    birini dağıtmak iki ucun farklı kural uygulamasına yol açar.
#
# 3) JWT BAYRAĞI CANLI AYARI SESSİZCE ÇEVİRİR.
#    Depoda `supabase/config.toml` YOK, yani `verify_jwt` yalnız bu
#    iş akışının bayrağıyla belirleniyor. Canlıdaki durum (15.09.2026):
#        ai-chat ......... verify_jwt = FALSE
#        ictihat ......... verify_jwt = TRUE
#        ai-saglik ....... verify_jwt = TRUE
#        harvest-tick .... verify_jwt = TRUE
#    Varsayılan `true` ile ai-chat dağıtılırsa ayarı FALSE'tan TRUE'ya
#    ÇEVİRİR. Her işlevi KENDİ mevcut ayarıyla dağıtın; emin değilseniz
#    önce canlıdaki değere bakın, varsaymayın.

on:
  workflow_dispatch:
    inputs:
      islev:
        description: 'Dağıtılacak işlev — _shared/ değiştiyse ai-chat VE ictihat, ikisi de'
        type: choice
        default: SECIM-YAPILMADI
        options:
          - SECIM-YAPILMADI    # bilerek seçilmeden dağıtım olmasın
          - harvest-tick
          - katalog-tick
          - ai-chat
          - ictihat
          - embed-ictihat
          - ai-saglik
          - doc-extract
          - HEPSİ
      jwt_dogrulama:
        description: 'JWT doğrulaması açık kalsın (varsayılan: evet)'
        type: boolean
        default: true

jobs:
  dagit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: wjshlysfmeqlnfiibknj
    steps:
      - uses: actions/checkout@v4

      # Eksik secret'ı sessizce geçme: CLI anlaşılmaz bir kimlik hatasıyla
      # düşer ve sebebi kayıtta kaybolur.
      - name: Secret kontrolü
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN tanımlı değil."
            echo "::error::supabase.com/dashboard/account/tokens → yeni token → Settings > Secrets and variables > Actions"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Seçim yapılmadan dağıtım yok. Girdisiz tetiklendiğinde eskiden
      # varsayılan işlev sessizce dağıtılıyordu ve koşu "success" diyordu
      # (bkz. dosya başındaki 1. tuzak). Artık açıkça düşüyor.
      - name: Seçim kontrolü
        run: |
          if [ "${{ inputs.islev }}" = "SECIM-YAPILMADI" ]; then
            echo "::error::Dağıtılacak işlev seçilmedi."
            echo "::error::Actions → Run workflow → 'Dağıtılacak işlev' listesinden seçin."
            echo "::error::_shared/ altında bir şey değiştiyse ai-chat VE ictihat, ikisini de dağıtın."
            exit 1
          fi

      - name: Dağıt
        run: |
          BAYRAK=""
          if [ "${{ inputs.jwt_dogrulama }}" != "true" ]; then
            BAYRAK="--no-verify-jwt"
          fi

          if [ "${{ inputs.islev }}" = "HEPSİ" ]; then
            # DİKKAT: hepsini dağıtmak, depoda duran HER işlevin canlıdakini
            # ezmesi demektir. Depo ile canlı ayrışmışsa beklenmedik değişiklik
            # gider. Tek işlev dağıtmak varsayılan olması bu yüzden.
            supabase functions deploy --project-ref "$PROJECT_ID" $BAYRAK
          else
            supabase functions deploy "${{ inputs.islev }}" --project-ref "$PROJECT_ID" $BAYRAK
          fi

      - name: Ne dağıtıldı
        if: success()
        run: |
          {
            echo "## Dağıtıldı: ${{ inputs.islev }}"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "JWT doğrulaması: \`${{ inputs.jwt_dogrulama }}\`"
            echo ""
            echo "### ÖNCE BUNU DOĞRULAYIN — 'success' yetmez"
            echo "Bu koşunun başarılı olması, komutun hatasız koştuğu anlamına"
            echo "gelir; DOĞRU işlevin dağıtıldığı anlamına gelmez. 15.09.2026'da"
            echo "tam olarak bu oldu: yanlış işlev dağıtıldı, koşu yine yeşildi."
            echo ""
            echo "Supabase panelinde Edge Functions listesine bakın:"
            echo "- \`${{ inputs.islev }}\` için **Last updated** az önce mi?"
            echo "- Sürüm numarası bir arttı mı?"
            echo "- **verify_jwt** beklediğiniz değerde mi? (bayrak onu EZER)"
            echo ""
            echo "\`_shared/\` altında bir şey değiştiyse ai-chat ve ictihat'in"
            echo "İKİSİ de dağıtılmalı — biri eksik kalırsa iki uç farklı kural"
            echo "uygular."
            echo ""
            echo "### harvest-tick dağıtıldıysa bu sürümle gelen düzeltmeler"
            echo "- Kotaya takılınca sayfa artık İLERLEMİYOR: her sayfanın"
            echo "  yarısının kalıcı olarak atlanması sona erdi."
            echo "- \`oncelik\` sütunu yoksa \`last_run\` sıralamasına geri düşüyor;"
            echo "  eksik bir migration hasadı sessizce durduramıyor."
            echo "- Yanıta \`yarim: true\` alanı eklendi (teşhis için)."
            echo ""
            echo "### Doğrulama"
            echo "Birkaç dakika sonra SQL Editor'de:"
            echo '```sql'
            echo "select * from public.hasat_saglik() where bolum = 'edge_yanit';"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
