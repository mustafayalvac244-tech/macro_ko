name: Kontrol

# NEDEN VAR. Depoda 591 test ve iki ayrı tip denetimi var ama HİÇBİRİ otomatik
# koşmuyordu: hepsi elle çalıştırıldığı kadar çalışıyordu. Uç işlevlerinin tip
# denetimi bundan daha kötü durumdaydı — kök tsconfig o dizini hariç tutuyor,
# ayrı denetimi de kimse koşmuyordu. deno-shim.d.ts tam bu yüzden (blok dışına
# taşan bir değişken kullanıcının isteğinde çökecekti) yazılmıştı ve yazıldığı
# günden beri yalnız elle koşuldu.
#
# Üç denetim de dakikalar değil SANİYELER sürüyor; elle koşmayı hatırlamaya
# bağlı bırakmanın hiçbir gerekçesi yok.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Değişen migration'ları bulabilmek için geçmiş gerekiyor.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Uygulama tip denetimi
        run: npx tsc --noEmit

      - name: Uç işlevleri tip denetimi
        run: npx tsc -p supabase/functions

      - name: Testler
        run: npx vitest run

      # ANASAYFADAKİ CANLI DENETİM — GERÇEK TARAYICIDA.
      #
      # Sayfa artık ürünün ÇALIŞTIĞINI iddia ediyor: ziyaretçi kendi metnini
      # yapıştırıp denetimi orada koşturuyor. İddianın kendisi sınanmadan
      # yayına gitmemeli. Ayrıca docs/denetim.js elle yazılmaz; kaynaktan
      # derlenir. Burada YENİDEN derleyip depodakiyle karşılaştırıyoruz:
      # kaynak değişip derleme unutulursa site eski mantığı çalıştırır ve
      # sunucu ile site farklı şeyler söylemeye başlar.
      #
      # Bu adım, tarayıcı sınamasında çıkan gerçek bir hatadan sonra eklendi:
      # arka arkaya iki karar anıldığında ikincisinin dairesi birincisinden
      # okunuyordu (bkz. kararAtif.ts, sonEslesme).
      - name: Site denetimi güncel mi
        run: |
          node scripts/site-denetim-derle.mjs
          if ! git diff --quiet -- docs/denetim.js; then
            echo "::error::docs/denetim.js kaynakla uyumsuz. Çalıştırın: node scripts/site-denetim-derle.mjs"
            git diff --stat -- docs/denetim.js
            exit 1
          fi

      # WEB UYGULAMASININ DERİN BAĞLANTILARI.
      #
      # Uygulama SPA olarak dışa aktarılıyor: yalnız index.html var, yollar
      # tarayıcıda çözülüyor. GitHub Pages statik sunucu olduğu için
      # /app/forgot-password gibi bir yolda 404 veriyordu (canlıda ölçüldü).
      # Kod ekranındayken sayfayı yenileyen kullanıcı akışın başına dönüyor
      # ve elindeki kodu kaybediyordu.
      #
      # BU KONTROL BİR KEZ YANLIŞ YAZILDI. Önce docs/app/404.html üretilip
      # index.html ile eşitliği aranıyordu. GitHub Pages 404.html'i YALNIZ
      # YAYIN KÖKÜNDEN okur; alt klasördeki dosyaya hiç bakmaz. Kontrol
      # geçiyordu ama canlıda GitHub'ın kendi hata sayfası çıkıyordu — yani
      # yeşil CI yanlış bir şeyi doğruluyordu.
      #
      # site-404-sina.mjs artık Pages'in gerçek kurallarını uygulayan bir
      # sunucu kurup gerçek tarayıcıyla sınıyor: derin yol doğru ekranı
      # açıyor mu, adres korunuyor mu, ve uygulama DIŞINDAKİ yanlış bir
      # adres düzgün 404 gösteriyor mu (uygulamayı açmıyor mu).
      - name: Kökteki 404 yerinde mi
        run: |
          if [ ! -f docs/404.html ]; then
            echo "::error::docs/404.html yok (KÖKTE olmalı). npm run export:web çalıştırın."
            exit 1
          fi
          if [ -f docs/app/404.html ]; then
            echo "::error::docs/app/404.html duruyor — Pages bunu okumaz, kafa karıştırır. Silin."
            exit 1
          fi
          if ! grep -q "vekil-derin-yol-geri-yukle" docs/app/index.html; then
            echo "::error::docs/app/index.html geri yükleme betiğini içermiyor. npm run export:web çalıştırın."
            exit 1
          fi

      # WEB PAKETİ BAYATLADI MI.
      # -----------------------------------------------------------------
      # NEDEN VAR: 13.09.2026 denetiminde docs/app'in üç sürüm geride kaldığı
      # ölçüldü — zaman kaydı, makbuz ve gecikme düzeltmesi kaynakta vardı ama
      # vekilpro.app/app hâlâ eski paketi servis ediyordu. Kimse fark etmedi
      # çünkü CI yalnız dosyaların VARLIĞINI kontrol ediyordu, GÜNCELLİĞİNİ
      # değil. Kullanıcı "düzelttim" denen bir hatayı ekranında görmeye devam
      # ederse, hata düzeltilmemiş demektir.
      #
      # Ölçüm basit ve kesin: app/ veya src/ içine dokunan son commit,
      # docs/app'e dokunan son committen YENİYSE paket bayattır.
      - name: Web paketi kaynakla aynı sürümde mi
        run: |
          kaynak=$(git log -1 --format=%ct -- app src package.json)
          paket=$(git log -1 --format=%ct -- docs/app)
          if [ -z "$paket" ]; then
            echo "::error::docs/app hiç derlenmemiş. npm run export:web çalıştırın."
            exit 1
          fi
          if [ "$kaynak" -gt "$paket" ]; then
            echo "::error::Web paketi BAYAT: kaynak $(date -d @$kaynak '+%Y-%m-%d %H:%M'), paket $(date -d @$paket '+%Y-%m-%d %H:%M'). npm run export:web çalıştırıp docs/app'i işleyin."
            git log --oneline --format='  %h %s' "$paket"..HEAD -- app src | head -10
            exit 1
          fi
          echo "Web paketi güncel."

      # FONKSİYON GÖVDESİ SONLANDIRILMIŞ MI.
      # -----------------------------------------------------------------
      # NEDEN VAR: 0068 ve 0069, kapanış etiketinden ($function$) sonra ';'
      # taşımadığı için HER koşucuda sözdizimi hatası veriyordu; ardındaki
      # GRANT satırı gövdenin devamı sanılıyordu. İkisi de aylarca fark
      # edilmedi çünkü CI yalnız DEĞİŞEN göçleri deniyor ve bu dosyalar
      # yazıldıktan sonra hiç değişmedi.
      - name: Migration fonksiyon gövdeleri kapanıyor mu
        run: |
          python3 - <<'PYEOF'
          import re, glob, os, sys
          bozuk = []
          for f in sorted(glob.glob('supabase/migrations/*.sql')):
              m_ = open(f, encoding='utf-8').read()
              for m in re.finditer(r'^(\$[a-zA-Z_]*\$)[ \t]*$', m_, re.M):
                  etiket = m.group(1)
                  kalan = m_[m.end():].lstrip('\n \t')
                  if m_[:m.start()].count(etiket) % 2 == 1 and kalan and not kalan.startswith(';'):
                      bozuk.append(f"{os.path.basename(f)}: {etiket} sonrası ';' yok")
          for b in bozuk:
              print(f"::error::{b}")
          sys.exit(1 if bozuk else 0)
          PYEOF

      - name: Tarayıcıda site sınaması
        # playwright-core kendi kurulum komutunu taşıyor; ayrıca `playwright`
        # paketini bağımlılığa eklemeye gerek yok. Yerelde Chromium zaten
        # kurulu olduğu için betik onu bulur; burada indiriliyor.
        run: |
          npx playwright-core install --with-deps chromium
          node scripts/site-denetim-sina.mjs
          node scripts/site-404-sina.mjs

      # Migration'lar gerçek Postgres'te koşturulur: sözdizimi, tip, yetki ve
      # tetikleyici hataları ancak çalıştırınca görülüyor (0095 bunu pahalı
      # öğretti).
      #
      # YALNIZ DEĞİŞEN MIGRATION'LAR koşturulur, hepsi değil. Ölçüldü: depodaki
      # 118 migration'ın 43'ü taklit şemada düşüyor, çünkü taklit yalnız
      # dokunulan tabloları emüle ediyor (kasten — bkz. supabase-taklit.sql).
      # Hepsini koşturmak CI'yı kalıcı kırmızıya boyar; kalıcı kırmızı bir CI,
      # olmayan CI'dan daha kötüdür çünkü gerçek hatayı da gizler.
      - name: Değişen migration'ları bul
        id: degisen
        run: |
          ONCE="${{ github.event.before }}"
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            ONCE="origin/${{ github.base_ref }}"
          elif [ -z "$ONCE" ] || [ "$ONCE" = "0000000000000000000000000000000000000000" ]; then
            ONCE="HEAD~1"
          fi
          NUMARALAR=$(git diff --name-only --diff-filter=ACM "$ONCE" HEAD -- supabase/migrations/ 2>/dev/null \
            | sed -n 's#.*/\([0-9]\{4\}\)_.*#\1#p' | sort -u | tr '\n' ' ')
          echo "numaralar=$NUMARALAR" >> "$GITHUB_OUTPUT"
          echo "Koşturulacak: ${NUMARALAR:-(yok)}"

      - name: Migration denemesi (gerçek Postgres)
        if: steps.degisen.outputs.numaralar != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16
          # sudo ŞART: betik sunucuyu `su postgres` ile başlatıyor ve bu ancak
          # root'tan parolasız çalışır. Runner'da `runner` kullanıcısıyız, o
          # yüzden ilk koşuda "su: Authentication failure" ile düştü.
          sudo -E bash scripts/migration-deneme/calistir.sh ${{ steps.degisen.outputs.numaralar }}
