name: Migration Uygula

# NEDEN VAR. Migration'lar bugüne kadar Supabase SQL Editor'e ELLE
# yapıştırılarak uygulanıyordu. Bu, her seferinde birinden "şunu çalıştır" diye
# istemeyi gerektiriyordu ve üç somut soruna yol açtı:
#   • Hangi dosyanın uygulandığı hiçbir yerde kayıtlı değildi (0093/0094'ün
#     durumunu haftalarca bilemedik).
#   • SQL Editor çok ifadeli dosyada yalnız SON sorgunun sonucunu gösteriyor,
#     yani doğrulama çıktıları görünmüyordu.
#   • Yanlış dosyayı (ör. bir .yml) yapıştırmak kolaydı.
#
# Supabase Management API'nin sorgu ucu bunu gereksiz kılıyor. Kimlik için
# zaten tanımlı olan SUPABASE_ACCESS_TOKEN kullanılıyor — yeni secret YOK.
#
# SINIR: dosya listesi açıkça verilir. "Hepsini uygula" kipi bilerek yok;
# depodaki 100+ migration'ı topluca çalıştırmak canlıyı bozabilir.

on:
  workflow_dispatch:
    inputs:
      migrationlar:
        description: 'Boşlukla ayrılmış numaralar (ör: 0106 0107)'
        required: true

permissions:
  contents: read

jobs:
  uygula:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Secret kontrolü
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN tanımlı değil."
            exit 1
          fi

      - name: Uygula
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: wjshlysfmeqlnfiibknj
        run: |
          set -o pipefail
          node scripts/migration-uygula.mjs ${{ inputs.migrationlar }} 2>&1 | tee /tmp/uygula.log
          {
            echo "## Uygulanan migration'lar: ${{ inputs.migrationlar }}"
            echo ''
            echo '```'
            cat /tmp/uygula.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
