name: AI Ölçümü

# NEDEN CI'DA KOŞUYOR.
# Ölçüm betikleri SUPABASE_SERVICE_ROLE_KEY istiyor — RLS'i tamamen aşan,
# veritabanının tamamına yetkili bir anahtar. Bu anahtarın bir sohbete, bir
# istem kutusuna ya da bir geliştiricinin makinesine yazılması gerekmemeli.
# Depo secret'ı olarak durur, iş akışı onu yalnız çalışma sırasında görür.
# (Hasat iş akışı da aynı secret'ı kullanıyor, yani muhtemelen zaten tanımlı.)
#
# ÖLÇÜMÜN İKİ AYRI GRUBU VAR VE MALİYETLERİ ÇOK FARKLI:
#
#   arama  → eval-arama (67 soru) + eval-ictihat (30 soru)
#            Yalnız veritabanı arama fonksiyonlarını ölçer. HİÇ AI ÇAĞRISI
#            YOK, dolayısıyla API harcaması SIFIR. İstediğin kadar koş.
#
#   ai     → dilekçe (11) + mütalaa (5) + belge (6) + sohbet (10) + künye (7)
#            + cevap (13) = 52 senaryo. Her biri gerçek bir Opus isteği, yani
#            gerçek para. 149 senaryo değil, 52 — geri kalanı ücretsiz grupta.
#
# Sonuçlar hem iş akışı kaydına yazılır hem de JSON olarak dala işlenir
# (scripts/eval-*-hatalar.json), böylece ölçüm sonucu depoda kalıcı olur ve
# iki koşu karşılaştırılabilir.

on:
  workflow_dispatch:
    inputs:
      grup:
        description: 'Hangi grup koşulsun'
        type: choice
        default: arama
        options: [arama, ai, hepsi]
      sinir:
        description: 'Grup başına en fazla senaryo (0 = hepsi). ÖNCE 1 İLE DENE.'
        default: '1'
      bekleme:
        description: 'İstekler arası bekleme (ms). Oran sınırına takılırsan artır.'
        default: '5000'
      betik_dk:
        description: 'Betik başına en fazla dakika (asılmaya karşı üst sınır)'
        default: '18'
      betikler:
        description: 'Yalnız bu betikler (boş = hepsi). Ör: eval-mutalaa eval-belge'
        default: ''
      hibrit:
        description: 'Mevzuat ölçümünde anlamsal aramayı da kat (ai-chat beslemesi böyle)'
        type: boolean
        default: false
      mevzuat_rpc:
        description: 'Ölçülecek mevzuat arama fonksiyonu. ai-chat search_mevzuat_kural kullanıyor.'
        default: 'search_mevzuat_kural'
      isle:
        description: 'Sonuç JSON dosyaları dala işlensin mi'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  olcum:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: https://wjshlysfmeqlnfiibknj.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # ANON ANAHTARI SECRET DEĞİL — ilk koşu bu yüzden boş görüp düştü.
      # Bu değer tasarımı gereği herkese açık: `sb_publishable_` önekli, zaten
      # eas.json'da, uygulama paketinde ve web derlemesinde yayımlanmış durumda.
      # Secret yapmak güvenlik katmıyordu, yalnızca kurulumda İKİNCİ bir adım
      # ve ikinci bir yazım hatası ihtimali doğuruyordu. Varsayılan yazıldı;
      # secret tanımlıysa yine o kullanılır (başka projeye taşınabilsin diye).
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_9m36QXWJNcSe9Wnaq5JVnw_agU37VsJ' }}
      EVAL_SINIR: ${{ inputs.sinir }}
      EVAL_BEKLEME: ${{ inputs.bekleme }}
      # SALT FTS ile HİBRİT farklı şeyleri ölçer. ai-chat modele mevzuatı
      # FTS + kural + anlamsal arama birlikte veriyor (buildMevzuat); salt
      # FTS ölçümü (%58,8) modelin gerçekte gördüğü beslemeyi ÖLÇMÜYORDU.
      EVAL_HIBRIT: ${{ inputs.hibrit && '1' || '' }}
      # ÖLÇÜLEN FONKSİYON, UYGULAMANIN KULLANDIĞI OLMALI. eval-arama varsayılan
      # olarak search_mevzuat_fts'i ölçüyordu; ai-chat ise search_mevzuat_kural
      # çağırıyor (buildMevzuat, 0066). Bugüne kadarki %58,8, modelin hiç
      # görmediği bir fonksiyonun ölçümüydü.
      # DİKKAT: eval-ictihat DA EVAL_RPC okuyor (vars. search_ictihat_fts).
      # Bu değişken iş düzeyinde EVAL_RPC olarak verilince içtihat ölçümü
      # mevzuat fonksiyonunu çağırdı ve 0/150 çıktı (2026-09-11 20:38). Bu
      # yüzden ad farklı; yalnız eval-arama'ya EVAL_RPC olarak aktarılıyor.
      EVAL_MEVZUAT_RPC: ${{ inputs.mevzuat_rpc || 'search_mevzuat_kural' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # SERVİS ANAHTARINI ELLE EKLETMEK YERİNE ÇALIŞMA ANINDA AL.
      #
      # Bu iş akışı iki kez düştü çünkü SUPABASE_SERVICE_ROLE_KEY secret'ı
      # eklenmemişti ve eklenmesini istemek gerekiyordu. Gerekmiyormuş: zaten
      # tanımlı olan SUPABASE_ACCESS_TOKEN ile Management API'den okunabiliyor.
      #
      # NEDEN DAHA İYİ:
      #  • Anahtar hiçbir sohbete, istem kutusuna ya da kişiye uğramıyor —
      #    yalnız koşucunun belleğinde, yalnız bu koşu boyunca yaşıyor.
      #  • Anahtar Supabase'de döndürülürse (rotate) burada kendiliğinden
      #    güncel gelir; eskimiş bir secret'ın sessizce başarısız olması diye
      #    bir durum kalmaz.
      #  • Kurulumda bir adım daha az, dolayısıyla bir yazım hatası daha az.
      #
      # ::add-mask:: ile kayda maskelenmiş yazılır; loglarda görünmez.
      # Secret elle tanımlanmışsa ona dokunulmaz (başka projeye taşınabilsin).
      - name: Servis anahtarı
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Servis anahtarı secret'tan alındı."
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Ne SUPABASE_SERVICE_ROLE_KEY ne de SUPABASE_ACCESS_TOKEN tanımlı."
            exit 1
          fi
          ANAHTAR=$(curl -sS "https://api.supabase.com/v1/projects/wjshlysfmeqlnfiibknj/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | node -e "
              let g='';process.stdin.on('data',d=>g+=d).on('end',()=>{
                let l;try{l=JSON.parse(g)}catch{process.exit(0)}
                if(!Array.isArray(l))process.exit(0);
                // Eski sistemde 'service_role', yenisinde 'secret' adıyla geliyor.
                const k=l.find(x=>x.name==='service_role')||l.find(x=>x.type==='secret')||l.find(x=>x.name==='secret');
                if(k&&k.api_key)process.stdout.write(k.api_key);
              });")
          if [ -z "$ANAHTAR" ]; then
            echo "::error::Management API'den servis anahtarı alınamadı."
            echo "::error::Belirtecin bu projeye yetkisi olduğundan emin ol."
            exit 1
          fi
          echo "::add-mask::$ANAHTAR"
          echo "SUPABASE_SERVICE_ROLE_KEY=$ANAHTAR" >> "$GITHUB_ENV"
          echo "Servis anahtarı Management API'den alındı (maskelendi)."
          if [ "${{ inputs.grup }}" != "arama" ] && [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY boş — varsayılan da tutmadı, iş akışını kontrol et."
            exit 1
          fi
          echo "Anahtarlar yerinde."

      - name: Arama ölçümü (API harcaması yok)
        if: ${{ inputs.grup == 'arama' || inputs.grup == 'hepsi' }}
        continue-on-error: true
        run: |
          echo "## Arama ölçümü" >> $GITHUB_STEP_SUMMARY
          # Mevzuat: fonksiyon adı yalnız BU betiğe EVAL_RPC olarak geçer.
          echo "### eval-arama" >> $GITHUB_STEP_SUMMARY
          EVAL_RPC="$EVAL_MEVZUAT_RPC" node scripts/eval-arama.mjs 2>&1 | tee /tmp/eval-arama.log
          tail -12 /tmp/eval-arama.log >> $GITHUB_STEP_SUMMARY
          # İçtihat: kendi varsayılanı (search_ictihat_fts); EVAL_RPC verilmez.
          echo "### eval-ictihat" >> $GITHUB_STEP_SUMMARY
          node scripts/eval-ictihat.mjs 2>&1 | tee /tmp/eval-ictihat.log
          tail -12 /tmp/eval-ictihat.log >> $GITHUB_STEP_SUMMARY

      - name: AI ölçümü (GERÇEK PARA HARCAR)
        if: ${{ inputs.grup == 'ai' || inputs.grup == 'hepsi' }}
        continue-on-error: true
        run: |
          echo "## AI ölçümü" >> $GITHUB_STEP_SUMMARY
          # Sıra bilinçli: ucuz ve kısa olanlar önce. Bütçe biterse ya da oran
          # sınırına takılırsak, en azından bir kısmı ölçülmüş olur.
          #
          # NEDEN `timeout` VAR. Ölçüm betiklerinde istek zaman aşımı yoktu ve
          # Node'un fetch'i kendiliğinden zaman aşımına uğramaz: asılı tek bir
          # istek, 120 dakikalık iş tavanına kadar her şeyi kilitler ve sonuç
          # adımlarına hiç sıra gelmez.
          #
          # BU RİSK SOYUT DEĞİL, ÇÜNKÜ SENARYOLAR GERÇEKTEN UZUN. 2026-09-11
          # koşusunda dilekçe senaryoları 1,5-7 dakika sürdü; "yavaş" ile
          # "asılı" arasında ölçümün ayrım yapacak hiçbir aracı yoktu. O gün
          # ben de bu ikisini karıştırıp SAĞLIKLI bir koşuyu iptal ettim ve
          # mütalaa ile belge ölçümlerini kaybettim (bkz. scripts/istek.mjs).
          #
          # `| tee` sayesinde çıkış kodu tee'ninki (0) olur, yani bir betiğin
          # öldürülmesi döngüyü durdurmaz; sıradaki betik ölçülür.
          DK=${{ inputs.betik_dk }}
          # İÇ BÜTÇE, DIŞ TAVANDAN BİR DAKİKA KISA. Fark bilerek var: betik
          # kendi bütçesini dolduğunda ÖLÇTÜĞÜNÜ DOSYAYA YAZARAK durur;
          # `timeout` öldürürse hiçbir şey yazılmaz. Yani önce betik pes etsin.
          export EVAL_BETIK_BUTCESI=$(( (DK - 1) * 60000 ))
          echo "Betik başına: iç bütçe $(( DK - 1 ))dk, dış tavan ${DK}dk."
          # HANGİ BETİKLER. Boş bırakılırsa altısı da koşar.
          #
          # NEDEN SEÇİLEBİLİR OLMASI GEREKİYOR. Her senaryo gerçek bir Opus
          # isteği, yani gerçek para. Koşu ortada kalırsa (2026-09-11'de tam
          # olarak bu oldu: sohbet/künye/cevap/dilekçe ölçüldü, mütalaa ile
          # belge kaldı) eksiği tamamlamak için altısını birden koşturmak,
          # elde zaten ölçülmüş 41 senaryonun parasını ikinci kez ödemektir.
          BETIKLER='${{ inputs.betikler }}'
          [ -n "$BETIKLER" ] || BETIKLER='eval-sohbet eval-kunye eval-cevap eval-dilekce eval-mutalaa eval-belge'
          # Girdi doğrulaması: yalnız var olan ölçüm betikleri koşabilir.
          # Yoksa yazım hatası sessizce "hiç ölçüm yapılmadı" demek olurdu.
          for b in $BETIKLER; do
            if [ ! -f "scripts/$b.mjs" ]; then
              echo "::error::scripts/$b.mjs yok — betik adını kontrol et."
              exit 1
            fi
          done
          echo "Koşulacak: $BETIKLER"
          for b in $BETIKLER; do
            echo "### $b" >> $GITHUB_STEP_SUMMARY
            timeout -k 30s "${DK}m" node "scripts/$b.mjs" 2>&1 | tee "/tmp/$b.log"
            # timeout 124 ile öldürdüyse bunu RAPORA yaz; sessizce eksik bir
            # ölçüm, düşük bir orana bakıp "gerileme" demeye yol açar.
            if [ "${PIPESTATUS[0]}" = "124" ]; then
              echo "**$b ${DK} dakikada ÖLDÜRÜLDÜ — eksik ölçüm, oran çıkarmayın.**" >> $GITHUB_STEP_SUMMARY
            fi
            # Künye satırı HANGİ MODELİN cevap verdiğini söyler; ücretsiz hatta
            # düşülmüşse sonuç Opus'a atfedilemez ve bunu görmek şart.
            grep -E "Ölçülen model|KARIŞIK MODEL" "/tmp/$b.log" >> $GITHUB_STEP_SUMMARY || true
            tail -8 "/tmp/$b.log" >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: olcum-sonuclari
          path: scripts/eval-*-hatalar.json
          if-no-files-found: warn

      - name: Sonuçları dala işle
        if: ${{ always() && inputs.isle }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/eval-*-hatalar.json 2>/dev/null || true
          git diff --cached --quiet && { echo "Değişen sonuç yok."; exit 0; }
          git commit -m "Ölçüm sonucu: ${{ inputs.grup }} (sınır ${{ inputs.sinir }})"
          git push origin HEAD:${{ github.ref_name }}
