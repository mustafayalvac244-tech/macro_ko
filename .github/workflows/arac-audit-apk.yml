name: Araç Audit — APK

# NEDEN BU DOSYA VAR (27.09.2026).
# Ürün sahibi uygulamayı telefona kurmak istedi. Geliştirme ortamında APK
# derlenemiyor: Android SDK'nın indirildiği dl.google.com ağ politikasıyla
# kapalı (403). GitHub'ın ubuntu-latest makinesinde Android SDK ve NDK hazır
# geliyor; derleme burada, Expo hesabı GEREKMEDEN yerelde (gradle) yapılır.
#
# Vekil Pro'nun android-dagit.yml'i BİLEREK kullanılmadı: o, Vekil Pro'nun
# Expo projesine bağlı EAS derlemesi. Derleme burada hâlâ hesapsız (gradle).
# OTA güncellemesi hesapsız olmadığı için (28.09.2026) aynı Expo hesabında
# AYRI bir proje açıldı: @olivyeejiru/arac-audit — bkz. arac-audit-ota.yml.
#
# ÇIKTI: koşu sayfasının altında "arac-audit-apk" adlı ek (zip; 30 gün durur).
# İçindeki .apk telefona doğrudan kurulur ("bilinmeyen kaynak" izni ister).
#
# TASLAK SÜRÜME KOYMA DENENDİ, ÇALIŞMADI (28.09.2026): amaç .apk'yı zip'siz
# indirmek ve geliştirme ortamına (sohbete) getirmekti. İş akışının anahtarı
# "Contents: write" yetkisiyle açıldığı hâlde POST /releases 403 döndü
# ("Resource not accessible by integration"); geliştirme oturumunun kendisine
# de sürüm oluşturmak platform tarafından kapalı. Adım kaldırıldı.
#
# İMZA: Expo şablonunun depoya giren debug.keystore'u. Her derlemede AYNI
# anahtar olduğu için yeni APK eskisinin üstüne kurulur (veriler silinmez).
# Play Store'a yüklenemez — bu yalnız elle dağıtım içindir.

# Derleme yalnız UYGULAMA değişince başlar. Bu dosyanın kendisi bilerek
# listede YOK: iş akışını düzenlemek 18 dakikalık bir derleme başlatmasın
# (ilk başarılı derleme 17 dk 21 sn sürdü, 27.09.2026).
on:
  push:
    branches: ['claude/vehicle-audit-app-rear95']
    paths:
      - 'arac-audit-app/**'
  workflow_dispatch:

permissions:
  contents: read

# Art arda iki push gelirse eskisini boşuna bitirme.
concurrency:
  group: arac-audit-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: arac-audit-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: arac-audit-app/package-lock.json

      # Gradle 9 ve Android Gradle eklentisi JDK 17+ istiyor.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bağımlılıklar
        run: npm ci

      # Yayına girmeden önce tip denetimi: kırık kodla APK üretmenin anlamı yok.
      - name: Tip denetimi
        run: npx tsc --noEmit

      # android/ klasörü depoda YOK; app.json'dan her derlemede üretilir.
      - name: Android projesini üret
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      # GRADLE BELLEĞİ (28.09.2026). expo-updates derlemeye altı Android modülü
      # ekledi (expo-updates, -interface, -eas-client, -json-utils, -manifests,
      # -structured-headers). Koşu 36408769922'de yayın öncesi lint analizleri
      # Expo şablonunun sınırına (heap 2 GiB, metaspace 512 MiB) sığmadı:
      # "OutOfMemoryError: Metaspace", üç lintVitalAnalyzeRelease görevi düştü.
      # Kullanıcı düzeyindeki gradle.properties, projedekini ezer (Gradle'ın
      # özellik önceliği). Koşucuda 16 GB bellek var.
      - name: Gradle belleği
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties

      # İki mimari: arm64-v8a (güncel telefonların hepsi) ve armeabi-v7a
      # (32 bit Android çalıştıran ucuz telefonlar). x86 yalnız emülatör içindir.
      - name: APK derle
        working-directory: arac-audit-app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: APK'yı adlandır
        id: ad
        run: |
          kisa="$(git rev-parse --short HEAD)"
          ad="arac-audit-${kisa}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$ad"
          echo "ad=$ad" >> "$GITHUB_OUTPUT"
          ls -la "$ad"

      - uses: actions/upload-artifact@v4
        with:
          name: arac-audit-apk
          path: arac-audit-app/${{ steps.ad.outputs.ad }}
          retention-days: 30
          if-no-files-found: error

      # APK'NIN İÇİNİ DENETLE (28.09.2026). Geliştirme ortamı APK'yı indiremiyor
      # (artifact deposu ağda kapalı); içinde ne olduğunu ancak burada görürüz.
      # OTA için üçü şart ve biri tutmazsa güncelleme HATA VERMEDEN hiç inmez:
      #   - güncelleme adresi app.json'daki projeye işaret etmeli,
      #   - kanal başlığı "production" olmalı,
      #   - çalışma zamanı app.json'daki sürümle aynı olmalı.
      # Kontrol vakası: paket adı dökümde MUTLAKA vardır. O bulunamazsa sorun
      # ayarda değil aracın kendisindedir — "yok" sonuçlarına güvenilmez.
      # Ek yüklendikten SONRA koşar: denetim bozuk çıkarsa derleme boşa gitmesin.
      - name: APK içi denetim (OTA ayarları)
        id: denetim
        run: |
          set -euo pipefail
          apk="${{ steps.ad.outputs.ad }}"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          echo "araç: $aapt2"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > /tmp/manifest.txt
          "$aapt2" dump resources "$apk" > /tmp/kaynaklar.txt
          grep -q 'com.aracaudit.app' /tmp/manifest.txt \
            || { echo "::error::Kontrol vakası düştü: paket adı dökümde yok, araç çalışmıyor."; exit 1; }

          kimlik="$(node -p "require('./app.json').expo.extra?.eas?.projectId ?? ''")"
          surum="$(node -p "require('./app.json').expo.version")"
          [ -n "$kimlik" ] || { echo "::error::app.json'da extra.eas.projectId yok; bu APK OTA alamaz."; exit 1; }

          grep -q "https://u.expo.dev/$kimlik" /tmp/manifest.txt \
            || { echo "::error::Güncelleme adresi APK'da yok ya da başka projeye işaret ediyor."; exit 1; }
          grep -q 'expo-channel-name' /tmp/manifest.txt && grep -q 'production' /tmp/manifest.txt \
            || { echo "::error::Kanal başlığı (production) APK'da yok."; exit 1; }
          grep -A2 'expo_runtime_version' /tmp/kaynaklar.txt | grep -q "\"$surum\"" \
            || { echo "::error::Çalışma zamanı APK'da $surum değil."; grep -A2 'expo_runtime_version' /tmp/kaynaklar.txt || true; exit 1; }
          unzip -l "$apk" | grep -q 'assets/app.manifest' \
            || { echo "::error::Gömülü güncelleme bildirimi (assets/app.manifest) APK'da yok."; exit 1; }

          echo "kimlik=$kimlik" >> "$GITHUB_OUTPUT"
          echo "surum=$surum" >> "$GITHUB_OUTPUT"
          echo "OTA ayarları APK'da doğrulandı: proje $kimlik, kanal production, çalışma zamanı $surum."

      - name: Özet
        if: success()
        run: |
          {
            echo "## Araç Audit APK"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "- Aşağıdaki **Artifacts** bölümünden \`arac-audit-apk\` zip'ini indirin,"
            echo "  içindeki \`${{ steps.ad.outputs.ad }}\` dosyasını telefona atıp açın."
            echo "- Telefon \"bilinmeyen kaynak\" izni isteyebilir."
            echo "- Play Store'a yüklenemez (debug anahtarıyla imzalı)."
            echo ""
            echo "### OTA — APK'nın içinde doğrulandı"
            echo "- Güncelleme adresi: \`https://u.expo.dev/${{ steps.denetim.outputs.kimlik }}\`"
            echo "- Kanal: \`production\` · Çalışma zamanı: **${{ steps.denetim.outputs.surum }}**"
            echo "- Bu APK, çalışma zamanı ${{ steps.denetim.outputs.surum }} olan OTA güncellemelerini alır."
          } >> "$GITHUB_STEP_SUMMARY"
