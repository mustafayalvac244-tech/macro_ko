name: Araç Audit — APK'yı taslak sürüme koy

# NE YAPAR (28.09.2026): YENİDEN DERLEMEZ. Bu daldaki EN SON BAŞARILI
# "Araç Audit — APK" koşusunun ekini (arac-audit-apk) indirir ve taslak sürüme
# koyar (~1 dk). Gerekçe ve taslağın görünürlüğü:
# .github/scripts/arac-audit-taslak-surum.sh
#
# Yeni derlemeler bunu kendileri yapıyor (arac-audit-apk.yml'in son adımı);
# bu iş akışı, o adım eklenmeden önce çıkmış APK'yı ve adımı düşen bir
# koşunun APK'sını taşımak için.

on:
  push:
    branches: ['claude/vehicle-audit-app-rear95']
    paths: ['.github/workflows/arac-audit-apk-teslim.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  teslim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Son başarılı APK koşusunu bul ve ekini indir
        id: bul
        run: |
          satir="$(gh run list --workflow arac-audit-apk.yml --branch "$GITHUB_REF_NAME" \
            --status success --limit 1 --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')"
          if [ -z "$satir" ] || [ "$satir" = "null null" ]; then
            echo "::error::Bu dalda başarılı bir APK koşusu yok."
            exit 1
          fi
          read -r kosu sha <<< "$satir"
          echo "Kaynak koşu: $kosu  commit: $sha"
          gh run download "$kosu" -n arac-audit-apk -D indirilen
          apk="$(ls indirilen/*.apk | head -1)"
          ls -la "$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Taslak sürüme koy
        run: .github/scripts/arac-audit-taslak-surum.sh "${{ steps.bul.outputs.apk }}" "${{ steps.bul.outputs.sha }}"
