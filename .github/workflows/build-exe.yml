name: ko-macro exe

# ko-macro.exe'yi GitHub'ın Windows makinesinde derler.
#
# İki çıktı üretir:
#   - Artifacts  : her çalışmada, ama indirmek için GitHub'a giriş gerekir.
#   - Release    : giriş yapmadan, düz linkle inebilir. Kullanıcıya
#                  verilecek yol bu.
#
# Sürüm yayımlamanın iki yolu:
#   - Etiket it:  git tag v1.0.1 && git push origin v1.0.1
#   - Ya da Actions -> "Run workflow" -> "surum" kutusuna v1.0.1 yaz.
#     Etiketi iş akışı kendi oluşturur; etiket itme yetkin yoksa bunu kullan.

on:
  workflow_dispatch:
    inputs:
      surum:
        description: 'Release etiketi (orn. v1.0.1). Bos birakirsan release yapilmaz.'
        required: false
        default: ''
  # push'ta "paths" kullanmıyoruz: etiket itildiğinde değişen-dosya listesi
  # boş olduğu için paths filtresi işi hiç tetiklemez.
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "ko-macro/python/**"

permissions:
  contents: write

jobs:
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        working-directory: ko-macro/python
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pyserial rich pytest

      - name: Python testleri
        working-directory: ko-macro/python
        run: python -m pytest tests -q

      - name: Firmware testleri
        run: ko-macro/arduino/test/run_tests.sh

  build:
    name: Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        working-directory: ko-macro/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Derle
        working-directory: ko-macro/python
        run: python -m PyInstaller ko-macro.spec --noconfirm --clean

      - name: Paketi hazırla
        working-directory: ko-macro/python
        shell: pwsh
        run: |
          Copy-Item config.example.yaml dist/config.yaml
          Copy-Item baslat.bat dist/
          Copy-Item ../README.md dist/OKUBENI.md
          Copy-Item ../KURULUM.md dist/KURULUM.md
          # Firmware yükleyici de pakete girsin: kullanıcı depoyu ayrıca
          # indirmeden Leonardo'yu programlayabilsin.
          New-Item -ItemType Directory -Force -Path dist/firmware | Out-Null
          Copy-Item ../arduino/yukle.bat dist/firmware/
          Copy-Item ../arduino/yukle.ps1 dist/firmware/
          Copy-Item ../arduino/ko_hid_bridge dist/firmware/ko_hid_bridge -Recurse

      - name: Exe çalışıyor mu
        working-directory: ko-macro/python/dist
        run: |
          ./ko-macro.exe --version
          ./ko-macro.exe profiles
          ./ko-macro.exe combos -c config.yaml
          ./ko-macro.exe test "60-70-72" -c config.yaml --dry-run --countdown 0
          ./ko-macro.exe spawn add test --min 20 --max 30
          ./ko-macro.exe spawn kill test --ago 19
          ./ko-macro.exe spawn list
          ./ko-macro.exe kalibre --help
          Remove-Item spawns.json

      - name: Zip'le
        working-directory: ko-macro/python
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ko-macro-windows.zip

      - name: Yükle
        uses: actions/upload-artifact@v4
        with:
          name: ko-macro-windows
          path: ko-macro/python/dist/
          retention-days: 30

      # Etiketli sürümlerde zip'i Release'e koy: giriş yapmayan biri de
      # indirebilsin diye. Artifact'ler oturum istiyor, release dosyaları
      # istemiyor.
      - name: Release yayımla
        if: startsWith(github.ref, 'refs/tags/v') || inputs.surum != ''
        uses: softprops/action-gh-release@v2
        with:
          # Elle çalıştırıldığında etiket henüz yoktur; action onu bu
          # commit üzerinde kendisi oluşturur.
          tag_name: ${{ inputs.surum }}
          files: ko-macro/python/ko-macro-windows.zip
          generate_release_notes: true
